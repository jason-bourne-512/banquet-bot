<!DOCTYPE html>
<html lang="en" data-theme="dark" data-lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
<meta name="theme-color" content="#101820">
<link rel="icon" href="favicon-32.png" sizes="32x32">
<link rel="icon" href="favicon-16.png" sizes="16x16">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Pre-shift Scripts - Banquet Bot</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&family=Inter:wght@400;500;600&family=Barlow+Condensed:wght@500;600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
:root {
  --bg:#09090c; --bg-card:#111316; --bg-active:#181c26;
  --border:rgba(255,255,255,0.06); --border-h:rgba(255,255,255,0.13);
  --text-1:#edeae2; --text-2:#7e7b74; --text-3:#44423f; --text-4:#2e2c2a;
  --accent:#c9a84c; --accent-dim:rgba(139,209,255,0.10);
  --green:#2dbd80; --green-dim:rgba(120,214,202,0.10);
  --blue:#4f8ef0; --blue-dim:rgba(139,209,255,0.10);
  --red:#e05555; --red-dim:rgba(255,143,143,0.10);
  --purple:#a06ee8; --amber:#e2b089;
  --header-bg:rgba(16,24,32,0.94);
  --divider:rgba(255,255,255,0.04); --stripe:rgba(255,255,255,0.014);
}
[data-theme="light"] {
  --bg:#f0ece3; --bg-card:#faf7f2; --bg-active:#e8e2d6;
  --border:rgba(0,0,0,0.07); --border-h:rgba(0,0,0,0.15);
  --text-1:#18160f; --text-2:#6b6760; --text-3:#9e9a92; --text-4:#c0bbb2;
  --accent:#9a7422; --accent-dim:rgba(154,116,34,0.09);
  --green:#1a8f5e; --green-dim:rgba(26,143,94,0.09);
  --blue:#2558c4; --blue-dim:rgba(37,88,196,0.09);
  --red:#c03030; --red-dim:rgba(180,50,50,0.08);
  --purple:#7c45c0; --amber:#9a7422;
  --header-bg:rgba(240,236,227,0.94);
  --divider:rgba(0,0,0,0.05); --stripe:rgba(0,0,0,0.010);
}
html { background:var(--bg); min-height:100%; overflow-x:hidden; }
body { background:var(--bg); color:var(--text-1); font-family:'Inter',sans-serif; min-height:100vh; min-height:100dvh; width:100%; overflow-x:hidden; }
.page-wrap { max-width:520px; min-height:100vh; min-height:100dvh; margin:0 auto; background:var(--bg); }
@media (orientation:landscape){ .page-wrap { max-width:100%; } }

.page-hero { padding:20px 16px 16px; border-bottom:1px solid var(--divider); position:relative; overflow:hidden; }
.page-hero::before { content:''; position:absolute; inset:0; background:repeating-linear-gradient(-55deg,var(--stripe) 0px,var(--stripe) 1px,transparent 1px,transparent 18px); pointer-events:none; }
.page-eyebrow { font-family:'DM Mono',monospace; font-size:9px; color:var(--accent); letter-spacing:2px; text-transform:uppercase; margin-bottom:6px; }
.page-title { font-family:'Bebas Neue',sans-serif; font-size:36px; letter-spacing:1px; color:var(--text-1); line-height:0.95; margin-bottom:6px; }
.page-meta { font-family:'DM Mono',monospace; font-size:9px; color:var(--text-3); }
.page-meta a { color:var(--blue); text-decoration:none; }

.sec { font-family:'DM Mono',monospace; font-size:8px; letter-spacing:2.5px; text-transform:uppercase; color:var(--text-4); padding:16px 16px 8px; display:flex; align-items:center; gap:10px; }
.sec::after { content:''; flex:1; height:1px; background:var(--divider); }

.list { padding:0 16px 48px; display:flex; flex-direction:column; gap:10px; }
.status { font-size:13px; color:var(--text-2); padding:24px 16px; text-align:center; }
.status.err { color:var(--red); }

.ps-card { background:var(--bg-card); border:1px solid var(--border); border-radius:12px; overflow:hidden; border-left:3px solid var(--accent); }
.ps-card.open { border-color:var(--border-h); }
.ps-head { padding:13px 14px 12px; cursor:pointer; display:flex; gap:10px; align-items:flex-start; }
.ps-head:active { background:var(--bg-active); }
.ps-main { flex:1; min-width:0; }
.ps-group { font-size:14px; font-weight:600; color:var(--text-1); line-height:1.3; margin-bottom:4px; }
.ps-meta { font-family:'DM Mono',monospace; font-size:10px; color:var(--text-3); line-height:1.5; }
.ps-meta b { color:var(--text-2); font-weight:500; }
.ps-pills { display:flex; flex-wrap:wrap; gap:5px; margin-top:8px; }
.pill { font-family:'DM Mono',monospace; font-size:9px; padding:3px 7px; border-radius:999px; background:var(--accent-dim); color:var(--accent); border:1px solid rgba(139,209,255,0.18); }
.pill.ask { background:var(--red-dim); color:var(--red); border-color:rgba(255,143,143,0.25); }
.pill.mgr { background:var(--purple-dim,rgba(160,110,232,0.10)); color:var(--purple); }
.ps-chevron { font-size:11px; color:var(--text-4); transition:transform .2s; margin-top:4px; }
.ps-card.open .ps-chevron { transform:rotate(90deg); }

.ps-body { display:none; padding:0 14px 14px; border-top:1px solid var(--divider); }
.ps-card.open .ps-body { display:block; padding-top:12px; }

.ps-sub { font-family:'DM Mono',monospace; font-size:9px; text-transform:uppercase; letter-spacing:1.2px; color:var(--accent); margin:12px 0 8px; padding-bottom:5px; border-bottom:1px solid var(--divider); }
.ps-sub:first-child { margin-top:0; }

.ps-row { display:grid; grid-template-columns:110px 1fr; gap:8px; padding:7px 0; border-bottom:1px solid var(--divider); align-items:start; }
.ps-row:last-child { border-bottom:0; }
.ps-lab { font-family:'DM Mono',monospace; font-size:9px; color:var(--text-3); text-transform:uppercase; letter-spacing:0.6px; padding-top:2px; }
.ps-val { font-size:12.5px; color:var(--text-1); line-height:1.5; }
.ps-val.ask { color:var(--red); font-family:'DM Mono',monospace; font-size:11px; }
.ps-val.house { color:var(--text-2); font-style:italic; font-size:12px; }


/* Card content: color-coded bullet blocks */
.ps-sub.s-an { color:var(--accent); } .ps-sub.s-sc { color:var(--blue); } .ps-sub.s-q { color:var(--red); }
.ps-sub::before { content:""; display:inline-block; width:6px; height:6px; border-radius:50%; background:currentColor; margin-right:7px; vertical-align:1px; }
.an { --k:var(--blue); border-left:2px solid var(--k); background:linear-gradient(90deg, color-mix(in srgb, var(--k) 7%, transparent), transparent 70%); border-radius:0 6px 6px 0; padding:6px 10px 7px; margin:6px 0; }
.an.k-ask { --k:var(--red); } .an.k-flag { --k:var(--amber); } .an.k-later { --k:var(--text-3); } .an.k-house { --k:var(--green); }
.an-lab { font-family:'DM Mono',monospace; font-size:9px; letter-spacing:.8px; text-transform:uppercase; color:var(--k); margin-bottom:3px; }
.bl { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:3px; }
.bl > li { position:relative; padding-left:12px; font-size:12.5px; line-height:1.4; color:var(--text-1); }
.bl > li::before { content:""; position:absolute; left:1px; top:.55em; width:4px; height:4px; border-radius:50%; background:var(--k, var(--text-2)); opacity:.8; }
.an.k-later .bl > li { color:var(--text-2); font-style:italic; }
.an.k-flag .bl > li { color:var(--amber); }
.tl { display:flex; flex-direction:column; gap:2px; }
.tl-time { font-family:'DM Mono',monospace; font-size:10.5px; color:var(--accent); margin-top:5px; }
.tl-time:first-child { margin-top:0; }
.tl b { font-weight:600; }
.tl-detail { font-size:12px; color:var(--text-2); }
.sc-note { font-size:11px; color:var(--text-2); margin:0 0 8px; }
.ps-script { list-style:none; padding:0; margin:0; display:flex; flex-direction:column; gap:8px; }
.ps-script > li { position:relative; padding:0 0 0 12px; font-size:13px; line-height:1.45; color:var(--text-1); border-left:2px solid color-mix(in srgb, var(--blue) 45%, transparent); }
.ps-script ul { list-style:none; padding:0; margin:3px 0 0; display:flex; flex-direction:column; gap:2px; }
.ps-script ul li { position:relative; padding-left:12px; font-size:12.5px; color:var(--text-2); line-height:1.4; }
.ps-script ul li::before { content:"–"; position:absolute; left:0; color:var(--blue); opacity:.7; }
.q-box { --k:var(--red); background:var(--red-dim); border-radius:8px; padding:8px 12px; }
.q-who { font-family:'DM Mono',monospace; font-size:9px; letter-spacing:1px; text-transform:uppercase; color:var(--red); margin:8px 0 3px; }
.q-who:first-child { margin-top:0; }
.ask { color:var(--red); font-family:'DM Mono',monospace; font-size:.85em; }
/* Edit mode: hidden until Edit is on */
.ed-bar { display:flex; justify-content:flex-end; gap:6px; margin:-4px 0 4px; }
.ed-toggle, .ed-reset { font:600 10.5px/1 'DM Mono',monospace; letter-spacing:.5px; color:var(--text-2); background:transparent; border:1px solid var(--border-h); border-radius:20px; padding:5px 10px; cursor:pointer; }
.ps-content.editing .ed-toggle { color:var(--accent); border-color:var(--accent); }
.ed-reset { border-color:transparent; }
.ed-x, .ed-add { display:none; }
.ps-content.editing .ed-x { display:inline-flex; align-items:center; justify-content:center; width:16px; height:16px; margin-left:6px; vertical-align:1px; border:0; border-radius:50%; background:transparent; color:var(--text-3); font-size:13px; line-height:1; cursor:pointer; padding:0; }
.ps-content.editing .ed-x:hover { color:var(--red); background:var(--red-dim); }
.ps-content.editing .ed-add { display:inline-block; margin:4px 0 0 12px; padding:0; border:0; background:transparent; color:var(--text-3); font:500 11px 'DM Mono',monospace; cursor:pointer; }
.ps-content.editing .ed-add:hover { color:var(--accent); }
.ps-content.editing [contenteditable] { outline:0; text-decoration:underline dashed var(--border-h); text-underline-offset:3px; padding-right:1px; }
.ps-content.editing [contenteditable]:focus { text-decoration-color:var(--accent); }
.tl .ed-add { align-self:flex-start; }
.ps-content.editing [contenteditable]:empty::before { content:"type here"; color:var(--text-3); font-style:italic; }
.note-box { background:var(--blue-dim); border:1px solid rgba(139,209,255,0.2); border-radius:8px; padding:10px 12px; margin-bottom:4px; font-size:11px; color:var(--blue); line-height:1.5; }


.ps-val.flag { color:var(--amber); }
.ps-val.later { color:var(--text-2); font-style:italic; font-size:12px; }
.ps-script .ask { color:var(--red); font-family:'DM Mono',monospace; font-size:11px; }
.note-box.later { background:transparent; border-color:var(--divider); color:var(--text-2); font-style:italic; margin-top:8px; }


.pkt-wrap { margin-top: 4px; }
.pkt-bar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin: 0 0 10px; }
.pkt-sheet { background:var(--bg-active); border:1px solid var(--border); border-radius:10px; padding:12px; }
.pkt-title { font-family:'Barlow Condensed',sans-serif; font-size:20px; letter-spacing:0.4px; margin-bottom:2px; }
.pkt-sub { font-family:'DM Mono',monospace; font-size:10px; color:var(--text-3); margin-bottom:10px; }
.pkt-teams { width:100%; border-collapse:collapse; font-size:12px; margin-bottom:10px; }
.pkt-teams th { text-align:left; font-family:'DM Mono',monospace; font-size:8px; letter-spacing:1px; text-transform:uppercase; color:var(--text-3); padding:6px 8px; border-bottom:1px solid var(--divider); }
.pkt-teams td { vertical-align:top; padding:8px; border-bottom:1px solid var(--divider); }
.pkt-teams tr.yellow td:first-child { box-shadow: inset 3px 0 0 #e4c33a; }
.pkt-teams tr.green td:first-child { box-shadow: inset 3px 0 0 #3fa86a; }
.pkt-teams tr.blue td:first-child { box-shadow: inset 3px 0 0 #4f8ef0; }
.pkt-teams tr.red td:first-child { box-shadow: inset 3px 0 0 #e05555; }
.pkt-teams tr.orange td:first-child { box-shadow: inset 3px 0 0 #e2b089; }
.pkt-teams tr.purple td:first-child { box-shadow: inset 3px 0 0 #a06ee8; }
.pkt-teams tr.pink td:first-child { box-shadow: inset 3px 0 0 #e87aa4; }
.pkt-teams tr.teal td:first-child { box-shadow: inset 3px 0 0 #2aa8a1; }
.pkt-teams tr.brown td:first-child { box-shadow: inset 3px 0 0 #a5744b; }
.pkt-teams tr.gray td:first-child { box-shadow: inset 3px 0 0 #8a9099; }
.pkt-teams tr.gold td:first-child { box-shadow: inset 3px 0 0 #c9a227; }
.pkt-teams tr.white td:first-child { box-shadow: inset 3px 0 0 #d6d6d6; }
.pkt-color { font-weight:600; margin-bottom:6px; display:flex; align-items:center; gap:4px; }
.pkt-teamcolor { background:transparent; color:inherit; border:0; border-bottom:1px dashed var(--border-h); font:inherit; font-weight:600; padding:0 2px; cursor:pointer; }
.pkt-team-x { margin-left:auto; width:18px; height:18px; border:0; border-radius:50%; background:transparent; color:var(--text-3); font-size:14px; line-height:1; cursor:pointer; padding:0; }
.pkt-team-x:hover { color:var(--red); background:var(--red-dim); }
.pkt-load { font-size:11px; color:var(--text-2); margin-top:4px; }
.pkt-load.over { color:#e05555; font-weight:600; }
.pkt-input, .pkt-area, .pkt-select { width:100%; background:var(--bg-card); color:var(--text-1); border:1px solid var(--border); border-radius:6px; padding:5px 7px; font: inherit; font-size:12px; }
.pkt-area { min-height:70px; resize:vertical; line-height:1.4; }
.pkt-name { margin-bottom:5px; }
.pkt-loc { margin: 8px 0 12px; }
.pkt-loc label, .pkt-specials label, .pkt-step label, .pkt-assign-label { display:block; font-family:'DM Mono',monospace; font-size:8px; letter-spacing:1px; text-transform:uppercase; color:var(--text-3); margin-bottom:4px; }
.pkt-steps { list-style:none; display:flex; flex-direction:column; gap:10px; margin: 0 0 12px; }
.pkt-step { border:1px solid var(--divider); border-radius:8px; padding:8px; }
.pkt-step-row { display:grid; grid-template-columns: 90px 1fr; gap:8px; margin-bottom:6px; }
.pkt-diagram { margin-top: 12px; }
.pkt-diagram-img { width:100%; height:auto; border-radius:8px; border:1px solid var(--border); background:#0b0d10; display:none; pointer-events:none; }
.pkt-diagram-ph { padding:18px 12px; border:1px dashed var(--border-h); border-radius:8px; color:var(--text-2); font-size:13px; text-align:center; }
.pkt-diag-stage { margin-top:8px; }
.pkt-diag-canvas { position:relative; line-height:0; }
.pkt-diag-stage.has-diagram .pkt-diagram-ph { display:none; }
.pkt-sec-bar { display:none; flex-wrap:wrap; gap:6px; align-items:center; margin: 8px 0 6px; }
.pkt-diag-stage.has-diagram .pkt-sec-bar { display:flex; }
.pkt-sec-hint { display:none; font-size:11px; color:var(--text-2); margin: 0 0 8px; }
.pkt-diag-stage.has-diagram .pkt-sec-hint { display:block; }
.pkt-ink { border:1px solid var(--border); background:var(--bg-card); color:var(--text-1); border-radius:6px; padding:5px 8px; font-size:12px; cursor:pointer; }
.pkt-ink.is-on { outline:2px solid var(--text-1); outline-offset:1px; background:var(--bg-active); }
.pkt-sec-layer { position:absolute; inset:0; display:none; z-index:2; touch-action:none; }
.pkt-diag-stage.has-diagram .pkt-sec-layer { display:block; }
.pkt-diag-stage.has-diagram.is-inking .pkt-sec-layer { cursor:crosshair; }
.pkt-sec-box { position:absolute; box-sizing:border-box; border:2px solid; border-radius:2px; }
.pkt-sec-box.selected { outline:2px dashed #111; outline-offset:1px; }
.pkt-sec-x { position:absolute; top:-8px; right:-8px; width:18px; height:18px; border-radius:50%; border:0; background:#111; color:#fff; font-size:12px; line-height:18px; padding:0; cursor:pointer; box-shadow:0 0 0 1px rgba(255,255,255,.4); }
.pkt-fold { margin:8px 0; }
.pkt-fold > summary { cursor:pointer; font:600 11px 'DM Mono',monospace; letter-spacing:.6px; text-transform:uppercase; color:var(--text-2); padding:4px 0; }
.pkt-fold > summary:hover { color:var(--accent); }
.duty-chart { margin:8px 0 10px; border:1px solid var(--border); border-radius:8px; padding:6px 10px; }
.duty-chart summary { cursor:pointer; font:600 11px 'DM Mono',monospace; letter-spacing:.6px; text-transform:uppercase; color:var(--text-2); }
.dc-count { margin-left:6px; text-transform:none; letter-spacing:0; color:var(--green); }
.dc-count.miss { color:var(--red); }
.dc-group { margin-top:6px; }
.dc-kind { cursor:pointer; font:600 9px 'DM Mono',monospace; letter-spacing:1px; text-transform:uppercase; color:var(--accent); margin:0 0 3px; }
.dc-n { color:var(--text-3); letter-spacing:.3px; text-transform:none; margin-left:4px; }
.dc-n b { color:var(--red); font-weight:600; }
.dc-list { list-style:none; margin:0; padding:0; display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:2px 14px; }
.dc-row { display:flex; align-items:center; gap:6px; font-size:12px; padding:2px 0; border-bottom:1px solid var(--divider); }
.dc-text { flex:1; min-width:0; }
.dc-row.miss .dc-text { color:var(--red); font-weight:600; }
.dc-row.skip .dc-text { color:var(--text-3); text-decoration:line-through; }
.dc-sel { background:transparent; color:var(--text-2); border:0; font-size:11px; max-width:110px; cursor:pointer; }
.dc-row.miss .dc-sel { color:var(--red); }
.dc-x { border:0; background:transparent; color:var(--text-3); cursor:pointer; font-size:13px; padding:0 2px; }
.dc-x:hover { color:var(--red); }
.dc-new { margin-top:4px; width:100%; max-width:320px; background:transparent; border:0; border-bottom:1px dashed var(--border-h); color:var(--text-1); font-size:12px; padding:3px 0; }
.pkt-pin { position:absolute; transform:translate(-50%,-50%); min-width:20px; height:20px; padding:0 4px; border-radius:10px; background:rgba(255,255,255,.92); color:#111; border:1.5px solid #111; font:700 11px/17px Inter,Arial,sans-serif; text-align:center; pointer-events:none; box-shadow:0 1px 3px rgba(0,0,0,.4); }
.pkt-pin.on { color:#111; }
.pkt-halo { position:absolute; width:6.2%; aspect-ratio:1; transform:translate(-50%,-50%); border-radius:50%; border:2px solid; pointer-events:none; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
@media print { .pkt-pin { -webkit-print-color-adjust:exact; print-color-adjust:exact; } }
.pkt-sec-label { position:absolute; top:2px; left:2px; font-size:11px; font-weight:700; line-height:1.2; padding:1px 4px; background:rgba(255,255,255,0.82); color:#111; border-radius:2px; pointer-events:none; }
.pkt-sec-draft { position:absolute; box-sizing:border-box; border:2px dashed; pointer-events:none; display:none; }
@media print {
  .pkt-sec-box, .pkt-sec-label { -webkit-print-color-adjust:exact; print-color-adjust:exact; }
}
.pkt-assign { display:grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap:6px; margin-top:8px; }
.pkt-assign-item { display:flex; align-items:center; gap:6px; font-size:12px; }
.pkt-assign-item span { min-width: 52px; color:var(--text-2); }
.pkt-legend { display:flex; flex-wrap:wrap; gap:8px; margin:8px 0; font-size:11px; color:var(--text-2); }
.pkt-swatch { display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:4px; vertical-align:middle; }
.bb-btn.pkt-btn { cursor:pointer; }

@media print {
  body.print-pkt .ref-header, body.print-pkt .page-hero, body.print-pkt .sec, body.print-pkt .status,
  body.print-pkt .ps-head, body.print-pkt .pkt-bar, body.print-pkt .note-box,
  body.print-pkt .pkt-sec-bar, body.print-pkt .pkt-sec-hint { display:none !important; }
  body.print-pkt .ps-card { display:none !important; border:0; background:transparent; }
  body.print-pkt .ps-card.print-me { display:block !important; }
  body.print-pkt .ps-card.print-me .ps-body { display:block !important; border:0; padding:0; }
  body.print-pkt .ps-card.print-me .ps-body > :not(.pkt-wrap) { display:none !important; }
  body.print-pkt .page-wrap, body.print-pkt .list { max-width:none; padding:0; }
  body.print-pkt .pkt-sheet { background:#fff; color:#111; border:0; }
  body.print-pkt .pkt-input, body.print-pkt .pkt-area, body.print-pkt .pkt-select { border:0; background:transparent; color:#111; padding:0; }
  body.print-pkt .pkt-diag-stage.has-diagram .pkt-diagram-ph { display:none !important; }
  body.print-pkt .pkt-diagram-img { filter: invert(1) hue-rotate(180deg); background:#fff; }
  body.print-pkt .pkt-diagram-img.is-shown { display:block !important; }
  body.print-pkt .pkt-sec-layer { display:block !important; }
  body.print-pkt .pkt-sec-box.selected { outline:0; }
  body.print-pkt .pkt-sec-x, body.print-pkt .pkt-team-x { display:none !important; }

<script>
(function () {

    function contactLabel(name){

  }
function fmtDate(iso) {

    return d.toLocaleDateString("en-US", { timeZone: "UTC", weekday: "short", month: "short", day: "numeric" });
  }

  function countPill(c) {
    if (!c) return "";
    if (c.gtd && c.set) return "GTD " + c.gtd + " · SET " + c.set;
    if (c.gtd) return "GTD " + c.gtd;
    if (c.set) return "SET " + c.set;

  }

  function markAsks(s) {
    return esc(s).replace(/\[ask\]/g, '<span class="ask">[ask]</span>');
  }

  // ---- Card content: color-coded bullets, editable per card (saved on this device) ----
  var EDIT_STORE = "bb-preshift-edits";
  var editing = {};
  function loadEdits() { try { return JSON.parse(localStorage.getItem(EDIT_STORE) || "{}") || {}; } catch (e) { return {}; } }
  function saveEdits(all) { try { localStorage.setItem(EDIT_STORE, JSON.stringify(all)); } catch (e) {} }
  function mealKey(m) { return m.date + "|" + m.group; }

  function splitBullets(text) {
    return String(text || "").replace(/\s*OPEN\s*→/g, "").replace(/(?<=[a-z]{3}|\d)(?=[A-Z][a-z]{3})/g, " · ").split(/\s+·\s+|;\s+|(?<=[.?!])\s+(?=[A-Z0-9(])/).map(function (t) { return t.trim(); }).filter(Boolean);
  }
  function kindOf(l) {
    if (l.kind === "flag") return "flag";
    if (l.kind === "later" || l.later) return "later";
    if (l.kind === "ask" || l.known === false) return "ask";
    if (l.house) return "house";
    return "fact";
  }
  function buildEdits(m) {
    var rows = (m.analysis && m.analysis.length ? m.analysis : m.lines || []).map(function (l) {
      return { label: l.label, kind: kindOf(l), b: l.items && l.items.length ? [] : splitBullets(l.text),
        t: (l.items || []).map(function (it) { return { time: it.time, room: it.room, what: it.what, detail: it.detail }; }) };
    });
    var script = (m.script || []).map(function (l) {
      var parts = String(l.text || "").split(/(?<=[.?!])\s+(?=[A-Z0-9])/);
      return { h: parts.shift() || "", s: parts };
    });
    var qs = (m.questions || []).map(function (q) { return { who: q.who || "", q: q.q }; });
    return { a: rows, s: script, q: qs };
  }
  function editsFor(m) {
    if (!m.ed) {
      var saved = loadEdits()[mealKey(m)];
      m.ed = saved && saved.a ? saved : buildEdits(m);
      m.ed = PreShift.ensureFloorEdits(m.ed);
    }
    return m.ed;
  }
  function persistEdits(m) { var all = loadEdits(); all[mealKey(m)] = m.ed; saveEdits(all); }

  function ed(path, text, cls) {
    return '<span class="ed' + (cls ? " " + cls : "") + '" data-ed="' + path + '">' + markAsks(text) + '</span>';
  }
  function x(path) { return '<button type="button" class="ed-x" data-del="' + path + '" aria-label="Remove">×</button>'; }
  function add(path, label, extra) { return '<button type="button" class="ed-add" data-add="' + path + '"' + (extra || "") + '>+ ' + label + '</button>'; }

  function timelineHtml(row, R, i) {
    var order = [], by = {};
    row.t.forEach(function (it, K) {
      if (!by[it.time]) { by[it.time] = []; order.push(it.time); }
      by[it.time].push(K);
    });
    return '<div class="tl">' + order.map(function (t) {
      return '<div class="tl-time"><span class="ed" data-tl="' + R + '" data-time="' + esc(t) + '">' + esc(t || "Time") + '</span></div><ul class="bl">' +
        by[t].map(function (K) {
          var it = row.t[K], pth = "a." + R + ".t." + K;
          return '<li><b>' + ed(pth + ".room", it.room || "Room") + '</b> · ' + ed(pth + ".what", it.what || "") + x(pth) +
            (it.detail || editing[i] ? '<div class="tl-detail">' + ed(pth + ".detail", it.detail || "", "ph") + '</div>' : '') + '</li>';
        }).join("") + '</ul>';
    }).join("") + add("a." + R + ".t", "time slot") + '</div>';
  }

  function cardContent(m, i) {
    var E = editsFor(m);
    var anal = E.a.map(function (row, R) {
      var body = row.t && row.t.length ? timelineHtml(row, R)
        : '<ul class="bl">' + row.b.map(function (t, K) { return '<li>' + ed("a." + R + ".b." + K, t) + x("a." + R + ".b." + K) + '</li>'; }).join("") + '</ul>' + add("a." + R + ".b", "point");
      return '<div class="an k-' + esc(row.kind) + '"><div class="an-lab">' + ed("a." + R + ".label", row.label) + x("a." + R) + '</div>' + body + '</div>';
    }).join("") + add("a", "section");
    var spoken = E.s.map(function (l, N) {
      return '<li>' + ed("s." + N + ".h", l.h) + x("s." + N) +
        '<ul>' + l.s.map(function (t, K) { return '<li>' + ed("s." + N + ".s." + K, t) + x("s." + N + ".s." + K) + '</li>'; }).join("") +
        '</ul>' + add("s." + N + ".s", "detail") + '</li>';
    }).join("");
    var qTitle = m.mgr ? "Questions for " + m.mgr : "Questions to ask";
    var order = [], by = {};
    E.q.forEach(function (q, N) { var w = q.who || ""; if (!by[w]) { by[w] = []; w === m.mgr ? order.unshift(w) : order.push(w); } by[w].push(N); });
    if (!order.length) order.push(m.mgr || "");
    var qs = order.map(function (w) {
      return (w && w !== m.mgr ? '<div class="q-who">' + esc(w) + '</div>' : '') +
        '<ul class="bl">' + (by[w] || []).map(function (N) { return '<li>' + ed("q." + N + ".q", E.q[N].q) + x("q." + N) + '</li>'; }).join("") + '</ul>' +
        add("q", "question", ' data-who="' + esc(w) + '"');
    }).join("");
    return '<div class="ed-bar"><button type="button" class="ed-toggle" data-act="edit">' + (editing[i] ? "Done" : "Edit") + '</button>' +
        (editing[i] ? '<button type="button" class="ed-reset" data-act="reset">Reset to Rundown</button>' : '') + '</div>' +
      '<div class="ps-sub s-an">Analysis</div>' + anal +
      '<div class="ps-sub s-sc">Server script</div>' +
      '<p class="sc-note">Read top to bottom at pre-shift. <span class="ask">[ask]</span> = confirm with the manager before doors.</p>' +
      '<ul class="ps-script">' + spoken + '</ul>' + add("s", "bullet") +
      '<div class="ps-sub s-q">' + esc(qTitle) + '</div>' +
      (E.q.length || editing[i] ? '<div class="q-box">' + qs + '</div>' : '<p class="sc-note">Nothing flagged. Walk the known lines at stand-up.</p>');
  }

  function walk(E, path) {
    var keys = path.split("."), o = E;
    for (var k = 0; k < keys.length - 1; k++) o = o[keys[k]];
    return { obj: o, key: keys[keys.length - 1] };
  }
  function redrawContent(i, meals, focusPath) {
    var box = document.querySelector('[data-content="' + i + '"]');
    if (!box) return;
    box.innerHTML = cardContent(meals[i], i);
    box.classList.toggle("editing", !!editing[i]);
    box.querySelectorAll("[data-ed],[data-tl]").forEach(function (el) {

    if (head && /to ask|Ready/.test(head.textContent)) { head.textContent = n ? n + " to ask" : "Ready"; head.classList.toggle("ask", !!n); }

    }
  }
  function bindEdits(meals) {
    meals.forEach(function (m, i) {
      var box = document.querySelector('[data-content="' + i + '"]');
      if (!box) return;
      box.addEventListener("click", function (ev) {
        var b = ev.target.closest("button");
        if (!b) return;
        var E = editsFor(m);
        if (b.getAttribute("data-act") === "edit") { editing[i] = !editing[i]; redrawContent(i, meals); return; }

          var arr = ad.split(".").reduce(function (o, k) { return o[k]; }, E), np;
          if (ad === "a") arr.push({ label: "New section", kind: "fact", b: [""], t: [] }), np = "a." + (arr.length - 1) + ".label";
          else if (ad === "q") arr.push({ who: b.getAttribute("data-who") || m.mgr || "", q: "" }), np = "q." + (arr.length - 1) + ".q";
          else if (ad === "s") arr.push({ h: "", s: [] }), np = "s." + (arr.length - 1) + ".h";
          else if (/\.t$/.test(ad)) arr.push({ time: "", room: "", what: "", detail: "" }), np = ad + "." + (arr.length - 1) + ".room";
          else arr.push(""), np = ad + "." + (arr.length - 1);

      });

        var el = ev.target, E = editsFor(m), v = el.textContent.trim();
        if (el.hasAttribute("data-tl")) {
          var old = el.getAttribute("data-time");

          el.setAttribute("data-time", v);

        }
        var p = el.getAttribute("data-ed");

        w.obj[w.key] = v;

      });

      });
    });

  }

  function render(meals) {
    var list = $("ps-list"), st = $("ps-status"), sec = $("ps-sec");

  }


  var PACKET_STORE = "bb-preshift-packet";
  function loadPacketStore() { try { return JSON.parse(localStorage.getItem(PACKET_STORE) || "{}") || {}; } catch (e) { return {}; } }
  function savePacketStore(all) { try { localStorage.setItem(PACKET_STORE, JSON.stringify(all)); } catch (e) {} }

  var SWATCH = {Yellow:"#e4c33a",Green:"#3fa86a",Blue:"#4f8ef0",Red:"#e05555",Orange:"#e2b089",Purple:"#a06ee8",Pink:"#e87aa4",Teal:"#2aa8a1",Brown:"#a5744b",Gray:"#8a9099",Gold:"#c9a227",White:"#d6d6d6"};
  function teamClass(color) { return String(color || "").toLowerCase().replace(/\s+/g, ""); }

  function renderPacket(m, i) {
    var base = m.packet;
    if (!base) return "";
    var all = loadPacketStore();
    var p = PreShift.mergePacket(base, all[base.key]);
    m.packetLive = p;
    var loads = PreShift.teamLoads(p.teams, p.assignments, p.seatsPerTable);
    var teams = (p.teams || []).map(function (t, ti) {
      var names = (t.names && t.names.length ? t.names : ["", ""]).map(function (n, ni) {
        return '<input class="pkt-input pkt-name" data-pkt="' + i + '" data-k="name" data-t="' + ti + '" data-n="' + ni + '" placeholder="Name" value="' + esc(n) + '">';
      }).join("");
      var load = loads[ti] || { guests: 0, over: false };
      var loadText = !p.seatsPerTable ? "Guest count needs seats per table" : (load.guests + " guests" + (load.over ? " (over 60)" : ""));
      return '<tr class="' + esc(teamClass(t.color)) + '">' +
        '<td><div class="pkt-color"><i class="pkt-swatch" style="background:' + (SWATCH[t.color] || "#888") + '"></i>' +

          '</select> Team' +
          ((p.teams || []).length > 1 ? '<button type="button" class="pkt-team-x" data-act="del-team" data-pkt="' + i + '" data-t="' + ti + '" aria-label="Delete team">×</button>' : '') +
          '</div>' + names +
        '<div class="pkt-load' + (load.over ? ' over' : '') + '" data-k="load" data-t="' + ti + '">' + esc(loadText) + '</div></td>' +
        '<td><label>Opening</label><textarea class="pkt-area" data-pkt="' + i + '" data-k="opening" data-t="' + ti + '">' + esc((t.opening || []).join("\n")) + '</textarea></td>' +
        '<td><label>Closing</label><textarea class="pkt-area" data-pkt="' + i + '" data-k="closing" data-t="' + ti + '">' + esc((t.closing || []).join("\n")) + '</textarea></td>' +

    }).join("");
    var steps = (p.steps || []).map(function (s, si) {
      var owners = (s.owners || []).map(function (o, oi) {
        return '<input class="pkt-input pkt-name" data-pkt="' + i + '" data-k="owner" data-s="' + si + '" data-n="' + oi + '" placeholder="Who" value="' + esc(o) + '">';
      }).join("");
      return '<li class="pkt-step">' +
        '<div class="pkt-step-row">' +
          '<div><label>Time</label><input class="pkt-input" data-pkt="' + i + '" data-k="time" data-s="' + si + '" value="' + esc(s.time || "") + '"></div>' +
          '<div><label>Step</label><input class="pkt-input" data-pkt="' + i + '" data-k="label" data-s="' + si + '" value="' + esc(s.label || "") + '"></div>' +
        '</div>' +
        '<label>Details</label><textarea class="pkt-area" data-pkt="' + i + '" data-k="items" data-s="' + si + '">' + esc((s.items || []).join("\n")) + '</textarea>' +
        (s.owners && s.owners.length ? '<label>Who</label>' + owners : '') +
        '</li>';
    }).join("");
    var specials = (p.specials && p.specials.length ? p.specials : [{ table: "", text: "" }]).map(function (sp, si) {
      return '<div class="pkt-step-row">' +
        '<div><label>Table</label><input class="pkt-input" data-pkt="' + i + '" data-k="sptable" data-s="' + si + '" placeholder="Table" value="' + esc(sp.table || "") + '"></div>' +
        '<div><label>Special plates</label><input class="pkt-input" data-pkt="' + i + '" data-k="sptext" data-s="' + si + '" value="' + esc(sp.text || "") + '"></div>' +
        '</div>';
    }).join("");
    var colors = (p.teams || []).map(function (t) { return t.color; });
    var assigns = "";
    var n = p.tableCount || 0;
    var ti;
    for (ti = 1; ti <= n; ti++) {
      var cur = (p.assignments && p.assignments[String(ti)]) || "";
      var opts = '<option value="">Section</option>' + colors.map(function (c) {
        return '<option value="' + esc(c) + '"' + (cur === c ? " selected" : "") + '>' + esc(c) + '</option>';
      }).join("");
      assigns += '<label class="pkt-assign-item"><span>Table ' + ti + '</span><select class="pkt-select" style="border-left:3px solid ' + (SWATCH[cur] || "transparent") + '" data-pkt="' + i + '" data-k="assign" data-table="' + ti + '">' + opts + '</select></label>';
    }
    var legend = colors.map(function (c) {
      return '<span><i class="pkt-swatch" style="background:' + (SWATCH[c] || "#888") + '"></i>' + esc(c) + '</span>';
    }).join("");
    var diag = p.diagram || { missing: true, images: [] };
    var inks = (p.teams || []).map(function (tm) {
      return '<button type="button" class="pkt-ink" data-act="ink" data-pkt="' + i + '" data-ink="' + esc(tm.color) + '"><i class="pkt-swatch" style="background:' + (SWATCH[tm.color] || "#888") + '"></i>' + esc(tm.color) + '</button>';
    }).join("");
    var diagBlock = '<div class="pkt-diag-stage" data-diag-stage="' + i + '">' +
      '<div class="pkt-sec-bar">' +
        '<button type="button" class="pkt-ink pkt-pinmode" data-act="pin-mode" data-pkt="' + i + '">① Number tables</button>' +
        '<span class="pkt-assign-label" style="margin:0 0 0 6px">Section color</span>' + inks +
      '</div>' +
      '<p class="pkt-sec-hint" data-sec-hint="' + i + '"></p>' +
      '<div class="pkt-diagram-ph" data-diag-ph="' + i + '">Diagram not in Banquet Bot yet.</div>' +
      '<div class="pkt-diag-canvas">' +
        '<img class="pkt-diagram-img" alt="' + esc(p.room || "Room diagram") + '" data-diag-img="' + i + '">' +
        (diag.path ? '<object class="pkt-diagram-img" data-diag-pdf="' + i + '" data="" type="application/pdf" style="display:none;min-height:280px;width:100%"></object>' : "") +
        '<div class="pkt-sec-layer" data-sec-layer="' + i + '"></div>' +
      '</div>' +
    '</div>';
    return '<div class="pkt-wrap" id="pkt-' + i + '">' +
      '<div class="ps-sub">Server Packet</div>' +
      '<div class="pkt-bar">' +
        '<button type="button" class="bb-btn pkt-btn" data-act="print" data-pkt="' + i + '">Print packet</button>' +
        '<button type="button" class="bb-btn pkt-btn" data-act="add-team" data-pkt="' + i + '">Add team</button>' +
        ((p.teams || []).length > 1 ? '<button type="button" class="bb-btn pkt-btn" data-act="del-team" data-pkt="' + i + '" data-t="' + (p.teams.length - 1) + '">Remove team</button>' : '') +
      '</div>' +
      '<div class="pkt-sheet">' +
        '<div class="pkt-title">Server Packet</div>' +
        '<div class="pkt-sub">' + esc(p.group) + ' · ' + esc(fmtDate(p.date)) + ' · ' + esc(p.room) + '</div>' +
        '<details class="pkt-fold" data-fold="teams"' + (foldOpen(p.key, "teams") ? " open" : "") + '><summary>Server assignments</summary>' +
        '<table class="pkt-teams"><thead><tr><th>Team</th><th>Opening</th><th>Closing</th></tr></thead><tbody>' + teams + '</tbody></table></details>' +
        dutyChart(p, i) +
        '<details class="pkt-fold" data-fold="location"' + (foldOpen(p.key, "location") ? " open" : "") + '><summary>Breakdown and hotbox</summary>' +
        '<div class="pkt-loc"><label for="pkt-loc-' + i + '">Room</label><input id="pkt-loc-' + i + '" class="pkt-input" data-pkt="' + i + '" data-k="location" placeholder="Room" value="' + esc(p.location || "") + '"></div></details>' +
        '<details class="pkt-fold" data-fold="steps"' + (foldOpen(p.key, "steps") ? " open" : "") + '><summary>Timeline</summary>' +
        '<ol class="pkt-steps">' + steps + '</ol></details>' +
        '<details class="pkt-fold" data-fold="specials"' + (foldOpen(p.key, "specials") ? " open" : "") + '><summary>Special plates</summary>' +
        '<div class="pkt-specials">' + specials + '</div></details>' +
        '<details class="pkt-diagram pkt-fold" data-fold="diagram"' + (foldOpen(p.key, "diagram") ? " open" : "") + '><summary>Room diagram and sections</summary>' +
          '<div class="pkt-legend">' + legend + '</div>' +
          diagBlock +
          '<div class="pkt-step-row">' +
            '<div class="pkt-loc"><label>Tables on the diagram</label><input class="pkt-input" data-pkt="' + i + '" data-k="tableCount" value="' + esc(String(n || "")) + '" placeholder="How many tables"></div>' +
            '<div class="pkt-loc"><label>Seats per table</label><input class="pkt-input" data-pkt="' + i + '" data-k="seatsPerTable" value="' + esc(p.seatsPerTable ? String(p.seatsPerTable) : "") + '" placeholder="From the event order"></div>' +
          '</div>' +
          '<div class="pkt-assign">' + assigns + '</div>' +
        '</details>' +
      '</div></div>';
  }

  function readPacketFromDom(i, meals) {
    var base = meals[i].packet;
    var p = JSON.parse(JSON.stringify(meals[i].packetLive || base));
    var root = document.getElementById("pkt-" + i);
    if (!root) return p;
    p.teams.forEach(function (t, ti) {
      t.names = [].slice.call(root.querySelectorAll('[data-k="name"][data-t="' + ti + '"]')).map(function (el) { return el.value; });
      var open = root.querySelector('[data-k="opening"][data-t="' + ti + '"]');
      var close = root.querySelector('[data-k="closing"][data-t="' + ti + '"]');
      if (open) t.opening = open.value.split(/\n/).map(function (s) { return s.trim(); }).filter(Boolean);
      if (close) t.closing = close.value.split(/\n/).map(function (s) { return s.trim(); }).filter(Boolean);
    });
    var loc = root.querySelector('[data-k="location"]');
    if (loc) p.location = loc.value;
    p.steps.forEach(function (s, si) {
      var time = root.querySelector('[data-k="time"][data-s="' + si + '"]');
      var label = root.querySelector('[data-k="label"][data-s="' + si + '"]');
      var items = root.querySelector('[data-k="items"][data-s="' + si + '"]');
      if (time) s.time = time.value;
      if (label) s.label = label.value;
      if (items) s.items = items.value.split(/\n/).map(function (v) { return v.trim(); }).filter(Boolean);
      s.owners = [].slice.call(root.querySelectorAll('[data-k="owner"][data-s="' + si + '"]')).map(function (el) { return el.value; });
    });
    p.specials = p.specials || [];
    root.querySelectorAll('[data-k="sptext"]').forEach(function (el) {
      var si = +el.getAttribute("data-s");
      p.specials[si] = p.specials[si] || { table: "", text: "" };
      p.specials[si].text = el.value;
    });
    root.querySelectorAll('[data-k="sptable"]').forEach(function (el) {
      var si = +el.getAttribute("data-s");
      p.specials[si] = p.specials[si] || { table: "", text: "" };
      p.specials[si].table = el.value;
    });
    var tc = root.querySelector('[data-k="tableCount"]');
    if (tc && /^\d+$/.test(tc.value)) p.tableCount = +tc.value;
    var seatsEl = root.querySelector('[data-k="seatsPerTable"]');
    if (seatsEl && /^\d+$/.test(seatsEl.value)) p.seatsPerTable = +seatsEl.value;
    p.assignments = p.assignments || {};
    root.querySelectorAll('[data-k="assign"]').forEach(function (el) {
      p.assignments[el.getAttribute("data-table")] = el.value;
    });
    return p;
  }

  function persistPacket(i, meals) {
    var p = readPacketFromDom(i, meals);
    meals[i].packetLive = p;
    var all = loadPacketStore();
    all[p.key] = {
      teams: p.teams,
      teamCount: (p.teams || []).length,
      location: p.location,
      steps: p.steps,
      specials: p.specials,
      assignments: p.assignments,
      tableCount: p.tableCount,
      seatsPerTable: p.seatsPerTable,
      sections: PreShift.normalizeSections(p.sections || []),
      tablePins: PreShift.normalizeTablePins(p.tablePins || {}),
      skipDuties: p.skipDuties || []
    };
    savePacketStore(all);
    return p;
  }

  function redrawPacket(i, meals) {
    var wrap = document.getElementById("pkt-" + i);
    if (!wrap) return;
    wrap.outerHTML = renderPacket(meals[i], i);
    bindOnePacket(i, meals);
  }

  var inkState = {};
  // Packet section open/closed choices, kept across redraws and saved on this device
  var FOLD_STORE = "bb-preshift-packet-folds";
  function loadFolds() { try { return JSON.parse(localStorage.getItem(FOLD_STORE) || "{}") || {}; } catch (e) { return {}; } }
  var folds = loadFolds();
  function foldOpen(key, k, fallback) { return PreShift.foldOpen(folds, key, k, fallback); }
  function saveFold(key, k, open) {
    var id = PreShift.foldId(key, k), all = loadFolds();
    folds[id] = all[id] = open;
    try { localStorage.setItem(FOLD_STORE, JSON.stringify(all)); } catch (e) {}
  }

  function hexRgba(hex, a) {
    var h = String(hex || "#888").replace("#", "");
    if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
    var n = parseInt(h, 16);
    if (!isFinite(n)) n = 0x888888;
    return "rgba(" + (n >> 16) + ", " + ((n >> 8) & 255) + ", " + (n & 255) + ", " + a + ")";
  }

  function sectionStyle(box) {
    var color = SWATCH[box.team] || "#888";
    return "left:" + box.x + "%;top:" + box.y + "%;width:" + box.w + "%;height:" + box.h + "%;background:" + hexRgba(color, 0.35) + ";border-color:" + color + ";";
  }

  function paintSections(i, meals) {
    var layer = document.querySelector('[data-sec-layer="' + i + '"]');
    if (!layer) return;
    var p = meals[i].packetLive || meals[i].packet;
    var selected = inkState[i] && inkState[i].selected;
    var boxes = PreShift.normalizeSections((p && p.sections) || []);
    if (p) p.sections = boxes;
    var html = boxes.map(function (box) {
      return '<div class="pkt-sec-box' + (box.id === selected ? " selected" : "") + '" data-sec-id="' + esc(box.id) + '" style="' + sectionStyle(box) + '"><span class="pkt-sec-label">' + esc(box.team) + '</span><button type="button" class="pkt-sec-x" data-sec-del="' + esc(box.id) + '" aria-label="Remove">×</button></div>';
    }).join("");
    var pins = (p && p.tablePins) || {};
    html += Object.keys(pins).map(function (k) {
      var team = p.assignments && p.assignments[k];
      var col = SWATCH[team];
      var at = 'left:' + pins[k].x + '%;top:' + pins[k].y + '%;';
      return (col ? '<span class="pkt-halo" style="' + at + 'background:' + hexRgba(col, 0.45) + ';border-color:' + col + '"></span>' : '') +
        '<span class="pkt-pin' + (col ? " on" : "") + '" style="' + at + (col ? "background:" + col + ";border-color:" + col : "") + '">' + esc(k) + '</span>';
    }).join("") + '<div class="pkt-sec-draft" data-sec-draft="' + i + '"></div>';
    layer.innerHTML = html;
    var st = inkState[i] || {}, hint = document.querySelector('[data-sec-hint="' + i + '"]');
    var pinBtn = document.querySelector('#pkt-' + i + ' [data-act="pin-mode"]');
    if (pinBtn) pinBtn.classList.toggle("is-on", !!st.pins);
    if (hint) hint.textContent = st.pins
      ? "Tap each table in order. Next: Table " + PreShift.nextTableNumber(pins) + ". Tap a number to remove it. Tap Number tables again when done."
      : st.team
        ? (Object.keys(pins).length ? "Tap tables to put them in " + st.team + " (tap again to take them out), or drag a box around a group." : "Drag a box over " + st.team + "'s tables. Number the tables first to assign them one by one.")
        : (Object.keys(pins).length ? "Pick a team color, then tap tables or drag around a group. × removes a box." : "Number tables once (tap each table in order), then pick a color and tap tables to assign them.");
    var stage = document.querySelector('[data-diag-stage="' + i + '"]');
    if (stage) stage.classList.toggle("is-inking", !!(inkState[i] && inkState[i].team));
    (p && p.teams || []).forEach(function (tm) {
      var btn = document.querySelector('#pkt-' + i + ' [data-act="ink"][data-ink="' + tm.color + '"]');
      if (btn) btn.classList.toggle("is-on", !!(inkState[i] && inkState[i].team === tm.color));
    });
  }

  function markDiagramShown(i, kind) {
    var stage = document.querySelector('[data-diag-stage="' + i + '"]');
    var img = document.querySelector('[data-diag-img="' + i + '"]');
    var ph = document.querySelector('[data-diag-ph="' + i + '"]');
    var pdf = document.querySelector('[data-diag-pdf="' + i + '"]');
    if (img) { img.classList.toggle("is-shown", kind === "img"); img.style.display = kind === "img" ? "block" : "none"; }
    if (pdf) { pdf.classList.toggle("is-shown", kind === "pdf"); pdf.style.display = kind === "pdf" ? "block" : "none"; }
    if (ph) ph.style.display = kind ? "none" : "block";
    if (stage) stage.classList.toggle("has-diagram", !!kind);
  }

  function loadDiagram(i, meals) {
    var p = meals[i].packetLive || meals[i].packet;
    var diag = (p && p.diagram) || { missing: true, images: [] };
    var img = document.querySelector('[data-diag-img="' + i + '"]');
    var pdf = document.querySelector('[data-diag-pdf="' + i + '"]');
    var cands = diag.images || [];
    var idx = 0;
    function fail() {
      if (diag.path && pdf) {
        markDiagramShown(i, "pdf");
        pdf.setAttribute("data", diag.path);
        paintSections(i, meals);
        return;
      }
      markDiagramShown(i, "");
      var ph = document.querySelector('[data-diag-ph="' + i + '"]');
      if (ph) ph.textContent = "Diagram not in Banquet Bot yet.";
      paintSections(i, meals);
    }
    function tryNext() {
      if (!img || idx >= cands.length) { fail(); return; }
      img.onload = function () { markDiagramShown(i, "img"); paintSections(i, meals); };
      img.onerror = function () { idx += 1; tryNext(); };
      img.src = cands[idx];
    }
    if (cands.length) tryNext();
    else fail();
  }

  function refreshLoads(i, meals) {
    var p = meals[i].packetLive || meals[i].packet;
    if (!p) return;
    var loads = PreShift.teamLoads(p.teams, p.assignments, p.seatsPerTable);
    loads.forEach(function (load, ti) {
      var el = document.querySelector('#pkt-' + i + ' [data-k="load"][data-t="' + ti + '"]');
      if (!el) return;
      el.textContent = !p.seatsPerTable ? "Guest count needs seats per table" : (load.guests + " guests" + (load.over ? " (over 60)" : ""));
      if (load.over) el.classList.add("over");
      else el.classList.remove("over");
    });
  }

  function bindOnePacket(i, meals) {
    var root = document.getElementById("pkt-" + i);
    if (!root) return;
    root.querySelectorAll("input, textarea, select").forEach(function (el) {
      el.addEventListener("change", function () {
        var before = meals[i].packetLive && meals[i].packetLive.tableCount;
        var beforeSeats = meals[i].packetLive && meals[i].packetLive.seatsPerTable;
        persistPacket(i, meals);
        var k = el.getAttribute("data-k");
        if (k === "opening" || k === "closing") {
          var dc = document.querySelector('#pkt-' + i + ' .duty-chart'), wasOpen = dc && dc.open;
          if (dc) { dc.outerHTML = dutyChart(meals[i].packetLive, i); bindDutyChart(i, meals); }
          dc = document.querySelector('#pkt-' + i + ' .duty-chart'); if (dc && wasOpen) dc.open = true;
          return;
        }
        if (k === "teamcolor") { recolorTeam(i, meals, +el.getAttribute("data-t"), el.value); return; }
        if (k === "tableCount" && meals[i].packetLive.tableCount !== before) { redrawPacket(i, meals); return; }
        if (k === "seatsPerTable" && meals[i].packetLive.seatsPerTable !== beforeSeats) { redrawPacket(i, meals); return; }
        if (k === "assign") { el.style.borderLeftColor = SWATCH[el.value] || "transparent"; paintSections(i, meals); }
        if (k === "assign" || k === "seatsPerTable") refreshLoads(i, meals);
      });
      el.addEventListener("blur", function () { persistPacket(i, meals); });
    });
    root.querySelectorAll("[data-act]").forEach(function (btn) {
      btn.addEventListener("click", function (ev) {
        ev.preventDefault();
        ev.stopPropagation();
        var act = btn.getAttribute("data-act");
        persistPacket(i, meals);
        if (act === "print") {
          clearDutyPrint();
          document.querySelectorAll(".ps-card").forEach(function (c) { c.classList.remove("print-me"); });
          var card = document.getElementById("ps-" + i);
          if (card) card.classList.add("print-me", "open");
          buildPrintSheet(i, meals);
          document.documentElement.classList.add("print-pkt");
          printTitle = document.title;
          document.title = meals[i].group + " " + meals[i].date;
          document.body.classList.add("print-pkt");
          window.print();
          return;
        }
        if (act === "add-team") {
          var p = persistPacket(i, meals);
          var used = (p.teams || []).map(function (t) { return t.color; });
          var spec = (p.teams || []).map(function (t) { return { color: t.color, names: t.names }; });
          spec.push({ color: Object.keys(SWATCH).filter(function (c) { return used.indexOf(c) < 0; })[0] || "Gray", names: ["", ""] });
          rebuildTeams(i, meals, p, spec);
          return;
        }
        if (act === "del-team") {
          var pD = persistPacket(i, meals);
          var ti = +btn.getAttribute("data-t"), gone = (pD.teams[ti] || {}).color;
          var specD = pD.teams.filter(function (_t, k) { return k !== ti; }).map(function (t) { return { color: t.color, names: t.names }; });
          Object.keys(pD.assignments || {}).forEach(function (k) { if (pD.assignments[k] === gone) pD.assignments[k] = ""; });
          pD.sections = (pD.sections || []).filter(function (b) { return b.team !== gone; });
          if (inkState[i] && inkState[i].team === gone) inkState[i].team = "";
          rebuildTeams(i, meals, pD, specD);
          return;
        }
        if (act === "pin-mode") {
          inkState[i] = inkState[i] || {};
          inkState[i].pins = !inkState[i].pins;
          if (inkState[i].pins) inkState[i].team = "";
          paintSections(i, meals);
          return;
        }
        if (act === "ink") {
          var pInk = meals[i].packetLive || meals[i].packet;
          inkState[i] = inkState[i] || {};
          var color = btn.getAttribute("data-ink");
          inkState[i].team = inkState[i].team === color ? "" : color;
          inkState[i].pins = false;
          paintSections(i, meals);
          return;
        }
        if (act === "delete-section") {
          var pDel = meals[i].packetLive || meals[i].packet;
          var sel = inkState[i] && inkState[i].selected;
          if (!pDel || !sel) return;
          pDel.sections = (pDel.sections || []).filter(function (box) { return box.id !== sel; });
          inkState[i].selected = "";
          persistPacket(i, meals);
          paintSections(i, meals);
          return;
        }
        if (act === "remove-team") {
          var p2 = meals[i].packetLive;
          if ((p2.teams || []).length <= 1) return;
          var names2 = (p2.teams || []).map(function (t) { return t.names; });
          var next2 = PreShift.defaultTeams(p2.teams.length - 1, PreShift.extraOpeningFromTeams(p2.teams));
          next2.forEach(function (t, ti) { if (names2[ti]) t.names = names2[ti]; });
          p2.teams = next2;
          var all2 = loadPacketStore();
          all2[p2.key] = all2[p2.key] || {};
          all2[p2.key].teams = p2.teams;
          all2[p2.key].teamCount = p2.teams.length;
          savePacketStore(all2);
          redrawPacket(i, meals);
        }
      });
    });
    loadDiagram(i, meals);
    // Save taps only: the toggle event also fires for sections that are drawn open
    root.addEventListener("click", function (ev) {
      var s = ev.target.closest("summary"), d = s && s.parentElement;
      var k = d && d.getAttribute("data-fold");
      // The click lands before the section flips, so the new state is the opposite
      if (k) saveFold((meals[i].packetLive || meals[i].packet).key, k, !d.open);
    });
    bindDutyChart(i, meals);
    bindSectionDraw(i, meals);
    paintSections(i, meals);
  }

  // Teams keep their own colors and names; duties re-split for the new team count
  function rebuildTeams(i, meals, p, spec) {
    var next = PreShift.defaultTeams(spec.length, PreShift.extraOpeningFromTeams(p.teams));
    next.forEach(function (t, ti) { t.color = spec[ti].color; if (spec[ti].names) t.names = spec[ti].names; });
    p.teams = next;
    meals[i].packetLive = p;
    var all = loadPacketStore();
    all[p.key] = all[p.key] || {};
    all[p.key].teams = p.teams;
    all[p.key].teamCount = p.teams.length;
    all[p.key].assignments = p.assignments;
    all[p.key].sections = PreShift.normalizeSections(p.sections || []);
    savePacketStore(all);
    redrawPacket(i, meals);
  }

  // New color for a team; a team already on that color swaps to the old one. Tables and boxes follow.
  function recolorTeam(i, meals, ti, color) {
    var p = meals[i].packetLive;
    var old = p.teams[ti].color;
    if (!color || color === old) return;
    var swap = p.teams.filter(function (t) { return t.color === color; })[0];
    function map(c) { return c === old ? color : (swap && c === color ? old : c); }
    p.teams[ti].color = color;
    if (swap) swap.color = old;
    Object.keys(p.assignments || {}).forEach(function (k) { p.assignments[k] = map(p.assignments[k]); });
    (p.sections || []).forEach(function (b) { b.team = map(b.team); });
    if (inkState[i] && inkState[i].team) inkState[i].team = map(inkState[i].team);
    var all = loadPacketStore();
    all[p.key] = all[p.key] || {};
    all[p.key].teams = p.teams;
    all[p.key].teamCount = p.teams.length;
    all[p.key].assignments = p.assignments;
    all[p.key].sections = PreShift.normalizeSections(p.sections || []);
    savePacketStore(all);
    redrawPacket(i, meals);
  }

  function hitPin(pins, x, y, r) {
    var best = "", bestD = 16;
    Object.keys(pins || {}).forEach(function (k) {
      var dx = (pins[k].x - x) * r.width / 100, dy = (pins[k].y - y) * r.height / 100;
      var d = Math.sqrt(dx * dx + dy * dy);
      if (d < bestD) { bestD = d; best = k; }
    });
    return best;
  }

  // Table -> team: update the dropdown too, since the packet is read back from it
  function setSelect(i, table, team, p) {
    p.assignments = p.assignments || {};
    p.assignments[table] = team;
    var sel = document.querySelector('#pkt-' + i + ' [data-k="assign"][data-table="' + table + '"]');
    if (sel) { sel.value = team; sel.style.borderLeftColor = SWATCH[team] || "transparent"; }
  }

  function setTableTeam(i, meals, table, team) {
    var p = meals[i].packetLive || meals[i].packet;
    setSelect(i, table, team, p);
    persistPacket(i, meals);
    paintSections(i, meals);
    refreshLoads(i, meals);
  }

  function bindSectionDraw(i, meals) {
    var layer = document.querySelector('[data-sec-layer="' + i + '"]');
    if (!layer || layer.getAttribute("data-bound") === "1") return;
    layer.setAttribute("data-bound", "1");
    var drag = null;
    function rectOf() { return layer.getBoundingClientRect(); }
    function draftBox(ev) {
      var draft = layer.querySelector('[data-sec-draft="' + i + '"]');
      if (!draft || !drag) return;
      var r = rectOf();
      var box = PreShift.sectionBoxFromDrag(drag.x, drag.y, ev.clientX, ev.clientY, r, drag.team);
      if (!box) { draft.style.display = "none"; return; }
      var color = SWATCH[drag.team] || "#888";
      draft.style.cssText = sectionStyle(box) + "display:block;background:" + hexRgba(color, 0.2) + ";border-style:dashed;border-color:" + color + ";";
    }
    layer.addEventListener("pointerdown", function (ev) {
      if (ev.button && ev.button !== 0) return;
      var xb = ev.target.closest && ev.target.closest("[data-sec-del]");
      if (xb) {
        ev.preventDefault();
        var pX = meals[i].packetLive || meals[i].packet;
        pX.sections = (pX.sections || []).filter(function (b) { return b.id !== xb.getAttribute("data-sec-del"); });
        persistPacket(i, meals);
        paintSections(i, meals);
        return;
      }
      var r = rectOf();
      if (!r.width || !r.height) return;
      var x = ((ev.clientX - r.left) / r.width) * 100;
      var y = ((ev.clientY - r.top) / r.height) * 100;
      var p = meals[i].packetLive || meals[i].packet;
      var st = inkState[i] = inkState[i] || {};
      var pinHit = hitPin(p.tablePins, x, y, r);
      if (st.pins) {
        ev.preventDefault();
        p.tablePins = p.tablePins || {};
        if (pinHit) delete p.tablePins[pinHit];
        else {
          var n = PreShift.nextTableNumber(p.tablePins);
          p.tablePins[String(n)] = { x: Math.round(x * 100) / 100, y: Math.round(y * 100) / 100 };
          if (n > (p.tableCount || 0)) {
            var tc = document.querySelector('#pkt-' + i + ' [data-k="tableCount"]');
            if (tc) { tc.value = String(n); persistPacket(i, meals); redrawPacket(i, meals); return; }
          }
        }
        persistPacket(i, meals);
        paintSections(i, meals);
        return;
      }
      if (st.team && pinHit) {
        ev.preventDefault();
        setTableTeam(i, meals, pinHit, p.assignments && p.assignments[pinHit] === st.team ? "" : st.team);
        return;
      }
      var hit = PreShift.hitSection(p.sections || [], x, y);
      if (hit) {
        ev.preventDefault();
        inkState[i] = inkState[i] || {};
        inkState[i].selected = hit.id;
        paintSections(i, meals);
        return;
      }
      inkState[i] = inkState[i] || {};
      inkState[i].selected = "";
      paintSections(i, meals);
      var team = inkState[i].team;
      if (!team) return;
      ev.preventDefault();
      try { layer.setPointerCapture(ev.pointerId); } catch (e) {}
      drag = { team: team, x: ev.clientX, y: ev.clientY, id: ev.pointerId };
    });
    layer.addEventListener("pointermove", function (ev) {
      if (!drag || ev.pointerId !== drag.id) return;
      ev.preventDefault();
      draftBox(ev);
    });
    function finish(ev) {
      if (!drag || ev.pointerId !== drag.id) return;
      ev.preventDefault();
      var team = drag.team;
      var startX = drag.x;
      var startY = drag.y;
      drag = null;
      var draft = layer.querySelector('[data-sec-draft="' + i + '"]');
      if (draft) draft.style.display = "none";
      var r = rectOf();
      var box = PreShift.sectionBoxFromDrag(startX, startY, ev.clientX, ev.clientY, r, team);
      var pNow = meals[i].packetLive || meals[i].packet;
      var hasPins = Object.keys(pNow.tablePins || {}).length > 0;
      if (!box && hasPins) return;
      if (!box && Math.abs(ev.clientX - startX) < 8 && Math.abs(ev.clientY - startY) < 8) {
        // A tap drops a default-size box centered on the spot
        var hw = r.width * 0.09, hh = r.height * 0.07;
        box = PreShift.sectionBoxFromDrag(startX - hw, startY - hh, startX + hw, startY + hh, r, team);
      }
      if (!box) return;
      var p = meals[i].packetLive || meals[i].packet;
      p.sections = (p.sections || []).concat([box]);
      inkState[i].selected = box.id;
      PreShift.pinsInBox(p.tablePins, box).forEach(function (k) { setSelect(i, k, team, p); });
      persistPacket(i, meals);
      paintSections(i, meals);
      refreshLoads(i, meals);
    }
    layer.addEventListener("pointerup", finish);
    layer.addEventListener("pointercancel", finish);
  }

  function bindPackets(meals) {
    meals.forEach(function (_m, i) { bindOnePacket(i, meals); });
  }

  // ---- Duty chart: master list of every opening/closing duty, who has it, what nobody has ----
  var DUTY_STORE = "bb-preshift-duties";
  function masterDuties() {
    var d = null;
    try { d = JSON.parse(localStorage.getItem(DUTY_STORE) || "null"); } catch (e) {}
    if (!d || !d.opening) return { opening: PreShift.OPENING_DUTIES.slice(), closing: PreShift.CLOSING_DUTIES.slice(), removed: [] };
    var old = PreShift.RETIRED_DUTIES.map(dkey);
    ["opening", "closing"].forEach(function (k) { d[k] = (d[k] || []).filter(function (x) { return old.indexOf(dkey(x)) < 0; }); });
    // Duties added to the built-in list later still show up, unless this device removed them
    var gone = (d.removed || []).map(dkey);
    [["opening", PreShift.OPENING_DUTIES], ["closing", PreShift.CLOSING_DUTIES]].forEach(function (pair) {
      pair[1].forEach(function (t) {
        if (gone.indexOf(dkey(t)) < 0 && !d[pair[0]].some(function (x) { return dkey(x) === dkey(t); })) d[pair[0]].push(t);
      });
    });
    return d;
  }
  function saveMaster(d) { try { localStorage.setItem(DUTY_STORE, JSON.stringify(d)); } catch (e) {} }
  function dkey(t) { return String(t || "").trim().toLowerCase(); }
  function dutyRows(p) {
    var master = masterDuties(), skip = (p.skipDuties || []).map(dkey);
    return ["opening", "closing"].map(function (kind) {
      var seen = {}, rows = [];
      function owner(t) {
        var hit = (p.teams || []).filter(function (tm) { return (tm[kind] || []).some(function (x) { return dkey(x) === dkey(t); }); })[0];
        return hit ? hit.color : "";
      }
      master[kind].forEach(function (t) { seen[dkey(t)] = 1; rows.push({ text: t, team: owner(t), master: true, skip: skip.indexOf(dkey(t)) >= 0 }); });
      (p.teams || []).forEach(function (tm) {
        (tm[kind] || []).forEach(function (t) { if (!seen[dkey(t)] && t.trim()) { seen[dkey(t)] = 1; rows.push({ text: t, team: tm.color, master: false }); } });
      });
      return { kind: kind, rows: rows };
    });
  }
  function missingDuties(p) {
    var out = [];
    dutyRows(p).forEach(function (g) { g.rows.forEach(function (r) { if (!r.team && !r.skip) out.push(r.text); }); });
    return out;
  }
  function dutyChart(p, i) {
    var miss = missingDuties(p).length;
    var teamOpts = (p.teams || []).map(function (t) { return t.color; });
    return '<details class="duty-chart" data-fold="duty"' + (foldOpen(p.key, "duty", miss > 0) ? " open" : "") + '><summary>Duty chart <span class="dc-count' + (miss ? " miss" : "") + '">' +
      (miss ? miss + " not assigned" : "all assigned") + '</span></summary>' +
      dutyRows(p).map(function (g) {
        var gMiss = g.rows.filter(function (r) { return !r.team && !r.skip; }).length;
        return '<details class="dc-group" data-dc-kind="' + g.kind + '"' + (gMiss || dcOpen[i + g.kind] ? " open" : "") + '><summary class="dc-kind">' +
          (g.kind === "opening" ? "Opening" : "Closing") + ' <span class="dc-n">' + g.rows.length + (gMiss ? ' · <b>' + gMiss + ' not assigned</b>' : '') + '</span></summary><ul class="dc-list">' +
          g.rows.map(function (r) {
            var state = r.team ? "" : (r.skip ? " skip" : " miss");
            return '<li class="dc-row' + state + '"><i class="pkt-swatch" style="background:' + (SWATCH[r.team] || "transparent") + '"></i>' +
              '<span class="dc-text">' + esc(r.text) + '</span>' +
              '<select class="dc-sel" data-duty-kind="' + g.kind + '" data-duty="' + esc(r.text) + '" aria-label="Team">' +
                '<option value="">' + (r.skip ? "Not needed" : "Not assigned") + '</option>' +
                teamOpts.map(function (c) { return '<option' + (c === r.team ? " selected" : "") + '>' + esc(c) + '</option>'; }).join("") +
                '<option value="__skip">Not needed tonight</option>' +
              '</select>' +
              '<button type="button" class="dc-x" data-duty-del="' + esc(r.text) + '" data-duty-kind="' + g.kind + '" aria-label="Remove duty">×</button></li>';
          }).join("") + '</ul>' +
          '<input class="dc-new" data-duty-new="' + g.kind + '" placeholder="+ Add ' + g.kind + ' duty"></details>';
      }).join("") + '</details>';
  }
  var dcOpen = {};
  function setDutyTeam(i, meals, kind, text, team) {
    var p = persistPacket(i, meals);
    p.teams.forEach(function (tm) { tm[kind] = (tm[kind] || []).filter(function (x) { return dkey(x) !== dkey(text); }); });
    p.skipDuties = (p.skipDuties || []).filter(function (x) { return dkey(x) !== dkey(text); });
    if (team === "__skip") p.skipDuties.push(text);
    else if (team) p.teams.filter(function (tm) { return tm.color === team; }).forEach(function (tm) { tm[kind].push(text); });
    saveDutyState(i, meals, p);
  }
  function saveDutyState(i, meals, p) {
    meals[i].packetLive = p;
    var all = loadPacketStore();
    all[p.key] = all[p.key] || {};
    all[p.key].teams = p.teams;
    all[p.key].teamCount = p.teams.length;
    all[p.key].skipDuties = p.skipDuties || [];
    savePacketStore(all);
    var open = document.querySelector('#pkt-' + i + ' .duty-chart');
    var wasOpen = open && open.open;
    redrawPacket(i, meals);
    var dc = document.querySelector('#pkt-' + i + ' .duty-chart');
    if (dc && wasOpen) dc.open = true;
  }
  function bindDutyChart(i, meals) {
    var root = document.getElementById("pkt-" + i);
    if (!root) return;
    root.querySelectorAll(".dc-group").forEach(function (dg) {
      dg.addEventListener("toggle", function () { dcOpen[i + dg.getAttribute("data-dc-kind")] = dg.open; });
    });
    root.querySelectorAll(".dc-sel").forEach(function (sel) {
      sel.addEventListener("change", function (ev) {
        ev.stopPropagation();
        setDutyTeam(i, meals, sel.getAttribute("data-duty-kind"), sel.getAttribute("data-duty"), sel.value);
      });
    });
    root.querySelectorAll(".dc-x").forEach(function (b) {
      b.addEventListener("click", function () {
        var kind = b.getAttribute("data-duty-kind"), text = b.getAttribute("data-duty-del");
        var m = masterDuties();
        m[kind] = m[kind].filter(function (x) { return dkey(x) !== dkey(text); });
        m.removed = (m.removed || []).concat([text]);
        saveMaster(m);
        setDutyTeam(i, meals, kind, text, "");
      });
    });
    root.querySelectorAll(".dc-new").forEach(function (inp) {
      inp.addEventListener("keydown", function (ev) {
        if (ev.key !== "Enter") return;
        ev.preventDefault();
        var v = inp.value.trim(), kind = inp.getAttribute("data-duty-new");
        if (!v) return;
        var m = masterDuties();
        if (!m[kind].some(function (x) { return dkey(x) === dkey(v); })) m[kind].push(v);
        m.removed = (m.removed || []).filter(function (x) { return dkey(x) !== dkey(v); });
        saveMaster(m);
        saveDutyState(i, meals, persistPacket(i, meals));
        var again = document.querySelector('#pkt-' + i + ' [data-duty-new="' + kind + '"]');
        if (again) again.focus();
      });
    });
  }

  // The printed packet stays on the corkboard: the contact's first name is fine there (Jason 11/24)
  function printContact(name) {
    var P = window.BBContactPrivacy, first = P ? P.firstName(name) : String(name || "").split(/\s+/)[0];
    return first ? ' · Contact ' + esc(first) : '';
  }

  var printTitle = "";
  // Print: one compact sheet built from the packet data (no inputs, no app chrome)
  function buildPrintSheet(i, meals) {
    var p = persistPacket(i, meals), m = meals[i];
    var old = document.getElementById("pkt-print"); if (old) old.remove();
    var loads = PreShift.teamLoads(p.teams, p.assignments, p.seatsPerTable);
    function tablesOf(color) {
      return Object.keys(p.assignments || {}).filter(function (k) { return p.assignments[k] === color; })
        .sort(function (a, b) { return a - b; }).join(", ");
    }
    function filled(a) { return (a || []).map(function (x) { return String(x || "").trim(); }).filter(Boolean); }
    var teams = (p.teams || []).map(function (t, ti) {
      var names = filled(t.names), tb = tablesOf(t.color), g = loads[ti] && loads[ti].guests;
      return '<tr><td><i style="background:' + (SWATCH[t.color] || "#888") + '"></i><b>' + esc(t.color) + '</b>' +
        '<div class="pp-names">' + (names.length ? esc(names.join(" / ")) : "______ / ______") + '</div></td>' +
        '<td>' + (tb ? esc(tb) : "–") + (g ? '<div class="pp-dim">' + g + ' guests</div>' : '') + '</td>' +
        '<td>' + esc(filled(t.opening).join(", ")) + '</td><td>' + esc(filled(t.closing).join(", ")) + '</td></tr>';
    }).join("");
    var steps = (p.steps || []).map(function (st) {
      var items = filled(st.items).filter(function (x) { return !/\[ask\]/.test(x); }), owners = filled(st.owners);
      if (!st.label && !items.length) return "";
      return '<tr><td class="pp-time">' + esc(st.time || "") + '</td><td><b>' + esc(st.label || "") + '</b>' +
        (items.length ? ' <span class="pp-dim">' + esc(items.join(" · ")) + '</span>' : '') + '</td>' +
        '<td class="pp-dim">' + esc(owners.join(", ")) + '</td></tr>';
    }).join("");
    var specials = (p.specials || []).filter(function (x) { return String(x.text || "").trim(); }).map(function (x) {
      return '<li>' + (x.table ? '<b>Table ' + esc(x.table) + ':</b> ' : '') + esc(x.text) + '</li>';
    }).join("");
    var canvas = document.querySelector('#pkt-' + i + ' .pkt-diag-stage.has-diagram .pkt-diag-canvas');
    var diag = canvas ? '<div class="pp-diag">' + canvas.outerHTML + '</div>' : '';
    var root = document.createElement("div");
    root.id = "pkt-print";
    root.innerHTML =
      '<div class="pp-head">' +
        '<div class="pp-line"><b>' + esc(m.group) + '</b>' + printContact(m.contact) + (m.mgr ? ' · Manager ' + esc(m.mgr) : '') + ' · ' + esc(fmtDate(m.date)) + '</div>' +
        '<div class="pp-meta">' + esc(m.time || "") + ' · ' + esc(m.room || "") + (countPill(m.counts) ? ' · ' + esc(countPill(m.counts)) : '') + '</div></div>' +
      '<div class="pp-h">Assignments</div>' +
      '<table class="pp-teams"><thead><tr><th>Team</th><th>Tables</th><th>Opening</th><th>Closing</th></tr></thead><tbody>' + teams + '</tbody></table>' +
      '<div class="pp-cols"><div><div class="pp-h">Timeline</div><table class="pp-steps">' + steps + '</table></div>' +
        '<div>' + (specials ? '<div class="pp-h">Reminders</div><ul class="pp-sp">' + specials + '</ul>' : '') +
        (String(p.location || "").trim() ? '<div class="pp-h">Breakdown and hotbox</div><div>' + esc(p.location) + '</div>' : '') + '</div></div>' +
      (diag ? '<div class="pp-h">Table sections</div>' + diag : '');
    document.body.appendChild(root);
    var src = canvas && canvas.querySelector("img.is-shown");
    var dst = root.querySelector(".pp-diag img.pkt-diagram-img");
    if (src && dst && src.naturalWidth) {
      try {
        var cv = document.createElement("canvas");
        cv.width = src.naturalWidth; cv.height = src.naturalHeight;
        var cx = cv.getContext("2d");
        cx.drawImage(src, 0, 0);
        // Dark diagram -> white paper: faint lines come out dark, the black ground goes white
        var px = cx.getImageData(0, 0, cv.width, cv.height), d = px.data;
        for (var q = 0; q < d.length; q += 4) {
          var l = 0.3 * d[q] + 0.59 * d[q + 1] + 0.11 * d[q + 2];
          var v = 255 - Math.max(0, Math.min(255, (l - 16) * 4));
          d[q] = d[q + 1] = d[q + 2] = v;
        }
        cx.putImageData(px, 0, 0);
        dst.src = cv.toDataURL("image/png");
        dst.classList.add("pp-light");
      } catch (e) {}
    }
  }
