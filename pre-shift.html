  // ---- Duty assigner: standalone shift tool, saved on this device ----
  function initDutyAssigner() {
    var STORE = "bb-duty-assigner";
    var root = $("da");
    var saved = null; try { saved = JSON.parse(localStorage.getItem(STORE) || "null"); } catch (e) {}
    var state = PreShift.dutyAssignerState(saved);
    var dragMq = window.matchMedia("(pointer: fine) and (min-width: 600px)");
    var picked = null, dragging = null, copied = "";
    var KINDS = [["opening", "Opening"], ["closing", "Closing"]];

    function save() { try { localStorage.setItem(STORE, JSON.stringify(state)); } catch (e) {} }
    function update(next) { state = next; picked = null; copied = ""; save(); draw(); }

    function menu(kind, label) {
      var items = PreShift.dutyUnassigned(state, kind).map(function (d) {
        var open = picked && picked.kind === kind && picked.duty === d;
        var html = '<button type="button" class="da-duty" data-da="pick" data-kind="' + kind + '" data-duty="' + esc(d) + '"' +
          (dragMq.matches ? ' draggable="true"' : '') + ' aria-expanded="' + !!open + '">' + esc(d) + '</button>';
        if (open) {
          html += '<div class="da-pick">' + (state.teams.length ? state.teams.map(function (t) {
            return '<button type="button" class="bb-btn" data-da="assign" data-team="' + esc(t.id) + '">' + esc(t.name) + '</button>';
          }).join("") : '<span class="da-empty">Add a team first.</span>') + '</div>';
        }
        return html;
      }).join("");
      return '<div class="da-box"><div class="da-lab">' + label + '</div><div class="da-list" data-menu="' + kind + '">' +
        (items || '<span class="da-empty">All assigned.</span>') + '</div></div>';
    }

    function teamBox(t) {
      return '<div class="da-box da-team" data-drop="' + esc(t.id) + '">' +
        '<div class="da-head"><input class="da-name" data-team="' + esc(t.id) + '" value="' + esc(t.name) + '" aria-label="Team name" maxlength="40">' +
        '<button type="button" class="da-remove" data-da="remove" data-team="' + esc(t.id) + '" aria-label="Remove team">×</button></div>' +
        KINDS.map(function (k) {
          var items = t[k[0]].map(function (d) {
            return '<button type="button" class="da-duty" data-da="unassign" data-kind="' + k[0] + '" data-duty="' + esc(d) + '" title="Return to the menu">' +
              esc(d) + '<span class="da-x" aria-hidden="true">×</span></button>';
          }).join("");
          return '<div class="da-lab">' + k[1] + '</div><div class="da-list">' +
            (items || '<span class="da-empty">' + (dragMq.matches ? "Drop duties here." : "None yet.") + '</span>') + '</div>';
        }).join("") + '</div>';
    }

    function draw() {
      // Keep each menu's scroll spot across redraws
      var scrolls = {};
      root.querySelectorAll("[data-menu]").forEach(function (el) { scrolls[el.getAttribute("data-menu")] = el.scrollTop; });
      root.innerHTML = '<div class="sec">Duty assigner</div>' +
        '<div class="da-bar">' +
          '<button type="button" class="bb-btn" data-da="add">Add team</button>' +
          '<button type="button" class="bb-btn" data-da="copy">' + (copied || "Copy") + '</button>' +
          '<button type="button" class="bb-btn" data-da="print">Print</button>' +
          '<button type="button" class="bb-btn" data-da="reset">Reset</button>' +
        '</div>' +
        '<p class="da-hint">' + (dragMq.matches ? "Drag a duty onto a team, or tap it and pick a team." : "Tap a duty, then tap a team.") + ' Tap an assigned duty to return it.</p>' +
        '<div class="da-menus">' + menu("opening", "Opening") + menu("closing", "Closing") + '</div>' +
        '<div class="da-teams">' + (state.teams.map(teamBox).join("") || '<span class="da-empty">No teams. Add a team.</span>') + '</div>';
      root.querySelectorAll("[data-menu]").forEach(function (el) { el.scrollTop = scrolls[el.getAttribute("data-menu")] || 0; });
    }

    function copyText(text) {
      function done(ok) { copied = ok ? "Copied" : "Copy failed"; draw(); }
      function fallback() {
        var area = document.createElement("textarea");
        area.value = text; area.setAttribute("readonly", ""); area.style.position = "fixed"; area.style.opacity = "0";
        document.body.appendChild(area); area.select();
        var ok = false; try { ok = document.execCommand("copy"); } catch (e) {}
        area.remove(); done(ok);
      }
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(function () { done(true); }, fallback);
      else fallback();
    }

    function printSheet() {
      clearDutyPrint();
      var old = $("pkt-print"); if (old) old.remove();
      document.documentElement.classList.remove("print-pkt");
      document.body.classList.remove("print-pkt");
      var sheet = document.createElement("div");
      sheet.id = "da-print";
      sheet.textContent = PreShift.dutyAssignerText(state);
      document.body.appendChild(sheet);
      document.documentElement.classList.add("print-da");
      document.body.classList.add("print-da");
      window.print();
    }

    root.addEventListener("click", function (ev) {
      var b = ev.target.closest("[data-da]");
      if (!b) return;
      var act = b.getAttribute("data-da"), kind = b.getAttribute("data-kind"), duty = b.getAttribute("data-duty"), team = b.getAttribute("data-team");
      if (act === "pick") {
        picked = picked && picked.kind === kind && picked.duty === duty ? null : { kind: kind, duty: duty };
        draw();
      }
      else if (act === "assign" && picked) update(PreShift.dutyAssign(state, picked.kind, picked.duty, team));
      else if (act === "unassign") update(PreShift.dutyUnassign(state, kind, duty));
      else if (act === "add") update(PreShift.dutyAddTeam(state));
      else if (act === "remove") update(PreShift.dutyRemoveTeam(state, team));
      else if (act === "reset") update(PreShift.dutyAssignerReset());
      else if (act === "copy") copyText(PreShift.dutyAssignerText(state));
      else if (act === "print") printSheet();
    });
    // Rename in place, with no redraw, so the tap that ended the edit still lands
    root.addEventListener("change", function (ev) {
      var inp = ev.target.closest(".da-name");
      if (!inp) return;
      var id = inp.getAttribute("data-team");
      state = PreShift.dutyRenameTeam(state, id, inp.value);
      copied = "";
      save();
      state.teams.forEach(function (t) { if (t.id === id) inp.value = t.name; });
      root.querySelectorAll('[data-da="assign"]').forEach(function (b) {
        if (b.getAttribute("data-team") === id) b.textContent = inp.value;
      });
    });
    root.addEventListener("keydown", function (ev) {
      if (ev.key === "Enter" && ev.target.classList.contains("da-name")) { ev.preventDefault(); ev.target.blur(); }
    });

    root.addEventListener("dragstart", function (ev) {
      var b = ev.target.closest && ev.target.closest('[data-da="pick"]');
      if (!b || !dragMq.matches) return;
      dragging = { kind: b.getAttribute("data-kind"), duty: b.getAttribute("data-duty") };
      ev.dataTransfer.setData("text/plain", dragging.duty);
      ev.dataTransfer.effectAllowed = "move";
      b.classList.add("dragging");
    });
    root.addEventListener("dragend", function (ev) {
      dragging = null;
      if (ev.target.classList) ev.target.classList.remove("dragging");
      root.querySelectorAll(".da-team.over").forEach(function (el) { el.classList.remove("over"); });
    });
    function dropBox(ev) { return dragging && ev.target.closest ? ev.target.closest("[data-drop]") : null; }
    ["dragenter", "dragover"].forEach(function (type) {
      root.addEventListener(type, function (ev) {
        var box = dropBox(ev);
        if (!box) return;
        ev.preventDefault();
        box.classList.add("over");
      });
    });
    root.addEventListener("dragleave", function (ev) {
      var box = dropBox(ev);
      if (box && !box.contains(ev.relatedTarget)) box.classList.remove("over");
    });
    root.addEventListener("drop", function (ev) {
      var box = dropBox(ev);
      if (!box) return;
      ev.preventDefault();
      var d = dragging; dragging = null;
      update(PreShift.dutyAssign(state, d.kind, d.duty, box.getAttribute("data-drop")));
    });

    if (dragMq.addEventListener) dragMq.addEventListener("change", function () { picked = null; draw(); });
    draw();
    root.hidden = false;
  }
  function clearDutyPrint() {
    var el = $("da-print"); if (el) el.remove();
    document.documentElement.classList.remove("print-da");
    document.body.classList.remove("print-da");
  }
  window.addEventListener("afterprint", clearDutyPrint);
  initDutyAssigner();

  fetch("rundown.html", { cache: "no-cache" }).then(function (r) {
    if (!r.ok) throw new Error("Rundown HTTP " + r.status);
    return r.text();
  }).then(function (t) {
    var doc = new DOMParser().parseFromString(t, "text/html");
    var meals = PreShift.collectPlated(domHelpers(doc));
    render(meals);
  }).catch(function (err) {
    console.error("[pre-shift]", err);
    $("ps-status").className = "status err";
    $("ps-status").textContent = "Could not load the Rundown. Serve Banquet Bot over http (not file://).";
    $("ps-sec").textContent = "Error";
  });
})();
</script>
</body>
</html>
