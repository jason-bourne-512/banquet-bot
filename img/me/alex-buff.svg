<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 250" width="200" height="250">
  <!-- Alex, AV manager, gym edition: no shirt, flexing, chest hair. Based on (Banquet Bot original art): wavy middle-part hair, big mustache, blue dress shirt + patterned tie, name badge, pen, and a little AV headset, a folding Android phone. -->
  
  <style>
    .legA{animation:st .5s ease-in-out infinite alternate} .legB{animation:st .5s ease-in-out -.5s infinite alternate}
    @keyframes st{from{transform:translateY(0)}to{transform:translateY(-7px)}}
    .eye{transform-origin:100px 78px;animation:bl 4.2s infinite} @keyframes bl{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
    .flexL{transform-origin:56px 146px;animation:fx .6s ease-in-out infinite alternate}.flexR{transform-origin:144px 146px;animation:fx2 .6s ease-in-out infinite alternate}@keyframes fx{to{transform:rotate(-6deg) scale(1.04)}}@keyframes fx2{to{transform:rotate(6deg) scale(1.04)}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <ellipse cx="100" cy="244" rx="56" ry="6" fill="#000" opacity=".25"/>
  <!-- slacks + shoes -->
  <g class="legA"><rect x="66" y="196" width="28" height="40" rx="10" fill="#3d4552"/><ellipse cx="78" cy="236" rx="18" ry="8" fill="#2a2420"/></g>
  <g class="legB"><rect x="106" y="196" width="28" height="40" rx="10" fill="#3d4552"/><ellipse cx="122" cy="236" rx="18" ry="8" fill="#2a2420"/></g>
  <rect x="58" y="196" width="84" height="10" rx="3" fill="#2b2f36"/><rect x="95" y="197" width="10" height="8" rx="1.5" fill="none" stroke="#c9ced4" stroke-width="2"/>
  <!-- neck -->
  <rect x="89" y="114" width="22" height="24" rx="6" fill="#ebc4a6"/>
  <!-- back hair: shoulder-length waves -->
  <path d="M100 26 C60 26 48 56 53 86 C55 104 49 116 55 128 Q61 137 69 129 Q76 138 83 127 L83 92 L117 92 L117 127 Q124 138 131 129 Q139 137 145 128 C151 116 145 104 147 86 C152 56 140 26 100 26 Z" fill="#7a5232"/>
  <path d="M58 98 Q62 110 58 122 M142 98 Q138 110 142 122 M70 104 Q74 116 70 126 M130 104 Q126 116 130 126" stroke="#5c3b22" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- flexing arms: double biceps -->
  <g class="flexL"><path d="M62 146 Q40 140 26 150" stroke="#ebc4a6" stroke-width="24" stroke-linecap="round" fill="none"/>
    <path d="M26 150 Q18 128 24 106" stroke="#ebc4a6" stroke-width="20" stroke-linecap="round" fill="none"/>
    <ellipse cx="40" cy="136" rx="15" ry="11" fill="#ebc4a6"/><path d="M30 132 Q40 124 50 134" stroke="#d9a888" stroke-width="2" fill="none" stroke-linecap="round"/>
    <circle cx="25" cy="100" r="11" fill="#f6d6bd"/><path d="M19 97 L31 97 M19 102 L31 102" stroke="#d9a888" stroke-width="1.4"/></g>
  <g class="flexR"><path d="M138 146 Q160 140 174 150" stroke="#ebc4a6" stroke-width="24" stroke-linecap="round" fill="none"/>
    <path d="M174 150 Q182 128 176 106" stroke="#ebc4a6" stroke-width="20" stroke-linecap="round" fill="none"/>
    <ellipse cx="160" cy="136" rx="15" ry="11" fill="#ebc4a6"/><path d="M150 134 Q160 124 170 132" stroke="#d9a888" stroke-width="2" fill="none" stroke-linecap="round"/>
    <circle cx="175" cy="100" r="11" fill="#f6d6bd"/><path d="M169 97 L181 97 M169 102 L181 102" stroke="#d9a888" stroke-width="1.4"/></g>
  <!-- bare V-taper torso -->
  <path d="M48 140 Q100 122 152 140 Q150 172 136 200 Q100 208 64 200 Q50 172 48 140 Z" fill="#ebc4a6"/>
  <!-- pecs -->
  <path d="M60 146 Q78 140 98 148 Q98 166 80 168 Q64 166 60 146 Z" fill="#e3b796"/>
  <path d="M140 146 Q122 140 102 148 Q102 166 120 168 Q136 166 140 146 Z" fill="#e3b796"/>
  <path d="M62 160 Q80 172 98 162 M138 160 Q120 172 102 162" stroke="#d9a888" stroke-width="2.2" fill="none" stroke-linecap="round"/>
  <!-- six pack -->
  <g fill="none" stroke="#d9a888" stroke-width="1.8" stroke-linecap="round">
    <path d="M100 170 L100 200"/><path d="M86 176 Q93 178 99 176 M101 176 Q107 178 114 176"/>
    <path d="M86 186 Q93 188 99 186 M101 186 Q107 188 114 186"/><path d="M88 195 Q94 197 99 195 M101 195 Q106 197 112 195"/></g>
  <!-- chest hair -->
  <g fill="none" stroke="#5c3b22" stroke-width="1.6" stroke-linecap="round">
    <path d="M90 150 q2 -3 4 0 q2 3 4 0"/><path d="M102 150 q2 -3 4 0 q2 3 4 0"/><path d="M84 157 q2 -3 4 0 q2 3 4 0"/><path d="M96 156 q2 -3 4 0 q2 3 4 0"/>
    <path d="M108 157 q2 -3 4 0 q2 3 4 0"/><path d="M90 163 q2 -3 4 0 q2 3 4 0"/><path d="M102 163 q2 -3 4 0 q2 3 4 0"/><path d="M96 170 q2 -3 4 0 q2 3 4 0"/>
    <path d="M98 178 q2 -2 3 0"/><path d="M98 188 q2 -2 3 0"/><path d="M98 197 q2 -2 3 0"/></g>
  <!-- sparkle -->
  <path d="M150 158 l3 -7 l3 7 l7 3 l-7 3 l-3 7 l-3 -7 l-7 -3 Z" fill="#fff" opacity=".85"/>
  <!-- face -->
  <ellipse cx="100" cy="80" rx="39" ry="45" fill="#f6d6bd"/>
  <!-- front hair: middle part sweeping out -->
  <path d="M100 32 Q72 32 61 52 Q54 70 59 94 Q63 72 72 62 Q86 48 100 44 Z" fill="#7a5232"/>
  <path d="M100 32 Q128 32 139 52 Q146 70 141 94 Q137 72 128 62 Q114 48 100 44 Z" fill="#7a5232"/>
  <path d="M98 36 Q82 40 72 54 M102 36 Q118 40 128 54 M66 62 Q62 72 63 84 M134 62 Q138 72 137 84" stroke="#5c3b22" stroke-width="2.2" fill="none" stroke-linecap="round"/>
  <!-- brows + eyes -->
  <path d="M74 64 Q84 58 93 64 M107 64 Q116 58 126 64" stroke="#5c3b22" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <g class="eye"><ellipse cx="84" cy="77" rx="8" ry="9.5" fill="#fff"/><ellipse cx="116" cy="77" rx="8" ry="9.5" fill="#fff"/>
    <circle cx="86" cy="79" r="4.5" fill="#3b2a1e"/><circle cx="114" cy="79" r="4.5" fill="#3b2a1e"/>
    <circle cx="87.5" cy="77.5" r="1.5" fill="#fff"/><circle cx="115.5" cy="77.5" r="1.5" fill="#fff"/></g>
  <!-- nose -->
  <path d="M100 82 Q95 94 99 97 Q103 98 106 95" stroke="#d9a888" stroke-width="2.4" fill="none" stroke-linecap="round"/>
  <!-- big smile under a full mustache -->
  <path d="M86 108 Q100 124 114 108 Q100 114 86 108 Z" fill="#7a2e2e"/>
  <path d="M77 104 Q84 92 100 99 Q116 92 123 104 Q119 112 110 108 Q104 105 100 106 Q96 105 90 108 Q81 112 77 104 Z" fill="#6b4428"/>
  <path d="M86 101 Q90 104 92 103 M108 103 Q110 104 114 101" stroke="#4e311c" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  <circle cx="72" cy="96" r="6" fill="#f29a9a" opacity=".4"/><circle cx="128" cy="96" r="6" fill="#f29a9a" opacity=".4"/>
  <!-- tiny AV headset -->
  <path d="M59 78 Q57 22 100 21 Q143 22 141 78" stroke="#2f3338" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <rect x="53" y="72" width="10" height="18" rx="5" fill="#2f3338"/>
  <path d="M58 88 Q60 106 76 112" stroke="#2f3338" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <ellipse cx="78" cy="112.5" rx="3.5" ry="3" fill="#1d2024"/>
</svg>
