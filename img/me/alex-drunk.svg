<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -6 200 256" width="200" height="250">
  <!-- Alex, AV manager (Banquet Bot original art): big wild curly hair, big mustache, blue dress shirt + patterned tie, name badge, pen, a little AV headset, a folding Android phone, a mug of beer, and a rough-morning hangover face. -->
  <defs>
    <clipPath id="tieClip"><path d="M95 150 L105 150 L111 190 L100 202 L89 190 Z"/></clipPath>
  </defs>
  <style>
    .legA{animation:st .5s ease-in-out infinite alternate} .legB{animation:st .5s ease-in-out -.5s infinite alternate}
    @keyframes st{from{transform:translateY(0)}to{transform:translateY(-7px)}}
    .eye{transform-origin:100px 78px;animation:bl 4.2s infinite} @keyframes bl{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
    .armL{transform-origin:60px 146px;animation:sw .5s ease-in-out infinite alternate}.armR{transform-origin:140px 146px;animation:sw .5s ease-in-out -.5s infinite alternate}@keyframes sw{from{transform:rotate(-10deg)}to{transform:rotate(10deg)}}
    .mane{transform-origin:100px 90px;animation:frz 1.1s ease-in-out infinite alternate}@keyframes frz{from{transform:rotate(-2deg) scale(1)}to{transform:rotate(2deg) scale(1.03)}}
    .fringe{transform-origin:100px 60px;animation:fr2 .8s ease-in-out infinite alternate}@keyframes fr2{from{transform:skewX(-3deg)}to{transform:skewX(3deg)}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
