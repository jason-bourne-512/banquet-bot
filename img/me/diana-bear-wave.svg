<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 250" width="200" height="250">
  <!-- Diana's Live Map buddy: a goofy Houston bear in a red home jersey (Banquet Bot original art). -->
  <style>
    .legA{animation:st .5s ease-in-out infinite alternate} .legB{animation:st .5s ease-in-out -.5s infinite alternate}
    @keyframes st{from{transform:translateY(0)}to{transform:translateY(-7px)}}
    .eye{transform-origin:100px 72px;animation:bl 3.8s infinite} @keyframes bl{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
    .wave{transform-origin:60px 146px;animation:wave .5s ease-in-out infinite alternate}@keyframes wave{from{transform:rotate(-14deg)}to{transform:rotate(18deg)}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
