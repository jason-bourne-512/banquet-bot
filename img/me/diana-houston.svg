    <linearGradient id="flame" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff2c2"/><stop offset=".5" stop-color="#ffc085"/><stop offset="1" stop-color="#ff5f5f" stop-opacity="0"/></linearGradient>
