<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101820">
<link rel="icon" href="favicon-32.png" sizes="32x32">
<link rel="icon" href="favicon-16.png" sizes="16x16">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Notes — Banquet Bot</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#0b1218; --card:#121c25; --line:#22313d; --text:#e6eef4; --muted:#8fa3b3; --sky:#8bd1ff; --amber:#ffc46b; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.45 Manrope, "Segoe UI", sans-serif; }
  body::before { content:''; position:fixed; inset:0; z-index:0; pointer-events:none; background:radial-gradient(ellipse at 100% 0,#2a4f6a59,transparent 46%),radial-gradient(ellipse at 0 100%,#5a4f9a24,transparent 52%); }
  body > * { position:relative; z-index:1; }
  main { max-width:720px; margin:0 auto; padding:24px 18px 64px; }
  html.bbd main { max-width:800px; }
  h1 { font:600 32px/1 'Barlow Condensed', sans-serif; letter-spacing:.04em; text-transform:uppercase; margin:0 0 4px; }
  h1 span { color:var(--sky); }
  .sub { color:var(--muted); font-size:12.5px; margin-bottom:16px; }
  .banner { background:#1a2833; border:1px solid #8bd1ff33; border-left:3px solid var(--sky); border-radius:8px; color:#cde8f8; font-size:12.5px; padding:9px 12px; margin-bottom:16px; }
  .picker { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:18px; }
  .picker button { background:var(--card); color:var(--text); border:1px solid var(--line); border-radius:8px; width:36px; height:36px; font:700 16px/1 inherit; cursor:pointer; }
  .picker button:hover { border-color:var(--sky); color:var(--sky); }
  .picker input[type=date] { background:var(--card); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:7px 10px; font:600 13px Manrope, sans-serif; color-scheme:dark; }
  .picker .day { color:var(--sky); font:600 13px Manrope, sans-serif; letter-spacing:.04em; }
  .status { color:var(--muted); padding:28px 8px; text-align:center; }
  .status.err { color:#ff8a80; }
  .nt-card { background:var(--card); border:1px solid var(--line); border-radius:12px; border-left:3px solid var(--sky); margin-bottom:12px; overflow:hidden; }
  .nt-head { padding:12px 14px 10px; border-bottom:1px solid var(--line); }
  .nt-group { font:600 16px/1.3 Manrope, sans-serif; color:#fff; }
  .nt-meta { color:var(--muted); font-size:12px; margin-top:3px; }
  .nt-thread { display:flex; flex-direction:column; gap:0; padding:4px 0; }
  .nt-author { padding:10px 14px 8px; border-top:1px solid #1a2730; }
  .nt-author:first-child { border-top:0; }
  .nt-who { display:flex; align-items:center; gap:8px; margin-bottom:6px; }
  .nt-av { display:grid; place-items:center; width:26px; height:26px; border-radius:50%; background:#8bd1ff22; color:var(--sky); border:1px solid #8bd1ff66; font:800 11px Manrope, sans-serif; flex:0 0 auto; }
  .nt-name { font:700 13px Manrope, sans-serif; color:#eaf3fa; }
  .nt-note { padding:4px 0 8px 34px; }
  .nt-note:last-child { padding-bottom:2px; }
  .nt-time { display:block; color:var(--muted); font-size:11.5px; margin-bottom:2px; }
  .nt-text { color:#d6e3ee; font-size:13.5px; line-height:1.45; white-space:pre-wrap; }
  .nt-empty { color:var(--muted); font-size:13px; padding:12px 14px; }
  .nt-section { margin-bottom:22px; }
  .nt-section h2 { font:600 15px/1.2 'Barlow Condensed', sans-serif; letter-spacing:.08em; text-transform:uppercase; color:var(--sky); margin:0 0 10px; padding-bottom:6px; border-bottom:1px solid var(--line); }
  .nt-daily { padding-top:6px; border-top:1px solid #8bd1ff33; }
  .nt-daily h2 { margin-top:12px; }
  @media (max-width:700px) {
    main { padding:16px 14px 48px; }
    h1 { font-size:28px; }
    .nt-note { padding-left:0; }
    .picker input[type=date] { flex:1; min-width:0; }
  }
</style>
<script src="scripts/contact-privacy.js?v=1124a"></script>
<script src="theme.js?v=1124c"></script>
<script src="scripts/notes-lib.js?v=1121q"></script>
</head>
<body>
<main>
  <h1>Event <span>Notes</span></h1>
  <p class="sub">Side notes and FYIs. Anything critical still goes on the BEO or to your manager.</p>
  <div class="banner" id="nt-banner"></div>
  <section class="nt-section" id="nt-pinned-sec" aria-labelledby="nt-pinned-title">
    <h2 id="nt-pinned-title">Pinned: General notes</h2>
    <div id="nt-pinned"></div>
  </section>
  <section class="nt-section nt-daily" id="nt-daily-sec" aria-labelledby="nt-daily-title">
    <h2 id="nt-daily-title">Daily event notes</h2>
    <div class="picker">
      <button type="button" id="nt-prev" aria-label="Previous day">‹</button>
      <input id="nt-date" type="date" aria-label="Choose a date">
      <button type="button" id="nt-next" aria-label="Next day">›</button>
      <span class="day" id="nt-day"></span>
    </div>
    <div id="nt-status" class="status">Loading the Rundown…</div>
    <div id="nt-list" hidden></div>
  </section>
</main>
<script>
(function () {
  Notes.applyNotesTester();
  var dateEl = document.getElementById("nt-date");
  var dayEl = document.getElementById("nt-day");
  var list = document.getElementById("nt-list");
  var status = document.getElementById("nt-status");
  var pinnedEl = document.getElementById("nt-pinned");
  var rundown = null;

  function helpers(doc) {
    return {
      sections: [].slice.call(doc.querySelectorAll(".day-section")),
      txt: function (el) { return el ? Notes.clean(el.textContent) : ""; },
      qs: function (el, sel) { return el.querySelector(sel); },
      qsa: function (el, sel) { return [].slice.call(el.querySelectorAll(sel)); },
      attr: function (el, name) { return el.getAttribute(name) || ""; }
    };
  }
  function queryDate() {
    var q = new URLSearchParams(location.search).get("date");
    return Notes.isISODate(q) ? q : Notes.todayISO();
  }
  function setDate(iso, push) {
    if (!Notes.isISODate(iso)) return;
    dateEl.value = iso;
    dayEl.textContent = Notes.formatDayLabel(iso);
    if (push !== false && location.search !== "?date=" + iso) history.replaceState(null, "", "notes.html?date=" + iso);
    render();
  }
  function esc(s) {
    return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;");
  }
  function authorBlocksHtml(authors) {
    if (!authors.length) return '<div class="nt-empty">No notes yet.</div>';
    return authors.map(function (block) {
      var head = '<div class="nt-who"><span class="nt-av">' + esc((block.name || "?").slice(0, 1)) + "</span>" +
        '<span class="nt-name">' + esc(block.name) + "</span></div>";
      var items = block.notes.map(function (n) {
        return '<div class="nt-note"><span class="nt-time">' + esc(n.timeLabel) + "</span>" +
          '<div class="nt-text">' + esc(n.text) + "</div></div>";
      }).join("");
      return '<div class="nt-author">' + head + items + "</div>";
    }).join("");
  }
  function renderPinned() {
    var authors = Notes.pinnedAuthors(Notes.SAMPLE_PINNED);
    var body = authorBlocksHtml(authors);
    pinnedEl.innerHTML = '<article class="nt-card"><div class="nt-thread">' + body + "</div></article>";
  }
  function render() {
    var date = dateEl.value;
    dayEl.textContent = Notes.formatDayLabel(date);
    if (!rundown) return;
    var events = Notes.eventsWithNotes(Notes.collectEvents(rundown, date), Notes.SAMPLE_NOTES);
    if (!events.length) {
      list.hidden = true;
      status.hidden = false;
      status.className = "status";
      status.textContent = "No groups on the Rundown for this day.";
      return;
    }
    status.hidden = true;
    list.hidden = false;
    list.innerHTML = events.map(function (ev) {
      var meta = [ev.time, (ev.rooms || []).join(" · ")].filter(Boolean).join(" · ");
      var authors = ev.authors || Notes.groupNotesByAuthor(ev.notes);
      var body = authorBlocksHtml(authors);
      return '<article class="nt-card"><div class="nt-head"><div class="nt-group">' + esc(ev.group) + "</div>" +
        (meta ? '<div class="nt-meta">' + esc(meta) + "</div>" : "") + "</div>" +
        '<div class="nt-thread">' + body + "</div></article>";
    }).join("");
  }

  document.getElementById("nt-banner").textContent = Notes.SAMPLE_BANNER;
  renderPinned();
  dateEl.addEventListener("change", function () { setDate(dateEl.value); });
  document.getElementById("nt-prev").addEventListener("click", function () { setDate(Notes.shiftISODate(dateEl.value, -1)); });
  document.getElementById("nt-next").addEventListener("click", function () { setDate(Notes.shiftISODate(dateEl.value, 1)); });
  setDate(queryDate(), false);

  fetch("rundown.html", {cache: "no-cache"}).then(function (r) {
    if (!r.ok) throw new Error("HTTP " + r.status);
    return r.text();
  }).then(function (html) {
    rundown = helpers(new DOMParser().parseFromString(html, "text/html"));
    render();
  }).catch(function () {
    status.hidden = false;
    status.className = "status err";
    status.textContent = "Could not load the Rundown.";
    list.hidden = true;
  });
})();
</script>
</body>
</html>
