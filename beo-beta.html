<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101820">
<link rel="icon" href="favicon-32.png" sizes="32x32">
<link rel="icon" href="favicon-16.png" sizes="16x16">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="robots" content="noindex,nofollow">
<title>BEO (beta) — Banquet Bot</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#0b1218; --card:#121c25; --line:#22313d; --text:#e6eef4; --muted:#8fa3b3; --sky:#8bd1ff; --red:#ff6b6b; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.45 Manrope, "Segoe UI", sans-serif; }
  body::before { content:''; position:fixed; inset:0; z-index:0; pointer-events:none; background:radial-gradient(ellipse at 100% 0,#2a4f6a59,transparent 46%),radial-gradient(ellipse at 0 100%,#5a4f9a24,transparent 52%); }
  body > * { position:relative; z-index:1; }
  main { max-width:980px; margin:0 auto; padding:24px 18px 64px; }
  h1 { font:600 32px/1 'Barlow Condensed', sans-serif; letter-spacing:.04em; text-transform:uppercase; margin:0 0 4px; }
  h1 span { color:var(--sky); }
  .sub { color:var(--muted); font-size:12.5px; margin-bottom:16px; }
  .banner { background:#1a2833; border:1px solid #8bd1ff33; border-left:3px solid var(--sky); border-radius:8px; color:#cde8f8; font-size:12.5px; padding:9px 12px; margin-bottom:16px; }
  .picker { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:18px; }
  .picker button { background:var(--card); color:var(--text); border:1px solid var(--line); border-radius:8px; width:36px; height:36px; font:700 16px/1 inherit; cursor:pointer; }
  .picker button:hover { border-color:var(--sky); color:var(--sky); }
  .picker input[type=date] { background:var(--card); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:7px 10px; font:600 13px Manrope, sans-serif; color-scheme:dark; }
  .picker .day { color:var(--sky); font:600 13px Manrope, sans-serif; letter-spacing:.04em; }
  .status { color:var(--muted); padding:28px 8px; text-align:center; }
  .status.err { color:#ff8a80; }
  .beo { background:var(--card); border:1px solid var(--line); border-radius:12px; border-left:3px solid var(--sky); margin-bottom:22px; overflow:hidden; }
  .beo-head { padding:12px 14px 10px; border-bottom:1px solid var(--line); }
  .beo-title { font:600 17px/1.3 Manrope, sans-serif; color:#fff; }
  .beo-meta { color:var(--muted); font-size:12px; margin-top:3px; }
  .beo-pages { padding:12px 14px; display:flex; flex-direction:column; gap:10px; background:#0e161d; }
  .beo-pages img { width:100%; height:auto; display:block; background:#fff; border-radius:4px; }
  .beo-pages a { display:block; }
  .beo-upd { padding:10px 14px; border-top:1px solid var(--line); }
  .beo-upd h3, .beo-notes h3 { font:600 13px/1.2 'Barlow Condensed', sans-serif; letter-spacing:.1em; text-transform:uppercase; margin:0 0 6px; }
  .beo-upd h3 { color:var(--red); }
  .beo-notes h3 { color:var(--sky); }
  .upd { color:var(--red); font-weight:600; font-size:13.5px; margin:3px 0; }
  .upd small { font-weight:500; opacity:.85; }
  .beo-notes { padding:10px 14px 14px; border-top:1px solid var(--line); }
  .bn { padding:6px 0; border-top:1px solid #1a2730; }
  .bn:first-of-type { border-top:0; }
  .bn-time { color:var(--muted); font-size:11.5px; display:block; }
  .bn-text { color:#d6e3ee; white-space:pre-wrap; }
  .bn-del { background:none; border:0; color:var(--muted); cursor:pointer; font-size:11.5px; padding:0; margin-left:8px; }
  .bn-del:hover { color:var(--red); }
  .bn-empty { color:var(--muted); font-size:13px; }
  .bn-form { display:flex; gap:8px; margin-top:8px; align-items:flex-start; }
  .bn-form textarea { flex:1; min-height:54px; background:#0e161d; color:var(--text); border:1px solid var(--line); border-radius:8px; padding:8px 10px; font:13.5px Manrope, sans-serif; resize:vertical; }
  .bn-form button { background:var(--sky); color:#0c141b; border:0; border-radius:8px; padding:8px 14px; font:700 13px Manrope, sans-serif; cursor:pointer; }
  .other { margin-top:6px; }
  .beo-pages a { position:relative; }
  .hl-layer { position:absolute; inset:0; touch-action:pan-y; cursor:crosshair; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; }
  .hl, .hl-preview { position:absolute; background:rgba(255,230,0,.4); mix-blend-mode:multiply; border-radius:2px; }
  .hl { cursor:pointer; }
  .hl-preview { pointer-events:none; outline:1px dashed #b39b00; }
  .b-auth { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:14px; font-size:12.5px; color:var(--muted); }
  .b-auth button { background:#1d3344; color:var(--sky); border:1px solid #8bd1ff66; border-radius:8px; font:700 12px Manrope, sans-serif; padding:8px 12px; cursor:pointer; }
  @media (max-width:700px) { main { padding:16px 14px 48px; } h1 { font-size:28px; } .picker input[type=date] { flex:1; min-width:0; } }
</style>
<script src="theme.js?v=1121c"></script>
<script src="scripts/notes-lib.js?v=1123a"></script>
<script src="scripts/beo-local-store.js?v=1123a"></script>
</head>
<body>
<main>
  <h1>BEO <span>Beta</span></h1>
  <p class="sub">The original BEO pages for the day, as received. Updates in red, notes underneath.</p>
  <div class="banner" id="b-banner">Beta, for testing. The originals, your notes, and your highlights stay on this Mac.</div>
  <div class="picker">
    <button type="button" id="b-prev" aria-label="Previous day">‹</button>
    <input id="b-date" type="date" aria-label="Choose a date">
    <button type="button" id="b-next" aria-label="Next day">›</button>
    <span class="day" id="b-day"></span>
  </div>
  <div id="b-status" class="status">Loading…</div>
  <div id="b-msg" class="status err" hidden></div>
  <div id="b-list" hidden></div>
</main>
<script>
(function () {
  // Mac-only: nothing loads, saves, or turns on a side-panel link unless this is localhost / 127.0.0.1.
  var isLocal = location.hostname === "127.0.0.1" || location.hostname === "localhost";
  if (!isLocal) {
    document.getElementById("b-banner").hidden = true;
    document.querySelector(".picker").hidden = true;
    var st0 = document.getElementById("b-status");
    st0.textContent = "This tab only works on the Mac, at http://127.0.0.1:8765/beo-beta.html (start it with node scripts/serve-beo-beta.js).";
    return;
  }
  var dateEl = document.getElementById("b-date"), dayEl = document.getElementById("b-day");
  var list = document.getElementById("b-list"), status = document.getElementById("b-status");
  var index = null, updates = null, rundownOk = false;

  function esc(s) { return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
  // Notes and highlights save through the local server to beo-local-state.json on this Mac.
  // If the server cannot be reached they save in this browser (localStorage) instead.
  var store = BeoLocal.createStore({fetch: window.fetch.bind(window), storage: localStorage});
  var fbNotes = [], fbHl = [], loadedDate = null, loadSeq = 0, suppressClick = false;
  function hlOn() { return true; }
  function findEo(date, eo) {
    return (((index && index.days) || {})[date] || []).filter(function (e) { return String(e.eo) === String(eo); })[0] || null;
  }
  function loadDay() {
    var date = dateEl.value, seq = ++loadSeq;
    if (!Notes.isISODate(date)) return Promise.resolve();
    return Promise.all([store.listNotes(date), store.listHighlights(date)]).then(function (r) {
      if (seq !== loadSeq) return;
      fbNotes = r[0]; fbHl = r[1]; loadedDate = date; showMode(); render();
    }).catch(function () {
      if (seq !== loadSeq) return;
      showMsg("Could not load notes and highlights.");
    });
  }
  function showMode() {
    var b = document.getElementById("b-banner");
    b.textContent = "Beta, for testing. The originals, your notes, and your highlights stay on this Mac." +
      (store.mode() === "local" ? " The local server is not running, so notes are saved in this browser only. Start it with node scripts/serve-beo-beta.js." : "");
  }
  function showMsg(t) {
    var el = document.getElementById("b-msg"); if (!el) return;
    el.textContent = t; el.hidden = !t;
  }
  function shortDate(iso) {
    var m = /^(\d{4})-(\d\d)-(\d\d)$/.exec(iso || ""); if (!m) return iso || "";
    return new Date(+m[1], +m[2] - 1, +m[3]).toLocaleDateString("en-US", {month: "short", day: "numeric"});
  }
  function words(s) { return String(s || "").toLowerCase().replace(/[^a-z0-9 ]+/g, " ").split(/\s+/).filter(Boolean); }

  // Red lines from the Rundown: every data-upd on the day's cards and rows ("YYYY-MM-DD|Who|What").
  function collectUpdates(doc) {
    var out = {};
    [].slice.call(doc.querySelectorAll(".day-section")).forEach(function (sec) {
      var date = sec.getAttribute("data-date");
      [].slice.call(sec.querySelectorAll(".event-card")).forEach(function (card) {
        var gEl = card.querySelector(".card-group");
        var group = gEl ? gEl.textContent : "", post = card.getAttribute("data-post") || "";
        var name = group + " " + post;
        var cardEos = eoNumbers(card.textContent + " " + (card.getAttribute("data-post") || ""));
        var els = [card].concat([].slice.call(card.querySelectorAll("[data-upd]")));
        els.forEach(function (el) {
          var raw = el.getAttribute("data-upd"); if (!raw) return;
          raw.split(";;").forEach(function (u) {
            var p = u.split("|");
            if (p.length < 3) return;
            var what = p.slice(2).join("|").trim();
            var own = eoNumbers(what);
            (out[date] = out[date] || []).push({name: name, names: [group, group.split(/\s[\u2014\u2013-]\s/)[0], post], eos: own.length ? own : cardEos, date: p[0].trim(), who: p[1].trim(), what: what});
          });
        });
      });
    });
    return out;
  }
  function eoNumbers(s) {
    var out = [], re = /\bEO\s*#?\s*(\d{5,})/gi, m;
    while ((m = re.exec(String(s || "")))) if (out.indexOf(m[1]) < 0) out.push(m[1]);
    return out;
  }
  function norm(s) { return words(s).filter(function (w) { return !/^(nov|dec|oct)\d{4}$/.test(w); }).join(" "); }
  // Which BEO an update belongs to: explicit EO number first, then exact organization or POST AS name.
  // Anything that points at several BEOs, or none, returns null and stays in the red "other updates" block.
  function assign(eos, u) {
    var hit = eos.filter(function (eo) { return (u.eos || []).indexOf(String(eo.eo)) > -1; });
    if (hit.length) return hit.length === 1 ? hit[0] : null;
    var names = (u.names || []).map(norm).filter(Boolean);
    hit = eos.filter(function (eo) {
      return [eo.org, eo.postAs].some(function (s) { var t = norm(s); return t && names.indexOf(t) > -1; });
    });
    return hit.length === 1 ? hit[0] : null;
  }
  function updLine(u) {
    return '<div class="upd">⚑ ' + esc("Updated " + shortDate(u.date) + " · " + u.who + ": " + u.what) + "</div>";
  }
  function versionLines(eo) {
    var out = [], v = eo.versions || [];
    for (var i = 1; i < v.length; i++) {
      out.push('<div class="upd">⚑ ' + esc("Revision " + (i + 1) + " of " + v.length + ": reprinted " + shortDate(v[i].printed) + " (replaces the " + shortDate(v[i - 1].printed) + " print)") + " <small>" + esc(v[i].source) + "</small>" + (v[i].sameDayConflict ? " " + esc("Conflict: another copy printed the same day differs. Check both packets.") : "") + "</div>");
    }
    if (eo.revisedFlag && v.length < 2) out.push('<div class="upd">⚑ ' + esc("Marked REVISED on the event order, printed " + shortDate(eo.printed)) + "</div>");
    return out.join("");
  }
  function notesHtml(key, eo) {
    var ident = Notes.beoIdentity(key.split("|")[0], eo);
    var items = Notes.beoNotesFor(fbNotes, ident.date, ident.eo);
    var body = items.length ? items.map(function (n) {
      var old = n.printed && n.printed !== ident.printed ? " · " + esc(shortDate(n.printed)) + " print" : "";
      return '<div class="bn"><span class="bn-time">Jason · ' + esc(Notes.formatPinnedTime(n.at)) + old +
        '<button type="button" class="bn-del" data-nid="' + esc(n.id) + '">delete</button></span><div class="bn-text">' + esc(n.text) + "</div></div>";
    }).join("") : '<div class="bn-empty">No notes yet.</div>';
    return body + '<div class="bn-form"><textarea data-key="' + esc(key) + '" maxlength="' + Notes.MAX_TEXT + '" placeholder="Add a note under this BEO" aria-label="Add a note"></textarea><button type="button" class="bn-add" data-key="' + esc(key) + '">Add</button></div>';
  }
  function hlBoxesHtml(list) {
    return list.map(function (b) {
      return '<div class="hl" data-hid="' + esc(b.id) + '" style="left:' + b.x + "%;top:" + b.y + "%;width:" + b.w + "%;height:" + b.h + '%"></div>';
    }).join("");
  }
  // One page image with its yellow-highlight layer. The layer sits inside the link, so a plain tap still opens the original.
  function pageHtml(date, eo, p, i, ident) {
    var layer = hlOn() ? '<div class="hl-layer" data-date="' + esc(date) + '" data-eo="' + esc(eo.eo) + '" data-page="' + i + '">' +
      hlBoxesHtml(Notes.highlightsFor(fbHl, ident, i)) + "</div>" : "";
    return '<a href="beo-originals/' + esc(p) + '" target="_blank" rel="noopener"><img draggable="false" loading="lazy" src="beo-originals/' + esc(p) + '" alt="' + esc(eo.org + " BEO page " + (i + 1)) + '">' + layer + "</a>";
  }
  function render() {
    var date = dateEl.value;
    dayEl.textContent = Notes.formatDayLabel(date);
    if (!index) return;
    var eos = (index.days || {})[date] || [];
    if (!eos.length) {
      list.hidden = true; status.hidden = false; status.className = "status";
      status.textContent = "No BEO originals on this computer for this day. (Originals come from the packets in Downloads, window " + index.from + " to " + index.to + ".)";
      return;
    }
    status.hidden = true; list.hidden = false;
    var dayUpds = (updates && updates[date]) || [], used = {};
    var assigned = dayUpds.map(function (u) { return assign(eos, u); });
    var html = eos.map(function (eo) {
      var key = date + "|" + eo.eo;
      var mine = dayUpds.filter(function (u, i) { if (assigned[i] === eo) { used[i] = 1; return true; } return false; });
      var ident = Notes.beoIdentity(date, eo);
      var pg = eo.pages.map(function (p, i) { return pageHtml(date, eo, p, i, ident); }).join("");
      var pagesNote = eo.pages.length < eo.expectedPages ? '<div class="upd">⚑ ' + esc("Only " + eo.pages.length + " of " + eo.expectedPages + " pages found in the packets") + "</div>" : "";
      var all = versionLines(eo) + pagesNote + mine.map(updLine).join("");
      return '<article class="beo"><div class="beo-head"><div class="beo-title">' + esc(eo.postAs || eo.org) + "</div>" +
        '<div class="beo-meta">' + esc("EO " + eo.eo + " · " + eo.org + " · printed " + shortDate(eo.printed) + " · " + eo.pages.length + " page" + (eo.pages.length == 1 ? "" : "s")) + "</div></div>" +
        '<div class="beo-pages">' + pg + "</div>" +
        (all ? '<div class="beo-upd"><h3>Updates</h3>' + all + "</div>" : "") +
        '<div class="beo-notes"><h3>Notes</h3>' + notesHtml(key, eo) + "</div></article>";
    }).join("");
    var rest = dayUpds.filter(function (u, i) { return !used[i]; });
    if (rest.length) html += '<div class="beo-upd other"><h3>Other updates this day (not matched to a BEO above)</h3>' + rest.map(function (u) { return updLine(u).replace("⚑ ", "⚑ " + u.name.replace(/\s+/g, " ").trim().slice(0, 60) + ": "); }).join("") + "</div>";
    if (!rundownOk) html += '<div class="status err">Could not read the Rundown, so email updates are not shown.</div>';
    list.innerHTML = html;
  }
  function setDate(iso, push) {
    if (!Notes.isISODate(iso)) return;
    dateEl.value = iso;
    if (push !== false && location.search !== "?date=" + iso) history.replaceState(null, "", "beo-beta.html?date=" + iso);
    fbNotes = []; fbHl = []; loadedDate = null; showMsg("");
    render();
    loadDay();
  }
  list.addEventListener("click", function (e) {
    var t = e.target;
    // A drag or a highlight tap must not open the original in a new tab.
    if (suppressClick || (t.closest && t.closest(".hl"))) { e.preventDefault(); suppressClick = false; return; }
    var nid = t.getAttribute && t.getAttribute("data-nid");
    if (nid) {
      fbNotes = fbNotes.filter(function (n) { return n.id !== nid; }); render();
      store.deleteNote(nid).catch(function () { showMsg("Could not delete the note."); loadedDate = null; loadDay(); });
      return;
    }
    var key = t.getAttribute && t.getAttribute("data-key");
    if (!key || !t.classList.contains("bn-add")) return;
    var parts = key.split("|"), eo = findEo(parts[0], parts[1]);
    var ta = list.querySelector('textarea[data-key="' + key.replace(/"/g, "") + '"]');
    var v = Notes.validateNoteText(ta ? ta.value : "");
    if (!v.ok) { if (ta && ta.value.trim()) showMsg(v.reason); return; }
    if (!eo) return;
    showMsg("");
    t.disabled = true;
    var o = Notes.beoIdentity(parts[0], eo); o.text = v.text;
    store.addNote(o).then(function (n) { fbNotes.push(n); render(); }).catch(function (err) {
      t.disabled = false; showMsg(err && err.message || "Could not save the note.");
    });
  });

  // Highlights: drag a box on a page image (mouse, touch, or pen). Tap a box to remove it.
  // Coordinates are percent of the image, so boxes follow the page when it resizes.
  var drag = null;
  function layerOf(el) { return el && el.closest ? el.closest(".hl-layer") : null; }
  function layerHighlights(layer) {
    var date = layer.getAttribute("data-date"), eo = findEo(date, layer.getAttribute("data-eo"));
    var page = +layer.getAttribute("data-page");
    return {date: date, eo: eo, page: page, ident: eo && Notes.beoIdentity(date, eo)};
  }
  function drawLayer(layer) {
    var info = layerHighlights(layer);
    if (info.ident) layer.innerHTML = hlBoxesHtml(Notes.highlightsFor(fbHl, info.ident, info.page));
  }
  function endDrag() {
    if (drag && drag.preview && drag.preview.parentNode) drag.preview.parentNode.removeChild(drag.preview);
    drag = null;
  }
  function holdClick() { suppressClick = true; setTimeout(function () { suppressClick = false; }, 120); }
  list.addEventListener("pointerdown", function (e) {
    var layer = layerOf(e.target);
    if (!layer || !hlOn() || (e.pointerType === "mouse" && e.button !== 0)) return;
    endDrag();
    drag = {layer: layer, pid: e.pointerId, x: e.clientX, y: e.clientY, rect: layer.getBoundingClientRect(), moved: false, preview: null,
      hit: e.target.closest(".hl")};
    try { layer.setPointerCapture(e.pointerId); } catch (err) {}
    if (e.pointerType === "mouse") e.preventDefault();
  });
  list.addEventListener("pointermove", function (e) {
    if (!drag || e.pointerId !== drag.pid) return;
    if (!drag.moved) {
      if (Math.abs(e.clientX - drag.x) + Math.abs(e.clientY - drag.y) < 6) return;
      drag.moved = true;
      drag.preview = document.createElement("div"); drag.preview.className = "hl-preview"; drag.layer.appendChild(drag.preview);
    }
    var a = Notes.pointPct(drag.x, drag.y, drag.rect), b = Notes.pointPct(e.clientX, e.clientY, drag.rect);
    if (!a || !b) return;
    var s = drag.preview.style;
    s.left = Math.min(a.x, b.x) + "%"; s.top = Math.min(a.y, b.y) + "%";
    s.width = Math.abs(b.x - a.x) + "%"; s.height = Math.abs(b.y - a.y) + "%";
  });
  list.addEventListener("pointercancel", function (e) { if (drag && e.pointerId === drag.pid) endDrag(); });
  list.addEventListener("pointerup", function (e) {
    if (!drag || e.pointerId !== drag.pid) return;
    var d = drag; endDrag();
    var info = layerHighlights(d.layer);
    if (!info.ident) return;
    if (!d.moved) {
      if (!d.hit) return;               // plain tap on the page: the link opens the original
      holdClick();
      var hid = d.hit.getAttribute("data-hid");
      fbHl = Notes.removeHighlight(fbHl, hid); drawLayer(d.layer);
      store.deleteHighlight(hid).catch(function () { showMsg("Could not remove the highlight."); loadedDate = null; loadDay(); });
      return;
    }
    holdClick();
    var box = Notes.highlightFromDrag(d.x, d.y, e.clientX, e.clientY, d.rect);
    if (!box) return;
    var slot = Notes.nextHighlightSlot(Notes.highlightsFor(fbHl, info.ident, info.page));
    if (!slot) { showMsg("This page has the maximum number of highlights (" + Notes.MAX_HIGHLIGHTS + ")."); return; }
    var o = Notes.beoIdentity(info.date, info.eo);
    o.page = info.page; o.slot = slot; o.x = box.x; o.y = box.y; o.w = box.w; o.h = box.h;
    var built;
    try { built = Notes.highlightDoc(o); } catch (err) { showMsg(err.message); return; }
    showMsg("");
    fbHl.push(Notes.highlightFromDoc(built.id, built.data)); drawLayer(d.layer);
    store.addHighlight(o).then(function (h) {
      // The server may have picked a different free slot; swap the placeholder for the saved box.
      fbHl = Notes.removeHighlight(fbHl, built.id); fbHl.push(h); drawLayer(d.layer);
    }).catch(function (err) {
      fbHl = Notes.removeHighlight(fbHl, built.id); drawLayer(d.layer); showMsg((err && err.message) || "Could not save the highlight.");
    });
  });

  // Carry the old browser-only notes (bb-beo-notes-v1) into the store once. Each note that saves is removed from the old key right away,
  // so a reload never adds it twice; notes that could not save or match stay behind.
  function migrateLegacy() {
    if (!index) return Promise.resolve();
    var items = BeoLocal.legacyItems(localStorage, index), saved = [], chain = Promise.resolve();
    if (!items.length) return Promise.resolve();
    items.forEach(function (it) {
      chain = chain.then(function () { return store.addNote(it.input); }).then(function () { saved.push(it); }, function () {});
    });
    return chain.then(function () {
      try { BeoLocal.legacySettle(localStorage, saved); } catch (e) {}
      if (!saved.length) return;
      loadedDate = null; return loadDay();
    });
  }
  // Another browser or tab may have saved something: reload the day's notes and highlights when this one is shown again.
  window.addEventListener("pageshow", function () { loadDay(); });
  window.addEventListener("focus", function () { loadDay(); });
  dateEl.addEventListener("change", function () { setDate(dateEl.value); });
  document.getElementById("b-prev").addEventListener("click", function () { setDate(Notes.shiftISODate(dateEl.value, -1)); });
  document.getElementById("b-next").addEventListener("click", function () { setDate(Notes.shiftISODate(dateEl.value, 1)); });
  var q = new URLSearchParams(location.search).get("date");
  setDate(Notes.isISODate(q) ? q : Notes.todayISO(), false);

  Promise.all([
    fetch("beo-originals/index.json", {cache: "no-cache"}).then(function (r) { if (!r.ok) throw new Error("none"); return r.json(); }),
    fetch("rundown.html", {cache: "no-cache"}).then(function (r) { if (!r.ok) throw new Error("rd"); return r.text(); }).then(function (h) {
      updates = collectUpdates(new DOMParser().parseFromString(h, "text/html")); rundownOk = true;
    }).catch(function () {})
  ]).then(function (res) { index = res[0]; render(); migrateLegacy(); }).catch(function () {
    status.className = "status err";
    status.textContent = "No BEO originals on this computer. Run: node scripts/build-beo-originals.js, then open this page from node scripts/serve-beo-beta.js (http://127.0.0.1:8765/beo-beta.html).";
  });
})();
</script>
