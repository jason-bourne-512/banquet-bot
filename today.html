<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Brief — Banquet Bot</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@300;400;500&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0E0D0B; --surface: #161410; --card: #1C1A16; --border: #2E2A23; --border-light: #3A3630;
    --gold: #C8963E; --gold-dim: #8A6420; --gold-glow: rgba(200,150,62,0.12);
    --cream: #E8E0D0; --muted: #6B6458; --muted2: #4A4540; --white: #F2EDE5;
  }
  body {
    background: var(--bg); color: var(--cream); font-family: 'Instrument Sans', sans-serif;
    min-height: 100vh; padding: 2rem 1rem 4rem;
    background-image: radial-gradient(ellipse at 0% 0%, rgba(200,150,62,0.04) 0%, transparent 60%), radial-gradient(ellipse at 100% 100%, rgba(90,122,80,0.03) 0%, transparent 50%);
  }
  .page-wrap { max-width: 720px; margin: 0 auto; }
  .header { padding-bottom: 1.5rem; margin-bottom: 2rem; border-bottom: 1px solid var(--border); }
  .header-top { display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 0.75rem; margin-bottom: 0.75rem; }
  .hotel-eyebrow { font-family: 'DM Mono', monospace; font-size: 0.6rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); margin-bottom: 0.4rem; }
  .page-title { font-family: 'DM Serif Display', serif; font-size: 2.2rem; line-height: 1; color: var(--white); }
  .page-title span { color: var(--gold); }
  .date-chip { font-family: 'DM Mono', monospace; font-size: 0.65rem; letter-spacing: 0.1em; text-transform: uppercase; background: var(--gold); color: var(--bg); padding: 0.45rem 0.9rem; border-radius: 2px; font-weight: 500; white-space: nowrap; align-self: flex-start; }
  .summary-row { display: flex; gap: 1.5rem; flex-wrap: wrap; }
  .summary-stat { display: flex; flex-direction: column; gap: 0.15rem; }
  .summary-stat .num { font-family: 'DM Serif Display', serif; font-size: 1.4rem; color: var(--gold); line-height: 1; }
  .summary-stat .lbl { font-family: 'DM Mono', monospace; font-size: 0.55rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
  .day-timeline { display: flex; align-items: center; gap: 0; margin-bottom: 2rem; overflow-x: auto; padding-bottom: 0.5rem; scrollbar-width: none; }
  .day-timeline::-webkit-scrollbar { display: none; }
  .tl-item { display: flex; flex-direction: column; align-items: center; position: relative; flex-shrink: 0; }
  .tl-dot { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--border-light); background: var(--card); margin-bottom: 0.4rem; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .tl-dot.active { border-color: var(--gold); background: var(--gold-glow); }
  .tl-dot .inner { width: 5px; height: 5px; border-radius: 50%; background: var(--gold); }
  .tl-label { font-family: 'DM Mono', monospace; font-size: 0.55rem; letter-spacing: 0.08em; color: var(--muted); text-align: center; white-space: nowrap; }
  .tl-event { font-size: 0.6rem; color: var(--gold); text-align: center; white-space: nowrap; margin-top: 0.1rem; max-width: 80px; overflow: hidden; text-overflow: ellipsis; }
  .tl-spacer { flex: 1; min-width: 2rem; height: 1px; background: var(--border); align-self: flex-start; margin-top: 8px; }
  .section-heading { font-family: 'DM Mono', monospace; font-size: 0.58rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); margin-bottom: 1rem; display: flex; align-items: center; gap: 0.75rem; }
  .section-heading::after { content: ''; flex: 1; height: 1px; background: var(--border); }
  .event-card { background: var(--card); border: 1px solid var(--border); border-radius: 6px; overflow: hidden; margin-bottom: 1.25rem; }
  .card-header { padding: 1rem 1.25rem; display: flex; justify-content: space-between; align-items: flex-start; gap: 0.75rem; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  .client-name { font-family: 'DM Serif Display', serif; font-size: 1.2rem; color: var(--white); line-height: 1.25; margin-bottom: 0.7rem; }
  .card-meta { display: flex; gap: 0.5rem 0.6rem; flex-wrap: wrap; align-items: center; margin-bottom: 0.35rem; }
  .meta-chip { font-family: 'DM Mono', monospace; font-size: 0.58rem; letter-spacing: 0.1em; text-transform: uppercase; padding: 0.2rem 0.55rem; border-radius: 2px; border: 1px solid; }
  .meta-chip.room { color: var(--gold); border-color: var(--gold-dim); background: var(--gold-glow); }
  .meta-chip.type { color: var(--muted); border-color: var(--border-light); background: transparent; }
  .time-block { text-align: right; flex-shrink: 0; }
  .time-main { font-family: 'DM Mono', monospace; font-size: 0.95rem; color: var(--gold); font-weight: 500; white-space: nowrap; }
  .card-body { padding: 1rem 1.25rem; }
  .info-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.75rem 1rem; margin-bottom: 1rem; }
  .info-item .lbl { font-family: 'DM Mono', monospace; font-size: 0.55rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin-bottom: 0.2rem; }
  .info-item .val { font-size: 0.88rem; font-weight: 500; color: var(--cream); line-height: 1.3; }
  .food-section { border-top: 1px solid var(--border); padding-top: 0.85rem; margin-top: 0.85rem; }
  .food-header { font-family: 'DM Mono', monospace; font-size: 0.55rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); margin-bottom: 0.5rem; }
  .food-items { display: flex; flex-direction: column; gap: 0.25rem; }
  .food-item { font-size: 0.8rem; color: var(--cream); opacity: 0.8; display: flex; align-items: flex-start; gap: 0.5rem; line-height: 1.4; }
  .food-item::before { content: '·'; color: var(--gold-dim); flex-shrink: 0; }
  .meal-group { margin-bottom: 0.75rem; padding-bottom: 0.75rem; border-bottom: 1px solid var(--border); }
  .meal-group:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
  .setup-row { border-top: 1px solid var(--border); padding-top: 0.75rem; margin-top: 0.75rem; display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center; }
  .setup-label { font-family: 'DM Mono', monospace; font-size: 0.55rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin-right: 0.25rem; }
  .setup-pill { display: inline-flex; align-items: center; gap: 0.35rem; background: rgba(255,255,255,0.04); border: 1px solid var(--border-light); color: var(--cream); font-size: 0.78rem; padding: 0.25rem 0.65rem; border-radius: 20px; }
  .ops-note { background: rgba(200,150,62,0.06); border-left: 2px solid var(--gold-dim); padding: 0.65rem 0.9rem; margin-top: 0.85rem; border-radius: 0 4px 4px 0; }
  .ops-note .text { font-size: 0.8rem; color: var(--cream); opacity: 0.8; line-height: 1.5; }
  .footer { margin-top: 2.5rem; text-align: center; font-family: 'DM Mono', monospace; font-size: 0.55rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted2); }
  @media (max-width: 520px) { .info-row { grid-template-columns: 1fr 1fr; } .page-title { font-size: 1.7rem; } .summary-row { gap: 1rem; } }
</style><script src="theme.js?v=1027d"></script>

<body>
<div class="page-wrap">
  <div class="header">
    <div class="header-top">
      <div>
        <div class="hotel-eyebrow">Westin Austin at The Domain &middot; Banquet Operations</div>
        <div class="page-title">Daily <span>Brief</span></div>
      </div>
      <div class="tb-nav"><button class="tb-arrow" id="prev" aria-label="Previous day">&lsaquo;</button><div class="date-chip" id="dateChip">Loading&hellip;</div><button class="tb-arrow" id="next" aria-label="Next day">&rsaquo;</button></div>
    </div>
    <div class="summary-row" id="summary"></div>
  </div>

  <div id="events"></div>
  <div class="footer" id="foot">Live from the Rundown &middot; <a href="rundown.html" style="color:inherit">Open the Rundown &rarr;</a></div>
</div>
<style>
  .tb-nav { display:flex; align-items:center; gap:6px; }
  .tb-arrow { border:1px solid var(--border-light); background:var(--card); color:var(--cream); border-radius:6px; width:30px; height:30px; font-size:18px; line-height:1; cursor:pointer; }
  .tb-arrow:hover { border-color:var(--gold); color:var(--gold); }
  .crew { display:flex; flex-wrap:wrap; gap:6px; margin:-0.75rem 0 1.75rem; }
  .crew-chip { font-size:0.75rem; padding:0.3rem 0.65rem; border:1px solid var(--border-light); border-radius:20px; background:var(--card); color:var(--cream); }
  .crew-chip b { color:var(--gold); font-weight:600; margin-right:4px; }
  .crew-chip i { font-style:normal; color:var(--muted); margin-left:4px; font-size:0.68rem; }
  /* Meal / break / beverage times — the thing the floor needs first. Orange = meal, teal = break, blue = beverage. */
  .k-bfast { --k:#ffd36b; --kd:rgba(255,211,107,.14); } .k-lunch { --k:#ff9f5a; --kd:rgba(255,159,90,.14); } .k-dinner { --k:#ff7a9a; --kd:rgba(255,122,154,.14); } .k-recep { --k:#c1a6ff; --kd:rgba(193,166,255,.14); }
  .k-meal { --k:#ff9f5a; --kd:rgba(255,159,90,.14); } .k-brk { --k:#4fd6c0; --kd:rgba(79,214,192,.14); } .k-bev { --k:#6fb6ff; --kd:rgba(111,182,255,.14); }
  .meal-group[class*="k-"] { border-left:4px solid var(--k); background:var(--kd); border-radius:0 8px 8px 0; padding:0.6rem 0.75rem !important; border-bottom:none !important; margin-bottom:0.6rem !important; }
  .svc-head { display:flex; align-items:center; flex-wrap:wrap; gap:0.45rem 0.6rem; margin-bottom:0.45rem; }
  .svc-time { font-size:1rem; font-weight:700; color:var(--k); letter-spacing:.01em; white-space:nowrap; }
  .svc-tag { font-size:0.62rem; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:#0e1a26; background:var(--k); padding:0.16rem 0.5rem; border-radius:20px; }
  .svc-where { font-size:0.75rem; color:var(--muted); }
  .tl-item[class*="k-"] .tl-dot { border-color:var(--k); background:var(--kd); }
  .tl-item[class*="k-"] .tl-dot .inner { background:var(--k); }
  .tl-item[class*="k-"] .tl-label { color:var(--k); font-size:0.8rem; font-weight:700; }
  .tl-item[class*="k-"] .tl-event { color:var(--cream); max-width:110px; }
  /* past / now (today only) */
  .meal-group.is-past, .tl-item.is-past { --k:#7d8a96; --kd:rgba(255,255,255,.03); opacity:.55; }
  .meal-group.is-past .svc-tag { background:#4a5560; color:#c9d3db; }
  .meal-group.is-past .svc-time { text-decoration:line-through; text-decoration-thickness:1px; }
  .meal-group.is-now { box-shadow:0 0 0 1px var(--k), 0 0 18px color-mix(in srgb, var(--k) 30%, transparent); }
  .meal-group.is-now .svc-head::after { content:'NOW'; font-size:0.6rem; font-weight:800; letter-spacing:.12em; color:#0e1a26; background:#fff; padding:0.15rem 0.45rem; border-radius:20px; }
  .tl-item.is-now .tl-dot { box-shadow:0 0 0 3px color-mix(in srgb, var(--k) 35%, transparent); }

  /* collapsible menu / setup tables */
  .dd { margin-top:0.35rem; }
  .dd > summary { cursor:pointer; list-style:none; display:inline-flex; align-items:center; gap:6px; max-width:100%; font-size:0.82rem; font-weight:700; color:var(--cream); padding:0.3rem 0.7rem; border:1px solid var(--border-light); border-radius:20px; }
  .dd > summary:hover { border-color:var(--k, var(--gold)); }
  .dd > summary::-webkit-details-marker { display:none; }
  .dd > summary::before { content:'▸'; color:var(--k, var(--gold)); transition:transform .15s; }
  .dd[open] > summary::before { transform:rotate(90deg); }
  .dd > summary em { font-style:normal; color:var(--muted); font-weight:600; letter-spacing:0; text-transform:none; }
  .dd-t { width:100%; border-collapse:collapse; margin-top:0.5rem; font-size:0.8rem; }
  .dd-t td, .dd-t th { padding:0.4rem 0.55rem; border-top:1px solid var(--border); text-align:left; vertical-align:top; line-height:1.45; color:var(--cream); }
  .dd-t tr:nth-child(even) td { background:rgba(255,255,255,.025); }
  .dd-t.kv th { width:84px; font-size:0.62rem; font-weight:800; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); }
  .dd-setup { margin-top:0.85rem; }
  .dd-t th.mh { font-size:0.82rem; font-weight:700; color:var(--k, var(--gold)); letter-spacing:0; text-transform:none; }
  .ev-col.ev-below { border-top:2px solid rgba(139,209,255,.5); padding-top:1rem; margin-top:0.25rem; }
  .dd-t tr.addon td { color:#ffc46b; font-weight:600; }
  .dd > summary em.addon-n { color:#ffc46b; }
  .dg-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(84px, 1fr)); gap:0.5rem; margin-top:0.6rem; }
  .dg { display:flex; flex-direction:column; gap:0.3rem; padding:0.35rem; border:1px solid var(--border); border-radius:8px; background:rgba(255,255,255,.025); color:var(--cream); font:inherit; font-size:0.68rem; line-height:1.3; text-align:left; cursor:zoom-in; }
  .dg:hover { border-color:var(--gold); }
  .dg img { width:100%; aspect-ratio:935/1210; object-fit:contain; background:#fff; border-radius:5px; }
  .dg-big { position:fixed; inset:0; z-index:99; background:rgba(0,0,0,.88); display:flex; flex-direction:column; align-items:center; justify-content:center; padding:1rem; gap:0.5rem; cursor:zoom-out; }
  .dg-big img, .dg-big iframe { max-width:100%; max-height:88vh; background:#fff; border-radius:6px; border:0; }
  .dg-big iframe { width:100%; height:88vh; }
  .dg-big span { color:var(--cream); font-size:0.8rem; }
  .booking { font-size:0.75rem; color:var(--muted); margin-top:0.5rem; line-height:1.5; }
  .empty-day { padding:2rem 0; color:var(--muted); text-align:center; }
  .empty-day a { color:var(--gold); }
</style>
<script>
// Daily Brief, built live from the Rundown (rundown.html day sections) and the posted schedule (index.html).
// Nothing on this page is hand-written any more: open it any day and it shows that day.
(function () {
  var TZ = "America/Chicago";
  var todayISO = function () { return new Intl.DateTimeFormat("en-CA", {timeZone: TZ, year: "numeric", month: "2-digit", day: "2-digit"}).format(new Date()); };
  var q = new URLSearchParams(location.search).get("date");
  var ISO = /^\d{4}-\d{2}-\d{2}$/.test(q || "") ? q : todayISO();
  var dObj = function (iso) { return new Date(iso + "T12:00:00Z"); };
  var shift = function (iso, n) { var t = dObj(iso); t.setUTCDate(t.getUTCDate() + n); return t.toISOString().slice(0, 10); };
  var longDate = function (iso) { return dObj(iso).toLocaleDateString("en-US", {timeZone: "UTC", weekday: "long", month: "long", day: "numeric", year: "numeric"}); };
  var esc = function (s) { return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;"); };
  // foot-row text with each <br> line kept as its own line
  var lines = function (el) { if (!el) return ""; var c = el.cloneNode(true); c.querySelectorAll("br").forEach(function (b) { b.replaceWith("\n"); });
    return c.textContent.split("\n").map(function (l) { return l.replace(/\s+/g, " ").trim(); }).filter(Boolean).join("\n"); };
  var txt = function (el) { if (!el) return ""; var c = el.cloneNode(true); c.querySelectorAll("br").forEach(function (b) { b.replaceWith(" "); }); return c.textContent.replace(/\s+/g, " ").trim(); };
  // House rules: no prices anywhere, first names only.
  var noPrice = function (s) {
    return s.replace(/\s*·?\s*Room rental\s*\$[\d,.]+/gi, "")
      .replace(/\s*(?:@\s*)?\$[\d,.]+(?:\s*\/\s*\$[\d,.]+)?(?:\s*(?:\/\s*pp|per\s+\w+|each|\+\+))?/gi, "")
      .replace(/\s+([,)])/g, "$1").replace(/\(\s*\)/g, "").replace(/[ \t]{2,}/g, " ").trim();
  };
  // Meal / break / beverage, for the colored time tags (orange / teal / blue).
  var kindOf = function (tag, menu) {
    var head = String(menu || "").split(" — ")[0];
    if (/continuous|beverage|\bbar\b|coffee\s*&\s*tea/i.test(tag) || /beverage|package bar|\bbar\b|bartender/i.test(head)) return "bev";
    if (/\bbreak\b/i.test(tag)) return "brk";
    if (/breakfast/i.test(tag)) return "bfast";
    if (/lunch/i.test(tag)) return "lunch";
    if (/dinner/i.test(tag)) return "dinner";
    if (/reception|cocktail|hors/i.test(tag)) return "recep";
    return "meal";
  };
  var KIND = {meal: "🍽", bfast: "🍳", lunch: "🍽", dinner: "🍽", recep: "🥂", brk: "☕", bev: "🥤"};
  var firstName = function (s) { return s.replace(/\s+[A-Z]\.?$/, "").trim(); };

  // "7:00–8:00 AM" / "11:30 AM–1:00 PM" → minutes for sorting + a clean label
  function parseSpan(s) {
    var m = s.replace(/\s+/g, " ").match(/(\d{1,2})(?::(\d{2}))?\s*(AM|PM)?\s*[–-]\s*(\d{1,2})(?::(\d{2}))?\s*(AM|PM)?/i);
    if (!m) return {a: 9e3, b: 9e3, label: s};
    var ap2 = (m[6] || m[3] || "").toUpperCase(), ap1 = (m[3] || "").toUpperCase();
    var h1 = +m[1], h2 = +m[4];
    var mins = function (h, mm, ap) { h = h % 12 + (ap == "PM" ? 12 : 0); return h * 60 + (+mm || 0); };
    // A start with no AM/PM shares the end's, unless that would put it after the end (11:30–1:00 PM → 11:30 AM).
    if (!ap1) { ap1 = ap2; if (mins(h1, m[2], ap1) > mins(h2, m[5], ap2)) ap1 = ap2 == "PM" ? "AM" : "PM"; }
    var lbl = function (h, mm, ap) { return h + ":" + (mm || "00") + " " + ap; };
    return {a: mins(h1, m[2], ap1), b: mins(h2, m[5], ap2), label: lbl(h1, m[2], ap1) + " – " + lbl(h2, m[5], ap2), start: lbl(h1, m[2], ap1), end: lbl(h2, m[5], ap2)};
  }

  function readDay(doc) {
    var sec = doc.querySelector('.day-section[data-date="' + ISO + '"]');
    if (!sec) return null;
    return [].map.call(sec.querySelectorAll(".event-card"), function (card) {
      var foot = {};
      card.querySelectorAll(".foot-row").forEach(function (r) { var k = txt(r.querySelector(".foot-key")).toUpperCase(); if (k) foot[k] = lines(r.querySelector(".foot-val")); });
      var badges = [].map.call(card.querySelectorAll(".card-badges .badge"), txt);
      var svc = [].map.call(card.querySelectorAll(".svc-row"), function (row) {
        var t = parseSpan(txt(row.querySelector(".svc-time")));
        t.tag = txt(row.querySelector(".svc-top .tag"));
        t.room = txt(row.querySelector(".room-pill"));
        t.gtd = txt(row.querySelector(".gtd-pill"));
        t.menu = noPrice(txt(row.querySelector(".svc-menu")));
        t.nofb = /No F&B/i.test(t.tag) || /^No F&B\b/i.test(t.menu);
        return t;
      }).sort(function (x, y) { return x.a - y.a; });
      var diags = [].map.call(card.querySelectorAll(".diag-link"), function (b) {
        var m = (b.getAttribute("onclick") || "").match(/openDiagram\('diagrams\/([^']+)'/);
        return m ? {file: m[1], label: txt(b.querySelector("span"))} : null;
      }).filter(function (d, i, all) { return d && all.findIndex(function (x) { return x && x.file == d.file; }) == i; });
      var pick = function (re) { var b = badges.filter(function (x) { return re.test(x); })[0]; return b ? firstName(b.replace(/^[A-Z]+:\s*/, "")) : ""; };
      return {title: txt(card.querySelector(".card-group")), mgr: pick(/^MGR/), ic: pick(/^IC/), foot: foot, svc: svc, diags: diags,
        a: Math.min.apply(null, svc.map(function (s) { return s.a; }).concat(9e3)), b: Math.max.apply(null, svc.map(function (s) { return s.b; }).concat(0))};
    }).sort(function (x, y) { return x.a - y.a; });
  }

  // Crew for the day from the first schedule table on index.html (column header like "TUE 13").
  function readCrew(doc) {
    var d = dObj(ISO), want = d.toLocaleDateString("en-US", {timeZone: "UTC", weekday: "short"}).toUpperCase() + " " + d.getUTCDate();
    var out = [];
    [].some.call(doc.querySelectorAll("table"), function (tb) {
      var rows = [].slice.call(tb.querySelectorAll("tr")); if (!rows.length) return false;
      var head = [].map.call(rows[0].querySelectorAll("th,td"), function (c) { return txt(c).toUpperCase(); });
      var col = head.indexOf(want); if (col < 0) return false;
      var role = "";
      rows.slice(1).forEach(function (r) {
        var cells = [].map.call(r.querySelectorAll("th,td"), txt);
        if (cells.slice(1).every(function (c) { return !c; })) { role = cells[0]; return; }
        var v = cells[col] || ""; if (!v || /^(OFF|R-OFF|—|-|SVR|HSMN)$/i.test(v)) return;
        out.push({name: firstName(cells[0]), role: role, shift: v});
      });
      return true;
    });
    return out;
  }

  var DESK = false;
  // Add-ons: when a service is a standard package from the banquet menu (menu.html — Healthy Start, Tejas Mexicano,
  // a named break…), anything the event order lists by count ("(35) Bacon") or calls out ("added to buffet",
  // "additional", "upgrade", "substitute") is an extra on top of that package. Staffing lines never count.
  var STOP = {}; ("and with the for of breakfast buffet table break breaks working lunch dinner monday tuesday wednesday thursday friday " +
    "saturday sunday day package packages morning afternoon individual order orders").split(" ").forEach(function (w) { STOP[w] = 1; });
  var words = function (t) { return (String(t).toLowerCase().replace(/&/g, " ").match(/[a-z]+/g) || []).map(function (w) { return w.replace(/s$/, ""); })
    .filter(function (w) { return w.length > 2 && !STOP[w]; }); };
  var PKG = [];
  function readMenu(doc) {
    if (!doc) return;
    doc.querySelectorAll(".menu-sub").forEach(function (sub) {
      var t = txt(sub.querySelector(".sub-title"));
      if (/buffet|healthy|continental|riser|sunrise|grab|monday|tuesday|wednesday|thursday|friday|saturday|sunday|deli|dining|bbq|steakhouse|mediterranean|southwest/i.test(t)) PKG.push(words(t));
      if (/break packages/i.test(t)) sub.querySelectorAll(".item-name").forEach(function (n) { PKG.push(words(txt(n))); });
    });
    PKG = PKG.filter(function (w) { return w.length; });
  }
  function isPackage(name) {
    var mw = words(name);
    return PKG.some(function (p) { return p.filter(function (w) { return mw.indexOf(w) >= 0; }).length / p.length >= 0.6; });
  }
  function isAddon(item) {
    if (/bartender|butler|attendant|\bfee\b|chef\b.*\bfee/i.test(item)) return false;
    return /^\(\d+\)/.test(item) || /\b(added|add[- ]?on|additional|upgrade|substitut\w*|in place of|extra)\b/i.test(item);
  }
  // Today only: services that have ended lose their color; one in progress gets a NOW tag. Re-checked every minute.
  function pastTick() {
    if (ISO != todayISO()) return;
    var hm = new Intl.DateTimeFormat("en-US", {timeZone: TZ, hour: "numeric", minute: "2-digit", hour12: false}).format(new Date()).split(":");
    var now = (+hm[0] % 24) * 60 + (+hm[1]);
    document.querySelectorAll(".meal-group[data-a], .tl-item[data-a]").forEach(function (el) {
      var a = +el.dataset.a, b = +el.dataset.b;
      el.classList.toggle("is-past", b <= now);
      el.classList.toggle("is-now", a <= now && now < b);
    });
  }
  function render(events, crew) {
    DESK = document.documentElement.classList.contains("bbd");
    document.title = "Daily Brief — " + longDate(ISO);
    document.getElementById("dateChip").textContent = dObj(ISO).toLocaleDateString("en-US", {timeZone: "UTC", weekday: "short", month: "short", day: "numeric"}).toUpperCase() + (ISO == todayISO() ? " · TODAY" : "");
    var C = document.getElementById("crewWrap");
    C.innerHTML = crew.length ? '<div class="section-heading">On the schedule</div><div class="crew">' + crew.map(function (c) {
      return '<span class="crew-chip"><b>' + esc(c.name) + "</b>" + esc(c.shift) + (c.role ? "<i>" + esc(c.role.replace(/Servers$/i, "Server").replace(/Bartenders$/i, "Bartender").replace(/Housemen$/i, "Houseman")) + "</i>" : "") + "</span>"; }).join("") + "</div>" : "";
    var E = document.getElementById("events"), T = document.getElementById("timeline"), S = document.getElementById("summary");
    if (!events || !events.length) {
      S.innerHTML = ""; T.innerHTML = ""; document.getElementById("evHead").style.display = "none";
      E.innerHTML = '<div class="empty-day">No events on the Rundown for ' + esc(longDate(ISO)) + '.<br><a href="rundown.html">Open the Rundown &rarr;</a></div>';
      return;
    }
    document.getElementById("evHead").style.display = "";
    var rooms = {}, all = [];
    events.forEach(function (e) { e.svc.forEach(function (s) { if (s.room) rooms[s.room] = 1; all.push(s); }); });
    var gtds = events.map(function (e) { return Math.max.apply(null, e.svc.map(function (s) { return +(s.gtd.match(/\d+/) || [0])[0]; }).concat(0)); });
    var first = all.slice().sort(function (x, y) { return x.a - y.a; })[0], last = all.slice().sort(function (x, y) { return y.b - x.b; })[0];
    S.innerHTML = [[events.length, "Groups"], [Object.keys(rooms).length, "Rooms Active"], [gtds.reduce(function (a, b) { return a + b; }, 0), "Guests (GTD)"],
      [first.start, "First Event"], [last.end, "Last Event"]].map(function (x) { return '<div class="summary-stat"><div class="num">' + esc(x[0]) + '</div><div class="lbl">' + x[1] + "</div></div>"; }).join("");
    var fb = all.filter(function (s) { return !s.nofb; }).sort(function (x, y) { return x.a - y.a; });
    T.innerHTML = fb.map(function (s, i) {
      var k = kindOf(s.tag, s.menu);
      return (i ? '<div class="tl-spacer"></div>' : "") + '<div class="tl-item k-' + k + '" data-a="' + s.a + '" data-b="' + s.b + '"><div class="tl-dot active"><div class="inner"></div></div><div class="tl-label">' + esc(s.start) + '</div><div class="tl-event">' + KIND[k] + " " + esc(s.tag) + "</div></div>"; }).join("");
    var firstOf = {}; // group -> contact/manager already shown on its first event
    var cardHtml = events.map(function (e) {
      var rs = []; e.svc.forEach(function (s) { if (s.room && rs.indexOf(s.room) < 0) rs.push(s.room); });
      var food = e.svc.filter(function (s) { return !s.nofb; }), book = e.svc.filter(function (s) { return s.nofb; });
      var contact = firstName(e.foot.CONTACT || e.ic || "");
      var grp = e.title.split(" — ")[0].trim(), f0 = firstOf[grp];
      if (!f0) firstOf[grp] = {contact: contact, mgr: e.mgr};
      var showContact = contact && !(f0 && f0.contact == contact), showMgr = e.mgr && !(f0 && f0.mgr == e.mgr);
      var notes = ["NOTE", "FOOD", "AV", "BILLING", "SHIPPING"].map(function (k) { return e.foot[k] ? noPrice(e.foot[k]) : ""; }).filter(Boolean);
      var setup = e.foot.ROOM ? noPrice(e.foot.ROOM) : "";
      // desktop: the group name heads its chunk once, so each card shows only its own event name
      var shown = DESK && e.title.indexOf(" — ") > 0 ? e.title.split(" — ").slice(1).join(" — ") : e.title;
      // one GTD for the whole card when every food line has the same count (desktop)
      var gtds = food.map(function (s) { return s.gtd; }).filter(Boolean);
      var oneGtd = DESK && gtds.length > 1 && gtds.every(function (g) { return g == gtds[0]; }) ? gtds[0] : "";
      return '<div class="event-card"><div class="card-header"><div class="card-header-left"><div class="client-name">' + esc(shown) + '</div><div class="card-meta">' +
        rs.map(function (r) { return '<span class="meta-chip room">' + esc(r) + "</span>"; }).join("") +
        (book.length ? '<span class="meta-chip type">' + esc(book.map(function (b) { return b.tag.replace(/\s*—\s*No F&B/i, ""); }).filter(function (v, i, a) { return a.indexOf(v) == i; }).join(" · ")) + "</span>" : "") +
        '</div></div><div class="time-block"><div class="time-main">' + esc(parseLabel(e)) + "</div>" + (oneGtd ? '<div class="gtd-all">' + esc(oneGtd) + "</div>" : "") + "</div></div>" +
        '<div class="card-body"><div class="info-row">' +
          (showContact ? '<div class="info-item"><div class="lbl">Contact</div><div class="val">' + esc(contact) + "</div></div>" : "") +
          (showMgr ? '<div class="info-item"><div class="lbl">Manager</div><div class="val">' + esc(e.mgr) + "</div></div>" : "") +
          '<div class="info-item"><div class="lbl">Rooms</div><div class="val rms">' + rs.map(function (r) { return '<span class="rm">' + esc(r) + "</span>"; }).join(" ") + "</div></div></div>" +
        (food.length ? '<div class="food-section">' + food.map(function (s) {
          var k = kindOf(s.tag, s.menu), cut = s.menu.indexOf(" — "), mhead = cut < 0 ? "" : s.menu.slice(0, cut),
            items = (cut < 0 ? s.menu : s.menu.slice(cut + 3)).split(/\s*·\s*|\s+\/\s+/).map(function (x) { return x.trim(); }).filter(Boolean),
            mname = mhead || items[0] || s.tag, rest = mhead ? items : items.slice(1);
          var quiet = /continuous|all[- ]day/i.test(s.tag) || (k == "bev" && !/reception|dinner|lunch|breakfast/i.test(s.tag));
          var pkg = isPackage(mname), adds = pkg ? rest.filter(isAddon).length : 0;
          return '<div class="meal-group k-' + k + (quiet ? " quiet" : "") + '" data-a="' + s.a + '" data-b="' + s.b + '"><div class="svc-head"><span class="svc-time">' + esc(s.label) + '</span><span class="svc-tag">' + KIND[k] + " " + esc(s.tag) + '</span><span class="svc-where">' + (s.room && rs.length > 1 ? '<span class="rm">' + esc(s.room) + "</span>" : "") + (s.gtd && !oneGtd ? (s.room && rs.length > 1 ? " &middot; " : "") + esc(s.gtd) : "") + '</span></div><div class="food-items">' +
            '<details class="dd"' + (DESK ? "" : " open") + '><summary>' + esc(mname) + (rest.length ? ' <em>' + rest.length + (rest.length == 1 ? " item" : " items") + '</em>' : "") + (adds ? ' <em class="addon-n">+' + adds + (adds == 1 ? " add-on" : " add-ons") + "</em>" : "") + '</summary><table class="dd-t">' +
            rest.map(function (it) { var ad = pkg && isAddon(it); return "<tr" + (ad ? ' class="addon" title="Add-on — not part of the standard menu"' : "") + "><td>" + (ad ? "+ " : "") + esc(it) + "</td></tr>"; }).join("") + "</table></details></div></div>"; }).join("") + "</div>"
          : '<div class="booking nofb">No food or beverage.</div>') +
        (book.length && food.length ? '<div class="booking">' + book.map(function (b) { return esc(b.tag.replace(/\s*—\s*No F&B/i, "")) + " " + esc(b.label) + (b.room ? " · " + esc(b.room) : ""); }).join("<br>") + "</div>" : "") +
        moreBlock(e, setup, notes) +
        "</div></div>";
    });
    // Same group (name before " — ") stacks in one column. Groups with food or beverage come first
    // (they fill the first columns), groups with no F&B after; each set stays in start-time order.
    var order = [], cols = {}, fb = {};
    events.forEach(function (e, i) {
      var g = e.title.split(" — ")[0].trim();
      if (!cols[g]) { cols[g] = []; order.push(g); }
      cols[g].push(cardHtml[i]);
      if (e.svc.some(function (s) { return !s.nofb; })) fb[g] = 1;
    });
    order = order.filter(function (g) { return fb[g]; }).concat(order.filter(function (g) { return !fb[g]; }));
    E.innerHTML = order.map(function (g) { return '<div class="ev-col' + (fb[g] ? "" : " nofb") + '">' + (DESK ? '<div class="grp-name">' + esc(g) + "</div>" : "") + cols[g].join("") + "</div>"; }).join("");
    GROUPS = [].slice.call(E.children);
    lanes(true);
  }
  // Groups go into side-by-side lanes (desktop) in priority order: each one drops into the currently
  // shortest lane, so F&B groups take the top of every lane and no-F&B groups land underneath.
  // A group below another in the same lane gets a dividing line. Phone: one lane.
  var GROUPS = [], LANES = 0;
  function lanes(force) {
    var E = document.getElementById("events"); if (!GROUPS.length) return;
    var n = DESK ? Math.max(1, Math.floor((E.clientWidth + 18) / (440 + 18))) : 1;
    if (n == LANES && !force) return; LANES = n;
    var L = []; for (var i = 0; i < n; i++) { var d = document.createElement("div"); d.className = "ev-lane"; L.push(d); }
    E.innerHTML = ""; L.forEach(function (d) { E.appendChild(d); });
    GROUPS.forEach(function (g) {
      var low = L.reduce(function (a, b) { return b.offsetHeight < a.offsetHeight ? b : a; });
      g.classList.toggle("ev-below", low.children.length > 0);
      low.appendChild(g);
    });
  }
  window.addEventListener("resize", function () { lanes(false); });
  window.addEventListener("load", function () { lanes(true); });
  function moreBlock(e, setup, notes) {
    var table = notes.length || setup ? '<table class="dd-t kv">' +
      (setup ? "<tr><th>Setup</th><td>" + esc(setup).replace(/\n/g, "<br>") + "</td></tr>" : "") +
      ["NOTE", "FOOD", "AV", "BILLING", "SHIPPING"].filter(function (k) { return e.foot[k]; }).map(function (k) {
        var lbl = {NOTE: "Note", FOOD: "Food", AV: "AV", BILLING: "Billing", SHIPPING: "Shipping"}[k];
        return "<tr><th>" + lbl + "</th><td>" + esc(noPrice(e.foot[k])).replace(/\n/g, "<br>") + "</td></tr>"; }).join("") +
      "</table>" : "";
    // Diagrams sit right under the event as small thumbnails; tap one to see it large in the page.
    var grid = e.diags.length ? '<div class="dg-grid">' + e.diags.map(function (d) {
      return '<button type="button" class="dg" data-f="' + esc(d.file) + '"><img loading="lazy" alt="" src="diagrams/previews/' +
        esc(d.file.replace(/\.pdf$/i, ".png")) + '" onerror="this.remove()"><span>' + esc(d.label) + "</span></button>"; }).join("") + "</div>" : "";
    if (DESK) return grid + (table ? '<details class="dd dd-setup"><summary title="Setup &amp; notes">Setup</summary>' + table + "</details>" : "");
    return grid + (table ? '<details class="dd dd-setup" open><summary title="Setup &amp; notes">Setup &amp; notes</summary>' + table + "</details>" : "");
  }
  // Tap a thumbnail: the preview image fills the screen (the PDF itself if there's no preview); tap again to close.
  document.addEventListener("click", function (ev) {
    var big = ev.target.closest(".dg-big"); if (big) { big.remove(); return; }
    var b = ev.target.closest(".dg"); if (!b) return;
    var f = b.dataset.f, img = b.querySelector("img"), o = document.createElement("div");
    o.className = "dg-big";
    o.innerHTML = (img ? '<img alt="" src="' + esc(img.getAttribute("src")) + '">' : '<iframe src="diagrams/' + esc(f) + '#toolbar=0"></iframe>') +
      "<span>" + esc(b.textContent) + "</span>";
    document.body.appendChild(o);
  });
  function parseLabel(e) {
    var a = e.svc.slice().sort(function (x, y) { return x.a - y.a; })[0], b = e.svc.slice().sort(function (x, y) { return y.b - x.b; })[0];
    return a && b ? a.start + " – " + b.end : "";
  }

  document.getElementById("prev").onclick = function () { location.search = "?date=" + shift(ISO, -1); };
  document.getElementById("next").onclick = function () { location.search = "?date=" + shift(ISO, 1); };
  var parse = function (t) { return new DOMParser().parseFromString(t, "text/html"); };
  Promise.all([
    fetch("rundown.html", {cache: "no-cache"}).then(function (r) { return r.text(); }).then(parse),
    fetch("index.html", {cache: "no-cache"}).then(function (r) { return r.text(); }).then(parse).catch(function () { return null; }),
    fetch("menu.html", {cache: "no-cache"}).then(function (r) { return r.text(); }).then(parse).catch(function () { return null; })
  ]).then(function (d) {
    readMenu(d[2]);
    render(readDay(d[0]), d[1] ? readCrew(d[1]) : []);
    pastTick(); setInterval(pastTick, 60000);
  }).catch(function (err) {
    console.error("[today]", err);
    document.getElementById("events").innerHTML = '<div class="empty-day">Couldn\'t load the Rundown. <a href="rundown.html">Open it directly &rarr;</a></div>';
  });
})();
</script>
</body>
</html>
