<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#101820">
<link rel="icon" href="favicon-32.png" sizes="32x32">
<title>Captain Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/bb-shell.css">
<style>
.cr{max-width:940px;margin:auto;padding:22px 18px 60px;font-family:Manrope,Arial,sans-serif}
.cr-note{font-size:12px;color:#9fbdd1;margin:6px 0}
.cr-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 16px}
.cr-btn{position:relative;border:1px solid #4f7a99;border-top-color:#8bd1ff99;border-radius:3px 13px 3px 3px;background:radial-gradient(ellipse at 100% 0,#5aa9d838,transparent 75%),linear-gradient(135deg,#22384a,#15232d);box-shadow:0 8px 14px #00000040,inset 0 1px #ffffff0d;color:#edf5ff;font:500 20px 'Barlow Condensed',sans-serif;letter-spacing:.4px;padding:10px 18px;cursor:pointer;text-transform:uppercase}
.cr-btn small{display:block;font:11px Manrope,Arial,sans-serif;letter-spacing:0;color:#b1c8d9;text-transform:none}
.cr-btn[disabled]{opacity:.5;cursor:default}
.cr-lock{font-size:12px;color:#f2c879}
/* the report itself reads like a printed document */
.cr-paper{background:#fbfaf7;color:#1d2a33;border-radius:4px;box-shadow:0 18px 40px #00000059;padding:44px 52px 40px}
.cr-head{text-align:center;padding-bottom:20px;border-bottom:2px solid #1d2a33}
.cr-head h1{font:700 40px/1.05 'Cormorant Garamond',Georgia,serif;letter-spacing:.5px;margin:0;color:#14202a}
.cr-head .prop{font:500 italic 19px 'Cormorant Garamond',Georgia,serif;color:#4b5d6a;margin-top:4px}
.cr-meta{display:flex;justify-content:center;gap:34px;margin-top:16px;font-size:12px;color:#3c4d59}
.cr-meta b{display:block;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:#8a6d3b;font-weight:700;margin-bottom:2px}
.cr-sec{margin-top:28px;border:1px solid #d9d4c8;border-radius:4px;background:#fff;page-break-inside:avoid}
.cr-sec-h{display:flex;align-items:center;gap:12px;padding:12px 16px;background:#14202a;border-radius:3px 3px 0 0}
.cr-sec-h .n{font:600 12px Manrope,sans-serif;color:#c9a96a;letter-spacing:.1em}
.cr-sec-h input{flex:1;background:transparent;border:0;color:#fff;font:600 22px 'Cormorant Garamond',Georgia,serif;letter-spacing:.3px;padding:0;min-width:0}
.cr-x{border:1px solid #ffffff40;background:transparent;color:#d8e2ea;border-radius:4px;font:11px Manrope,sans-serif;padding:4px 9px;cursor:pointer}
.cr-x:hover{border-color:#ff9d9d;color:#ffb3b3}
.cr-grid{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid #ece8de}
.cr-f{padding:10px 16px;border-right:1px solid #ece8de;border-top:1px solid #ece8de}
.cr-grid .cr-f:nth-child(3n){border-right:0}
.cr-grid .cr-f:nth-child(-n+3){border-top:0}
.cr-f label,.cr-tx label{display:block;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:#8a6d3b;font-weight:700;margin-bottom:3px}
.cr-f input{width:100%;box-sizing:border-box;border:0;border-bottom:1px solid transparent;background:transparent;color:#1d2a33;font:600 14px Manrope,sans-serif;padding:2px 0}
.cr-f input:focus,.cr-sec-h input:focus{outline:none;border-bottom-color:#c9a96a}
.cr-f.blank input{border-bottom:1px solid #9aa6ae}
.cr-tx{padding:12px 16px 4px}
.cr-tx textarea{width:100%;box-sizing:border-box;min-height:40px;border:1px solid #e3ded2;border-radius:4px;background:#fdfcf9;color:#1d2a33;font:13px/1.5 Manrope,sans-serif;padding:7px 9px;resize:vertical;margin-bottom:8px}
.cr-tx textarea:focus{outline:none;border-color:#c9a96a}
.cr-tx.notes textarea{min-height:58px}
.cr-two{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 12px}
.cr-add{margin-top:24px;display:flex;gap:10px;align-items:center;justify-content:center}
.cr-add button{border:1px dashed #9aa6ae;background:transparent;color:#3c4d59;border-radius:4px;font:600 13px Manrope,sans-serif;padding:10px 18px;cursor:pointer}
.cr-add button:hover{border-color:#8a6d3b;color:#8a6d3b}
.cr-restore{font-size:12px;color:#6b7b86;text-align:center;margin-top:10px}
.cr-restore a{color:#8a6d3b;cursor:pointer;text-decoration:underline}
.cr-paper .cr-empty{color:#6b7b86;text-align:center;margin:30px 0 6px;font-size:13px}
.cr input[disabled],.cr textarea[disabled]{border-color:transparent!important;background:transparent;resize:none;opacity:1;color:inherit}
</style>
<script src="theme.js?v=1113a"></script>
</head>
<body class="cr-body">
<header class="bb-header">
  <div class="bb-brand"><span class="bb-mark">bb</span>BANQUET BOT</div>
  <div class="hdr-actions"><a class="reference-trigger" href="index.html" style="display:flex;align-items:center;min-height:40px;border:1px solid #5983a16b;background:linear-gradient(135deg,#273e50,#1b2a36);border-radius:8px;padding:8px 10px;color:#cce9fb;font:11px Manrope,Arial,sans-serif;text-decoration:none">Home</a></div>
</header>
<div class="cr">
  <div id="cr-gate" class="cr-note" hidden>Captain Report is for Jason only.</div>
  <div id="cr-main" hidden>
    <div class="cr-bar">
      <button class="cr-btn" id="cr-fin" type="button" disabled>End Shift / Finalize<small id="cr-fin-n">Locks the report and saves the PDF</small></button>
      <span class="cr-lock" id="cr-lock"></span>
    </div>
    <div class="cr-paper">
      <div class="cr-head">
        <h1>Banquet Captain Report</h1>
        <div class="prop">Westin Austin at The Domain</div>
        <div class="cr-meta"><div><b>Date</b><span id="cr-date"></span></div><div><b>Captain</b>Jason</div><div><b>Manager</b>Hector</div></div>
      </div>
      <div id="cr-events"></div>
      <div class="cr-add" id="cr-add-row"><button type="button" id="cr-add">+ Add event</button></div>
      <div class="cr-restore" id="cr-restore"></div>
    </div>
  </div>
</div>
<script>
(function () {
  var who = null; try { who = JSON.parse(localStorage.getItem("bb-hsm-who") || "null"); } catch (e) {}
  // Same gate as Print Signs: desktop width only, and here Jason only.
  if (!who || who.name != "Jason" || window.innerWidth < 1000) {
    if (who && who.name == "Jason" && window.innerWidth < 1000) document.getElementById("cr-gate").textContent = "Captain Report is on desktop only.";
    document.getElementById("cr-gate").hidden = false; return; }
  document.getElementById("cr-main").hidden = false;

  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return {"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]; }); };
  // plain text, with the Rundown's em and en dashes written as hyphens
  var clean = function (s) { return String(s || "").replace(/\s*[—–]\s*/g, function (m) { return /\s/.test(m) ? " - " : "-"; }).replace(/[ \t]+/g, " ").trim(); };
  var txt = function (n) { return n ? clean(n.textContent.replace(/\s+/g, " ")) : ""; };
  var ISO = new Date().toLocaleDateString("en-CA", {timeZone: "America/Chicago"});
  var KEY = "bb-capt-report-" + ISO;
  var saved = {}; try { saved = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) {}
  if (!saved.edits || Array.isArray(saved.edits)) saved.edits = {};   // the old per-row format is dropped
  saved.removed = saved.removed || []; saved.added = saved.added || [];
  var base = [], events = [];
  // the fields Jason fills in; the rest come from the Rundown and can be overwritten
  var FIELDS = ["name", "mgr", "room", "time", "gtd", "served", "bar", "plates", "svc", "guest", "note"];

  // "10:00–10:30 AM": a start without AM/PM takes the end's
  function mins(t, mer) { var m = /(\d{1,2})(?::(\d\d))?\s*(AM|PM)?/i.exec(t); if (!m) return null;
    var h = +m[1] % 12, ap = (m[3] || mer || "").toUpperCase(); if (ap == "PM") h += 12; return h * 60 + (+m[2] || 0); }
  function fmt(n) { var h = Math.floor(n / 60), m = n % 60; return (h % 12 || 12) + ":" + (m < 10 ? "0" : "") + m + (h < 12 ? " AM" : " PM"); }
  function span(times) {
    var lo = null, hi = null;
    times.forEach(function (t) {
      var p = t.split(/\s*-\s*/), mer = (/(AM|PM)\s*$/i.exec(t) || [])[1], a = mins(p[0], mer), b = p[1] ? mins(p[1], mer) : a;
      if (a == null) return; if (b < a) b += 720;
      if (lo == null || a < lo) lo = a; if (hi == null || b > hi) hi = b;
    });
    return lo == null ? "" : lo == hi ? fmt(lo) : fmt(lo) + " - " + fmt(hi);
  }
  // bar type from the menu headlines ("Favorite Brands Bar (Cash)", "Hosted Bar"), never a food bar like the nacho bar
  var FOODBAR = /station|display|nacho|taco|yogurt|oatmeal|salad|potato|coffee|cereal|parfait|waffle|pancake|omelet/i;
  function barType(card) {
    var out = [];
    [].forEach.call(card.querySelectorAll(".svc-row"), function (r) {
      var tag = r.querySelector(".svc-top .tag"), hls = [].map.call(r.querySelectorAll(".svc-menu .menu-hl"), txt).filter(function (h) { return /\bbar\b/i.test(h) && !FOODBAR.test(h); });
      if (!hls.length && tag && (/tag-bar/.test(tag.className) || /\bbar\b/i.test(tag.textContent))) hls = [txt(tag).split(" - ").filter(function (x) { return /bar/i.test(x); })[0] || txt(tag)];
      hls.forEach(function (h) { h = h.replace(/\s*@?\s*\$[\d.,]+\S*/g, "").replace(/\s*-\s*\d+\s*Hours?/i, "").replace(/\s+Package\b/i, "").trim(); if (out.indexOf(h) < 0) out.push(h); });
    });
    return out.join(" · ");
  }

  var FNB = /breakfast|brunch|lunch|dinner|break|reception|bar\b|beverage|snack|coffee|hors|dessert|meal/i;
  // ── read today's cards from the Rundown (the BEO transcription the other pages use) ──
  function readEvents(sec) {
    base = []; USED = {};
    [].forEach.call(sec.querySelectorAll(".event-card"), function (card) {
      var rows = [].map.call(card.querySelectorAll(".svc-row"), function (r) {
        var tag = r.querySelector(".svc-top .tag"), svc = txt(tag);
        return {time: txt(r.querySelector(".svc-time")), svc: svc, room: txt(r.querySelector(".room-pill")),
          fb: !!tag && !/No F&B/i.test(svc) && (/\btag-/.test(tag.className) || FNB.test(svc)),
          gtd: +((txt(r.querySelector(".gtd-pill")).match(/\d+/) || [0])[0])};
      });
      // set-up, office and meeting bookings with no food or beverage don't get a report (Jason 2026-11-03)
      var fb = rows.filter(function (r) { return r.fb; }); if (!fb.length) return; rows = fb;
      var foot = {};
      [].forEach.call(card.querySelectorAll(".card-foot .foot-row"), function (f) { foot[txt(f.querySelector(".foot-key")).toUpperCase()] = txt(f.querySelector(".foot-val")); });
      var rooms = []; rows.forEach(function (r) { if (r.room && rooms.indexOf(r.room) < 0) rooms.push(r.room); });
      var gtd = Math.max.apply(null, [0].concat(rows.map(function (r) { return r.gtd; })));
      var ev = {id: txt(card.querySelector(".card-group")), name: txt(card.querySelector(".card-group")), mgr: txt(card.querySelector(".badge-mgr")).replace(/^MGR:\s*/i, ""),
        room: rooms.join(", "), time: span(rows.map(function (r) { return r.time; })), gtd: gtd ? String(gtd) : "", served: "", bar: barType(card),
        plates: "", svc: "", guest: "", rows: rows, contact: (foot.CONTACT || "").split(/[\n,·/]/)[0].trim()};
      ev.note = ev.auto = recap(ev, base.length);
      base.push(ev);
    });
  }
  // the report = Rundown events (minus removed ones) + events Jason added, with his edits on top
  function assemble() {
    events = base.filter(function (e) { return saved.removed.indexOf(e.id) < 0; }).concat(saved.added.map(function (a) { return Object.assign({added: 1}, a); }));
    events.forEach(function (e) {
      var ed = saved.edits[e.id]; if (!ed) return;
      FIELDS.forEach(function (f) { if (ed[f] != null) e[f] = ed[f]; });
    });
  }

  var CAP = function (s) { return s.charAt(0).toUpperCase() + s.slice(1); };
  var DAY = 0; for (var d = 0; d < ISO.length; d++) DAY = (DAY * 31 + ISO.charCodeAt(d)) >>> 0;
  var SAY = {
    open: ["Event went well.", "Everything ran smoothly.", "Good one today.", "Solid event start to finish.", "Went right to plan.", "Easy, smooth event.",
      "This one ran well.", "Nice clean event.", "Good event overall.", "Ran well from setup to finish.", "Steady, easy event.", "Happy with how this one went.",
      "Went off without a hitch.", "Nice smooth one."],
    last: ["Smooth final day.", "Final day went well.", "Good way to close out their program.", "They finished strong on the last day.", "Last day ran smoothly.", "Clean finish for the group."],
    food: [function (l, p) { return CAP(l) + " went out on time."; },
      function (l, p) { return "We got " + l + " out on time."; },
      function (l, p) { return CAP(l) + (p ? " all hit their times." : " hit its time."); },
      function (l, p) { return "Timing was good on " + l + "."; },
      function (l, p) { return CAP(l) + (p ? " were" : " was") + " up right on time."; },
      function (l, p) { return "Stayed on schedule with " + l + "."; },
      function (l, p) { return CAP(l) + (p ? " were" : " was") + " ready when they needed " + (p ? "them." : "it."); },
      function (l, p) { return "Kept " + l + " on schedule."; },
      function (l, p) { return "Had " + l + " out right on time."; },
      function (l, p) { return CAP(l) + (p ? " each" : "") + " landed on time."; },
      function (l, p) { return "No delays on " + l + "."; },
      function (l, p) { return CAP(l) + (p ? " all" : "") + " went out when planned."; },
      function (l, p) { return "Right on time with " + l + "."; },
      function (l, p) { return "The team had " + l + " out on schedule."; }],
    bev: ["the beverages stayed stocked", "we kept the beverages stocked", "beverages never ran low", "the drinks never ran out",
      "drinks stayed stocked throughout", "the beverage station stayed full", "we kept the drinks topped off", "the beverages held up the whole time"],
    set: [function (r, b) { return "The room was set on time" + (b ? " and the break stayed stocked." : " and ready on arrival."); },
      function (r, b) { return r + " was ready on time" + (b ? ", and we kept the break stocked." : " for their arrival."); },
      function (r, b) { return "Had " + r + " set on time" + (b ? " and the break never ran low." : " and ready before they walked in."); },
      function (r, b) { return "Room set on time" + (b ? ", break stocked the whole way." : ", ready when they arrived."); },
      function (r, b) { return r + " was set and ready on time" + (b ? ", with the break kept full." : "."); },
      function (r, b) { return "Set " + r + " on time" + (b ? " and kept the break stocked." : " and had it ready for them."); },
      function (r, b) { return "Room was ready on time" + (b ? ", and the break held up all session." : " when the group got there."); },
      function (r, b) { return r + " was set before they arrived" + (b ? ", and the break stayed full." : "."); }],
    bar: ["The bar ran smoothly.", "Bar service went smoothly.", "No trouble at the bar.", "Bar ran clean.", "The bar was steady.", "Bar went fine."],
    happy: [function (c) { return c + " was happy with the room and the service."; },
      function (c) { return c + " was pleased with the room and the service."; },
      function (c) { return c + " liked the room and the service."; },
      function (c) { return c + " had no complaints about the room or the service."; },
      function (c) { return c + " was happy with how the room and service came together."; },
      function (c) { return c + " left happy with the room and the service."; },
      function (c) { return c + " was happy with the room and how service went."; },
      function (c) { return c + " was satisfied with the room and the service."; },
      function (c) { return c + " was good with the room and the service."; },
      function (c) { return c + " was happy with the setup and the service."; },
      function (c) { return c + " liked how the room and service turned out."; },
      function (c) { return c + " came away happy with the room and the service."; },
      function (c) { return "the room and the service both worked for " + c + "."; },
      function (c) { return c + " was all good with the room and the service."; }],
    ok: ["No issues.", "Nothing to report.", "No problems to note.", "No issues to report.", "Nothing came up.", "No issues at all.",
      "All clear, nothing to flag.", "Nothing went wrong.", "Nothing to flag.", "No problems.", "Clean, no issues.", "Nothing needed follow up.",
      "No complaints.", "Zero issues."]
  };
  var USED = {};
  // first phrase from the list (rotated by event and date) not said yet tonight; phrase functions get args
  function pick(list, i, k, args) {
    var first;
    for (var j = 0; j < list.length; j++) {
      var p = list[(i + DAY + k + j) % list.length], s = typeof p == "function" ? p.apply(null, args) : p;
      if (first == null) first = s;
      if (!USED[s]) { USED[s] = 1; return s; }
    }
    return first;
  }
  function recap(e, i) {
    i = i || 0;
    var svcs = e.rows.map(function (r) { return r.svc.toLowerCase(); });
    var has = function (re) { return svcs.some(function (x) { return re.test(x); }); };
    var n = function (re) { return svcs.filter(function (x) { return re.test(x); }).length; };
    var meals = [];
    if (has(/breakfast/)) meals.push("breakfast");
    if (has(/brunch/)) meals.push("brunch");
    if (has(/lunch/)) meals.push(/box lunch/.test(svcs.join(" ")) ? "the box lunch" : "lunch");
    var brk = n(/coffee break|am break|pm break|snack/);
    if (brk) meals.push(brk > 1 ? "both breaks" : "the break");
    if (has(/reception|hors/)) meals.push("the reception");
    if (has(/dinner/)) meals.push("dinner");
    var list = meals.length > 1 ? meals.slice(0, -1).join(", ") + " and " + meals[meals.length - 1] : meals[0] || "";
    var plural = meals.length > 1 || /both/.test(list), bev = has(/continuous|all day|beverage/);
    var who = e.contact || "the group", room = (e.rows[0] && e.rows[0].room) || "The room";
    var food;
    if (list) {
      food = pick(SAY.food, i, 1, [list, plural]);
      if (bev) { var b = pick(SAY.bev, i, 2); food = i % 2 ? food.slice(0, -1) + ", and " + b + "." : food + " " + CAP(b) + "."; }
    } else food = pick(SAY.set, i, 1, [room, bev]);
    var open = pick(/final day/i.test(e.name) ? SAY.last : SAY.open, i, 0), bar = has(/bar/) ? pick(SAY.bar, i, 3) : "";
    var said = pick(SAY.happy, i, 4, [who]), happy = CAP(said), ok = pick(SAY.ok, i, 5);
    // sentence order changes from event to event too
    var shapes = [[open, food, bar, happy, ok], [food, bar, happy, ok], [open, ok, food, bar, happy],
      [food, bar, ok.slice(0, -1) + ", and " + said], [happy, food, bar, ok, open]];
    var shape = shapes[(i + DAY) % shapes.length];
    if (/final day/i.test(e.name) && shape.indexOf(open) < 0) shape = [open].concat(shape);   // a final day always says so
    return shape.filter(Boolean).join(" ");
  }
  function locked() { return !!saved.finalizedAt; }
  function render() {
    var dis = locked() ? " disabled" : "", h = "";
    var inp = function (ei, f, label, ph) {
      var e = events[ei];
      return '<div class="cr-f' + (f == "served" ? " blank" : "") + '"><label>' + label + '</label><input type="text" data-ei="' + ei + '" data-f="' + f + '" value="' + esc(e[f]) + '"' + (ph ? ' placeholder="' + ph + '"' : "") + dis + "></div>";
    };
    var area = function (ei, f, label, ph) {
      return "<div><label>" + label + '</label><textarea data-ei="' + ei + '" data-f="' + f + '" placeholder="' + ph + '"' + dis + ">" + esc(events[ei][f]) + "</textarea></div>";
    };
    events.forEach(function (e, ei) {
      var showBar = e.bar || e.added;
      h += '<section class="cr-sec"><div class="cr-sec-h"><span class="n">' + (ei + 1 < 10 ? "0" : "") + (ei + 1) + "</span>" +
        '<input type="text" data-ei="' + ei + '" data-f="name" value="' + esc(e.name) + '" placeholder="Group name" aria-label="Group name"' + dis + ">" +
        (locked() ? "" : '<button class="cr-x" type="button" data-rm="' + ei + '">Remove</button>') + "</div>" +
        '<div class="cr-grid">' + inp(ei, "mgr", "Event Manager") + inp(ei, "room", "Room") + inp(ei, "time", "Time", "Start - Finish") +
        inp(ei, "gtd", "Guaranteed") + inp(ei, "served", "Number Served") + (showBar ? inp(ei, "bar", "Bar Type", "None") : '<div class="cr-f"></div>') + "</div>" +
        '<div class="cr-tx"><div class="cr-two">' + area(ei, "plates", "Special Plates", "None") + area(ei, "svc", "Service Notes", "Optional") + area(ei, "guest", "Guest Comments", "Optional") + "</div>" +
        '</div><div class="cr-tx notes">' + area(ei, "note", "Notes", "") + "</div></section>";
    });
    $("cr-events").innerHTML = h || '<p class="cr-empty">No events on the Rundown for today. Use Add event.</p>';
    $("cr-add-row").hidden = locked();
    var gone = base.filter(function (e) { return saved.removed.indexOf(e.id) > -1; });
    $("cr-restore").innerHTML = gone.length && !locked() ? "Removed: " + gone.map(function (e) { return esc(e.name); }).join(", ") + ' · <a id="cr-undo">Restore</a>' : "";
    $("cr-fin").disabled = locked() || !events.length;
    if (locked()) { $("cr-lock").textContent = "Finalized " + stamp(new Date(saved.finalizedAt)) + ". Report is locked."; $("cr-fin-n").textContent = "Already finalized"; }
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(saved)); } catch (e) {} }
  $("cr-events").addEventListener("input", function (ev) {
    var t = ev.target; if (locked() || t.dataset.f == null) return;
    var e = events[+t.dataset.ei], f = t.dataset.f; e[f] = t.value;
    if (e.added) { var a = saved.added.filter(function (x) { return x.id == e.id; })[0]; if (a) a[f] = t.value; }
    else { (saved.edits[e.id] = saved.edits[e.id] || {})[f] = t.value; }
    save();
  });
  document.querySelector(".cr-paper").addEventListener("click", function (ev) {
    if (locked()) return;
    var t = ev.target;
    if (t.dataset.rm != null) {
      var e = events[+t.dataset.rm];
      if (!confirm("Remove " + (e.name || "this event") + " from tonight's report?")) return;
      if (e.added) saved.added = saved.added.filter(function (x) { return x.id != e.id; });
      else saved.removed.push(e.id);
      save(); assemble(); render();
    } else if (t.id == "cr-undo") { saved.removed = []; save(); assemble(); render(); }
    else if (t.id == "cr-add") {
      var n = {id: "added-" + Date.now(), name: "", mgr: "", room: "", time: "", gtd: "", served: "", bar: "", plates: "", svc: "", guest: ""};
      n.note = recap({name: "", contact: "", rows: []}, events.length);
      saved.added.push(n); save(); assemble(); render();
      var ins = $("cr-events").querySelectorAll('input[data-f="name"]'); if (ins.length) ins[ins.length - 1].focus();
    }
  });
  function stamp(d) {
    return d.toLocaleDateString("en-US", {timeZone: "America/Chicago", month: "short", day: "numeric", year: "numeric"}) + ", " +
      d.toLocaleTimeString("en-US", {timeZone: "America/Chicago", hour: "numeric", minute: "2-digit"}) + " CT";
  }
  var LONG = new Date(ISO + "T12:00:00Z").toLocaleDateString("en-US", {timeZone: "UTC", weekday: "long", month: "long", day: "numeric", year: "numeric"});

  // ── PDF (letter, Helvetica). Built here in the page; there is no local file server, so it saves as a browser download. ──
  var meas = document.createElement("canvas").getContext("2d");
  function width(s, size, bold) { meas.font = (bold ? "bold " : "") + size + "px Helvetica, Arial, sans-serif"; return meas.measureText(s).width; }
  function wrap(s, size, bold, max) {
    var out = [];
    String(s).split("\n").forEach(function (para) {
      var cur = "";
      para.split(" ").forEach(function (w) {
        while (width(w, size, bold) > max && w.length > 1) {   // a word wider than the column is split across lines
          var n = w.length - 1; while (n > 1 && width(w.slice(0, n), size, bold) > max) n--;
          if (cur) { out.push(cur); cur = ""; }
          out.push(w.slice(0, n)); w = w.slice(n);
        }
        var t = cur ? cur + " " + w : w;
        if (width(t, size, bold) <= max || !cur) cur = t; else { out.push(cur); cur = w; }
      });
      out.push(cur);
    });
    return out;
  }
  function pdfStr(s) {
    s = String(s).replace(/[\u2018\u2019]/g, "'").replace(/[\u201c\u201d]/g, '"').replace(/[\u2014\u2013]/g, "-").replace(/\u2026/g, "...");
    var o = "";
    for (var i = 0; i < s.length; i++) {
      var c = s.charCodeAt(i), ch = s[i];
      if (ch == "\\" || ch == "(" || ch == ")") o += "\\" + ch;
      else if (c >= 32 && c < 127) o += ch;
      else if (c >= 160 && c <= 255) o += "\\" + c.toString(8);
      else if (c == 8226) o += "\\225";
      else o += "?";
    }
    return "(" + o + ")";
  }
  function buildPdf(finalAt) {
    var W = 612, H = 792, M = 50, pages = [], ops = "", y = 0;
    function page() { if (ops) pages.push(ops); ops = ""; y = H - M; }
    function need(h) { if (y - h < M) page(); }
    // F1 Helvetica, F2 Helvetica-Bold, F3 Times-Bold (titles)
    function text(x, s, size, f) { ops += "BT /F" + (f || 1) + " " + size + " Tf " + x.toFixed(1) + " " + y.toFixed(1) + " Td " + pdfStr(s) + " Tj ET\n"; }
    function center(s, size, f) { meas.font = (f == 1 ? "" : "bold ") + size + "px " + (f == 3 ? "Times New Roman, Times, serif" : "Helvetica, Arial, sans-serif"); text((W - meas.measureText(s).width) / 2, s, size, f); }
    function para(x, s, size, max, lead) { wrap(s, size, false, max).forEach(function (l) { need(lead); y -= lead; text(x, l, size, 1); }); }
    function line(x0, x1, g, w) { ops += g + " G " + w + " w " + x0.toFixed(1) + " " + y.toFixed(1) + " m " + x1.toFixed(1) + " " + y.toFixed(1) + " l S 0 G\n"; }
    function band(h) { ops += "0.08 0.125 0.165 rg " + M + " " + (y - h).toFixed(1) + " " + (W - 2 * M) + " " + h + " re f 0 g\n"; }
    page();
    y -= 26; center("Banquet Captain Report", 24, 3);
    y -= 17; center("Westin Austin at The Domain", 11.5, 1);
    y -= 20; center(LONG + "      Captain: Jason      Manager: Hector", 9.5, 1);
    y -= 10; line(M, W - M, 0.1, 1.2);
    var colW = (W - 2 * M) / 3;
    events.forEach(function (e, i) {
      need(150); y -= 22;
      band(22); y -= 15; ops += "1 g\n"; text(M + 10, (i + 1 < 10 ? "0" : "") + (i + 1) + "   " + (e.name || "Event"), 12, 2); ops += "0 g\n"; y -= 7;
      var cells = [["EVENT MANAGER", e.mgr], ["ROOM", e.room], ["TIME", e.time], ["GUARANTEED", e.gtd], ["NUMBER SERVED", e.served], e.bar || e.added ? ["BAR TYPE", e.bar || "None"] : null];
      [cells.slice(0, 3), cells.slice(3)].forEach(function (row) {
        var lines = row.map(function (c) { return c ? wrap(c[1] || "", 10, true, colW - 14) : []; }), n = Math.max(1, Math.max.apply(null, lines.map(function (l) { return l.length; })));
        y -= 14; row.forEach(function (c, k) { if (c) text(M + 4 + k * colW, c[0], 7.5, 2); });
        for (var j = 0; j < n; j++) { y -= 12; lines.forEach(function (l, k) { if (l[j]) text(M + 4 + k * colW, l[j], 10, 2); }); }
        if (row[1] && row[1][0] == "NUMBER SERVED" && !e.served) line(M + 4 + colW, M + colW * 2 - 14, 0.4, 0.6);
        y -= 5; line(M, W - M, 0.82, 0.5);
      });
      [["SPECIAL PLATES", e.plates], ["SERVICE NOTES", e.svc], ["GUEST COMMENTS", e.guest], ["NOTES", e.note]].forEach(function (p) {
        if (!p[1]) return;
        need(28); y -= 13; text(M + 4, p[0], 7.5, 2); para(M + 4, p[1], 10, W - 2 * M - 8, 13);
      });
    });
    page();
    var objs = ["<< /Type /Catalog /Pages 2 0 R >>", "", "<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>",
      "<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>", "<< /Type /Font /Subtype /Type1 /BaseFont /Times-Bold /Encoding /WinAnsiEncoding >>"], kids = [];
    pages.forEach(function (p, i) {
      var foot = "BT /F1 8 Tf " + M + " 30 Td " + pdfStr("Banquet Captain Report " + ISO + "    Finalized " + stamp(finalAt) + "    Page " + (i + 1) + " of " + pages.length) + " Tj ET\n", body = p + foot;
      objs.push("<< /Length " + body.length + " >>\nstream\n" + body + "endstream");
      objs.push("<< /Type /Page /Parent 2 0 R /MediaBox [0 0 " + W + " " + H + "] /Resources << /Font << /F1 3 0 R /F2 4 0 R /F3 5 0 R >> >> /Contents " + objs.length + " 0 R >>");
      kids.push(objs.length + " 0 R");
    });
    objs[1] = "<< /Type /Pages /Kids [" + kids.join(" ") + "] /Count " + kids.length + " >>";
    objs.push("<< /Title " + pdfStr("Banquet Captain Report " + ISO) + " /Author (Jason) /Producer (Banquet Bot) >>");
    var out = "%PDF-1.4\n", offs = [];
    objs.forEach(function (o, i) { offs.push(out.length); out += (i + 1) + " 0 obj\n" + o + "\nendobj\n"; });
    var xref = out.length;
    out += "xref\n0 " + (objs.length + 1) + "\n0000000000 65535 f \n" + offs.map(function (o) { return ("0000000000" + o).slice(-10) + " 00000 n \n"; }).join("");
    out += "trailer\n<< /Size " + (objs.length + 1) + " /Root 1 0 R /Info " + objs.length + " 0 R >>\nstartxref\n" + xref + "\n%%EOF\n";
    return new Blob([out], {type: "application/pdf"});
  }
  $("cr-fin").onclick = function () {
    if (locked() || !events.length) return;
    if (!confirm("Finalize today's Captain Report? It locks and can't be edited after this.")) return;
    var at = new Date();
    saved.finalizedAt = at.toISOString(); saved.snapshot = events; save(); render();
    var a = document.createElement("a"), url = URL.createObjectURL(buildPdf(at));
    a.href = url; a.download = "Captain_Report_" + ISO + ".pdf"; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
    $("cr-lock").textContent += " Saved Captain_Report_" + ISO + ".pdf to Downloads. Move it into banquet-bot/reports.";
  };

  $("cr-date").textContent = LONG;
  fetch("rundown.html", {cache: "no-cache"}).then(function (r) { return r.text(); }).then(function (t) {
    var doc = new DOMParser().parseFromString(t, "text/html"), sec = doc.querySelector('.day-section[data-date="' + ISO + '"]');
    // once finalized, the report stays exactly as it was locked, even if the Rundown changes later
    if (locked() && saved.snapshot && saved.snapshot.length && saved.snapshot[0].gtd !== undefined) events = saved.snapshot;
    else { if (sec) readEvents(sec); assemble(); }
    render();
  }).catch(function (err) { console.error("[captain-report]", err); $("cr-events").innerHTML = '<p class="cr-empty">Could not load the Rundown.</p>'; });
})();
</script>
