<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#101820">
<link rel="icon" href="favicon-32.png" sizes="32x32">
<title>Captain Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/bb-shell.css">
<style>
.cr{max-width:1100px;margin:auto;padding:22px 18px 60px;font-family:Manrope,Arial,sans-serif;color:#e9f4ff}
.cr h1{font:500 32px 'Barlow Condensed',sans-serif;letter-spacing:.5px;margin:6px 0 2px;color:#edf5ff}
.cr .eyebrow{font-size:9px;color:#9eb8cb;letter-spacing:1.6px}
.cr .sub{font-size:12px;color:#b1c8d9;margin:0 0 14px}
.cr-note{font-size:11px;color:#9fbdd1;margin:6px 0}
.cr-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:12px 0 18px}
.cr-btn{position:relative;border:1px solid #4f7a99;border-top-color:#8bd1ff99;border-radius:3px 13px 3px 3px;background:radial-gradient(ellipse at 100% 0,#5aa9d838,transparent 75%),linear-gradient(135deg,#22384a,#15232d);box-shadow:0 8px 14px #00000040,inset 0 1px #ffffff0d;color:#edf5ff;font:500 20px 'Barlow Condensed',sans-serif;letter-spacing:.4px;padding:10px 18px;cursor:pointer;text-transform:uppercase}
.cr-btn small{display:block;font:11px Manrope,Arial,sans-serif;letter-spacing:0;color:#b1c8d9;text-transform:none}
.cr-btn[disabled]{opacity:.5;cursor:default}
.cr-card{background:linear-gradient(135deg,#263d50,#172630);border:1px solid #51728b;border-top-color:#81ccff88;border-radius:3px 13px 3px 3px;box-shadow:0 10px 15px #00000040,inset 0 1px #ffffff0d;padding:11px 13px;margin:0 0 9px}
.cr-card h2{font:600 19px 'Barlow Condensed',sans-serif;letter-spacing:.4px;margin:0 0 2px;color:#edf5ff;text-transform:uppercase}
.cr-mgr{font-size:11px;color:#b1c8d9;margin-bottom:8px}
.cr-t{width:100%;border-collapse:collapse;font-size:12.5px;color:#d6e8f6}
.cr-t th{text-align:left;font-size:9.5px;letter-spacing:.1em;color:#8bd1ff;text-transform:uppercase;padding:4px 6px;font-weight:700}
.cr-t td{padding:4px 6px;border-top:1px solid #ffffff12;vertical-align:top}
.cr-t td.tm{white-space:nowrap;width:150px}
.cr-t input{width:130px;background:#0b151e;border:1px solid #527b995e;border-radius:6px;color:#edf5ff;font:12px Manrope,Arial,sans-serif;padding:4px 6px}
.cr-kv{display:grid;grid-template-columns:70px 1fr;gap:6px 10px;margin-top:8px;font-size:12px;color:#d6e8f6;align-items:start}
.cr-kv b{font-size:9.5px;letter-spacing:.1em;color:#8bd1ff;text-transform:uppercase;padding-top:5px}
.cr-kv textarea{width:100%;box-sizing:border-box;min-height:44px;background:#0b151e;border:1px solid #527b995e;border-radius:6px;color:#edf5ff;font:12px/1.45 Manrope,Arial,sans-serif;padding:5px 7px;resize:vertical}
.cr input[disabled],.cr textarea[disabled]{opacity:.8;border-color:transparent;background:transparent;resize:none}
.cr-lock{font-size:12px;color:#f2c879}
</style>
<script src="theme.js?v=1027i"></script>
</head>
<body class="cr-body">
<header class="bb-header">
  <div class="bb-brand"><span class="bb-mark">bb</span>BANQUET BOT</div>
  <div class="hdr-actions"><a class="reference-trigger" href="index.html" style="display:flex;align-items:center;min-height:40px;border:1px solid #5983a16b;background:linear-gradient(135deg,#273e50,#1b2a36);border-radius:8px;padding:8px 10px;color:#cce9fb;font:11px Manrope,Arial,sans-serif;text-decoration:none">Home</a></div>
</header>
<div class="cr">
  <div class="eyebrow">WESTIN AUSTIN · THE DOMAIN</div>
  <h1>CAPTAIN REPORT</h1>
  <p class="sub" id="cr-sub">End of shift summary built from the Rundown for today.</p>
  <div id="cr-gate" class="cr-note" hidden>Captain Report is for Jason only.</div>
  <div id="cr-main" hidden>
    <div class="cr-bar">
      <button class="cr-btn" id="cr-fin" type="button" disabled>End Shift / Finalize<small id="cr-fin-n">Locks the report and saves the PDF</small></button>
      <span class="cr-lock" id="cr-lock"></span>
    </div>
    <div id="cr-events"></div>
  </div>
</div>
<script>
(function () {
  var who = null; try { who = JSON.parse(localStorage.getItem("bb-hsm-who") || "null"); } catch (e) {}
  // Same gate as Print Signs: desktop width only, and here Jason only.
  if (!who || who.name != "Jason" || window.innerWidth < 1000) {
    if (who && who.name == "Jason" && window.innerWidth < 1000) document.getElementById("cr-gate").textContent = "Captain Report is on desktop only.";
    document.getElementById("cr-gate").hidden = false; return; }
  document.getElementById("cr-main").hidden = false;

  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return {"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]; }); };
  // plain text, with the Rundown's em and en dashes written as hyphens
  var clean = function (s) { return String(s || "").replace(/\s*[\u2014\u2013]\s*/g, function (m) { return /\s/.test(m) ? " - " : "-"; }).replace(/[ \t]+/g, " ").trim(); };
  var txt = function (n) { return n ? clean(n.textContent.replace(/\s+/g, " ")) : ""; };
  var lines = function (n) { if (!n) return ""; var c = n.cloneNode(true); [].forEach.call(c.querySelectorAll("br"), function (b) { b.replaceWith("\n"); });
    return c.textContent.split("\n").map(function (l) { return clean(l.replace(/\s+/g, " ")); }).filter(Boolean).join("\n"); };
  var ISO = new Date().toLocaleDateString("en-CA", {timeZone: "America/Chicago"});
  var KEY = "bb-capt-report-" + ISO;
  var saved = {}; try { saved = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) {}
  var events = [];

  // ── read today's cards from the Rundown (the BEO transcription the other pages use) ──
  function readEvents(sec) {
    events = [];
    [].forEach.call(sec.querySelectorAll(".event-card"), function (card) {
      var rows = [].map.call(card.querySelectorAll(".svc-row"), function (r) {
        var tag = r.querySelector(".svc-top .tag");
        return {time: txt(r.querySelector(".svc-time")), svc: txt(tag), room: txt(r.querySelector(".room-pill")), count: txt(r.querySelector(".gtd-pill")),
          booking: !!tag && tag.className.trim() == "tag" && /No F&B/i.test(tag.textContent)};
      });
      // Same display rule as the Rundown: a room's "No F&B" booking row is hidden when that room has food or beverage.
      var fed = {}; rows.forEach(function (r) { if (!r.booking) fed[r.room] = 1; });
      rows = rows.filter(function (r) { return !(r.booking && fed[r.room]); });
      var foot = {};
      [].forEach.call(card.querySelectorAll(".card-foot .foot-row"), function (f) { foot[txt(f.querySelector(".foot-key")).toUpperCase()] = lines(f.querySelector(".foot-val")); });
      var mgr = txt(card.querySelector(".badge-mgr")).replace(/^MGR:\s*/i, "");
      events.push({name: txt(card.querySelector(".card-group")), mgr: mgr, rows: rows, setup: foot.ROOM || "", note: foot.NOTE || ""});
    });
    // saved edits for today (counts and notes) win over the Rundown values; matched by event name and by row time, service and room
    (saved.edits || []).forEach(function (ed) {
      var e = events.filter(function (x) { return x.name == ed.name; })[0]; if (!e) return;
      if (ed.note != null) e.note = ed.note;
      (ed.counts || []).forEach(function (c) { e.rows.forEach(function (r) { if (rowKey(r) == c.k) r.count = c.v; }); });
    });
  }
  function rowKey(r) { return r.time + "|" + r.svc + "|" + r.room; }
  function locked() { return !!saved.finalizedAt; }
  function render() {
    var dis = locked() ? " disabled" : "", h = "";
    events.forEach(function (e, ei) {
      h += '<div class="cr-card"><h2>' + esc(e.name) + "</h2>" + (e.mgr ? '<div class="cr-mgr">Manager: ' + esc(e.mgr) + "</div>" : "") +
        '<table class="cr-t"><tr><th>Time</th><th>Service</th><th>Room</th><th>Count</th></tr>' +
        e.rows.map(function (r, ri) {
          return '<tr><td class="tm">' + esc(r.time) + "</td><td>" + esc(r.svc) + "</td><td>" + esc(r.room) + '</td><td><input type="text" data-ei="' + ei + '" data-ri="' + ri + '" value="' + esc(r.count) + '" aria-label="Count"' + dis + "></td></tr>";
        }).join("") + "</table>" +
        '<div class="cr-kv">' + (e.setup ? "<b>Setup</b><div>" + esc(e.setup).replace(/\n/g, "<br>") + "</div>" : "") +
        '<b>Notes</b><textarea data-note="' + ei + '" aria-label="Notes"' + dis + ">" + esc(e.note) + "</textarea></div></div>";
    });
    $("cr-events").innerHTML = h || '<p class="cr-note">No events on the Rundown for today.</p>';
    $("cr-fin").disabled = locked() || !events.length;
    if (locked()) { $("cr-lock").textContent = "Finalized " + stamp(new Date(saved.finalizedAt)) + ". Report is locked."; $("cr-fin-n").textContent = "Already finalized"; }
  }
  function save() {
    saved.edits = events.map(function (e) { return {name: e.name, note: e.note, counts: e.rows.map(function (r) { return {k: rowKey(r), v: r.count}; })}; });
    try { localStorage.setItem(KEY, JSON.stringify(saved)); } catch (e) {}
  }
  $("cr-events").addEventListener("input", function (ev) {
    if (locked()) return;
    var t = ev.target;
    if (t.dataset.note != null) events[+t.dataset.note].note = t.value;
    else if (t.dataset.ri != null) events[+t.dataset.ei].rows[+t.dataset.ri].count = t.value;
    save();
  });
  function stamp(d) {
    return d.toLocaleDateString("en-US", {timeZone: "America/Chicago", month: "short", day: "numeric", year: "numeric"}) + ", " +
      d.toLocaleTimeString("en-US", {timeZone: "America/Chicago", hour: "numeric", minute: "2-digit"}) + " CT";
  }

  // ── PDF (letter, Helvetica). Built here in the page; there is no local file server, so it saves as a browser download. ──
  var meas = document.createElement("canvas").getContext("2d");
  function width(s, size, bold) { meas.font = (bold ? "bold " : "") + size + "px Helvetica, Arial, sans-serif"; return meas.measureText(s).width; }
  function wrap(s, size, bold, max) {
    var out = [];
    String(s).split("\n").forEach(function (para) {
      var cur = "";
      para.split(" ").forEach(function (w) {
        while (width(w, size, bold) > max && w.length > 1) {   // a word wider than the column is split across lines
          var n = w.length - 1; while (n > 1 && width(w.slice(0, n), size, bold) > max) n--;
          if (cur) { out.push(cur); cur = ""; }
          out.push(w.slice(0, n)); w = w.slice(n);
        }
        var t = cur ? cur + " " + w : w;
        if (width(t, size, bold) <= max || !cur) cur = t; else { out.push(cur); cur = w; }
      });
      out.push(cur);
    });
    return out;
  }
  function pdfStr(s) {
    s = String(s).replace(/[\u2018\u2019]/g, "'").replace(/[\u201c\u201d]/g, '"').replace(/[\u2014\u2013]/g, "-").replace(/\u2026/g, "...");
    var o = "";
    for (var i = 0; i < s.length; i++) {
      var c = s.charCodeAt(i), ch = s[i];
      if (ch == "\\" || ch == "(" || ch == ")") o += "\\" + ch;
      else if (c >= 32 && c < 127) o += ch;
      else if (c >= 160 && c <= 255) o += "\\" + c.toString(8);
      else if (c == 8226) o += "\\225";
      else o += "?";
    }
    return "(" + o + ")";
  }
  function buildPdf(finalAt) {
    var W = 612, H = 792, M = 50, pages = [], ops = "", y = 0;
    function page() { if (ops) pages.push(ops); ops = ""; y = H - M; }
    function need(h) { if (y - h < M) page(); }
    function text(x, s, size, bold) { ops += "BT /" + (bold ? "F2" : "F1") + " " + size + " Tf " + x.toFixed(1) + " " + y.toFixed(1) + " Td " + pdfStr(s) + " Tj ET\n"; }
    function para(x, s, size, bold, max, lead) { wrap(s, size, bold, max).forEach(function (l) { need(lead); y -= lead; text(x, l, size, bold); }); }
    function rule() { need(8); y -= 6; ops += "0.6 G 0.5 w " + M + " " + y.toFixed(1) + " m " + (W - M) + " " + y.toFixed(1) + " l S 0 G\n"; }
    page();
    y -= 22; text(M, "Captain Report", 20, true);
    y -= 16; text(M, "Westin Austin at The Domain", 10, false);
    y -= 14; text(M, "Date: " + ISO + "    Captain: Jason    Finalized: " + stamp(finalAt), 10, false);
    rule();
    var C = [M, M + 120, M + 330, M + 420], CW = [115, 205, 85, W - M - (M + 420)];
    events.forEach(function (e) {
      need(60); y -= 10;
      para(M, e.name, 13, true, W - 2 * M, 16);
      if (e.mgr) para(M, "Manager: " + e.mgr, 9.5, false, W - 2 * M, 12);
      var head = function () { y -= 14; ["TIME", "SERVICE", "ROOM", "COUNT"].forEach(function (h, i) { text(C[i], h, 8, true); }); };
      need(28); head();
      e.rows.forEach(function (r) {
        var cells = [r.time, r.svc, r.room, r.count].map(function (v, i) { return wrap(v || "", 9.5, false, CW[i]); });
        var n = Math.max.apply(null, cells.map(function (c) { return c.length; }));
        if (y - (n * 12 + 2) < M) { page(); head(); }
        y -= 2;
        for (var k = 0; k < n; k++) { y -= 12; cells.forEach(function (c, i) { if (c[k]) text(C[i], c[k], 9.5, false); }); }
      });
      if (e.setup) { need(26); y -= 6; para(M, "SETUP", 8, true, 100, 11); para(M, e.setup, 9.5, false, W - 2 * M, 12); }
      if (e.note) { need(26); y -= 6; para(M, "NOTES", 8, true, 100, 11); para(M, e.note, 9.5, false, W - 2 * M, 12); }
      rule();
    });
    page();
    var objs = ["<< /Type /Catalog /Pages 2 0 R >>", "", "<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>",
      "<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>"], kids = [];
    pages.forEach(function (p, i) {
      var foot = "BT /F1 8 Tf " + M + " 30 Td " + pdfStr("Captain Report " + ISO + "    Page " + (i + 1) + " of " + pages.length) + " Tj ET\n", body = p + foot;
      objs.push("<< /Length " + body.length + " >>\nstream\n" + body + "endstream");
      objs.push("<< /Type /Page /Parent 2 0 R /MediaBox [0 0 " + W + " " + H + "] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents " + objs.length + " 0 R >>");
      kids.push(objs.length + " 0 R");
    });
    objs[1] = "<< /Type /Pages /Kids [" + kids.join(" ") + "] /Count " + kids.length + " >>";
    objs.push("<< /Title " + pdfStr("Captain Report " + ISO) + " /Author (Jason) /Producer (Banquet Bot) >>");
    var out = "%PDF-1.4\n", offs = [];
    objs.forEach(function (o, i) { offs.push(out.length); out += (i + 1) + " 0 obj\n" + o + "\nendobj\n"; });
    var xref = out.length;
    out += "xref\n0 " + (objs.length + 1) + "\n0000000000 65535 f \n" + offs.map(function (o) { return ("0000000000" + o).slice(-10) + " 00000 n \n"; }).join("");
    out += "trailer\n<< /Size " + (objs.length + 1) + " /Root 1 0 R /Info " + objs.length + " 0 R >>\nstartxref\n" + xref + "\n%%EOF\n";
    return new Blob([out], {type: "application/pdf"});
  }
  $("cr-fin").onclick = function () {
    if (locked() || !events.length) return;
    if (!confirm("Finalize today's Captain Report? It locks and can't be edited after this.")) return;
    var at = new Date();
    saved.finalizedAt = at.toISOString(); saved.snapshot = events; save(); render();
    var a = document.createElement("a"), url = URL.createObjectURL(buildPdf(at));
    a.href = url; a.download = "Captain_Report_" + ISO + ".pdf"; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
    $("cr-lock").textContent += " Saved Captain_Report_" + ISO + ".pdf to Downloads. Move it into banquet-bot/reports.";
  };

  $("cr-sub").textContent = "End of shift summary built from the Rundown for " + new Date(ISO + "T12:00:00Z").toLocaleDateString("en-US", {timeZone: "UTC", weekday: "long", month: "long", day: "numeric"}) + ".";
  fetch("rundown.html", {cache: "no-cache"}).then(function (r) { return r.text(); }).then(function (t) {
    var doc = new DOMParser().parseFromString(t, "text/html"), sec = doc.querySelector('.day-section[data-date="' + ISO + '"]');
    // once finalized, the report stays exactly as it was locked, even if the Rundown changes later
    if (locked() && saved.snapshot) events = saved.snapshot; else if (sec) readEvents(sec);
    render();
  }).catch(function (err) { console.error("[captain-report]", err); $("cr-events").innerHTML = '<p class="cr-note">Could not load the Rundown.</p>'; });
})();
</script>
</body>
</html>
